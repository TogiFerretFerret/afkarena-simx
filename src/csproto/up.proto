  spotlight   = 1; // 新闻
  misc        = 2; // 旧闻
  self        = 3; // 我的
}

message req_rt_pvp {
  optional req_msg                open_panel           = 1; // 打开界面
  // 报名相关-
  optional req_msg                apply                = 2; // 报名 传入 cluster_id
  optional req_msg                quit                 = 3; // 退出匹配
  // 对局中--
  optional req_rt_pvp_end_battle  end_battle           = 4; // 战斗结束,需要所有活着的玩家发end_battle
  optional req_msg                recv_rewards         = 5; // 领取奖励
  // 外围系统
  optional req_msg                query_his            = 6; // 历史记录
  optional bool                   query_rank_board     = 7; // 请求排行榜,传入参数为bool(是否为好友榜)
  // 切磋
  optional uint64                 invite               = 8; // 组队邀请对战
  optional req_msg                leave_team           = 9; // 离开队伍
  optional uint64                 accept               = 10; // 接收邀请
  optional req_msg                start                = 11; // 开始组队切磋游戏
  optional uint32                 set_fast_rt_region   = 12; // 设置最佳的 rt 区域
  optional req_edit_card_group    edit_card_group      = 13; // 编辑牌组详情
  optional req_msg                guild_top_info       = 14; // 本公会排名最高的人数据
  optional uint64                 query_team           = 15; // 查询排行榜中玩家的默认阵容和卡牌
  optional req_msg                manual_robot         = 16; // 真人匹配超出一定时间可以选择打机器人
}

message req_rt_pvp_end_battle {
  optional round_op         round_op        = 1; // 战斗的操作,如果是机器人战斗,那么会从这里返回
  optional t_battle_result  battle_result   = 2; // 机器人战斗时候返回
}

message req_edit_card_group {
  required t_edit_card_group  operate             = 1;
  required uint32             card_group          = 2;
  optional card_group_detail  card_group_detail   = 3;
}

enum t_edit_card_group {
  edit             = 1; // 新增、修改英雄和卡片
  topping          = 2; // 置顶
  delete           = 3; // 删除
  set_card_group   = 4; // 设置战斗卡牌
  rename           = 5; // 重命名
}

