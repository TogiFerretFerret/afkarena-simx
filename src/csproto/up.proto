  optional req_msg                  open_handle_apply_panel      = 2; // 审批申请界面
  optional uint64                   apply                        = 3; // 发起互助申请
  optional uint64                   cancel_apply                 = 4; // 取消互助申请
  optional req_assist_handle_apply  handle_apply                 = 5; // 处理互助申请
  optional req_msg                  open_special_winners_panel   = 6; // 打开主宰列表界面
  optional req_msg                  open_assist_log_panel        = 7; // 打开历史帮助界面
