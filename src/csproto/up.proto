message req_msg {} // 空的协议结构体

message req_end_battle {
  required t_battle_result  result              = 1; // 战斗结果
  repeated battle_round     rounds              = 2; // 每一局的信息
  required string           cli_ver             = 3; // 客户端版本号
  optional uint64           param               = 4; // 公会boss传伤害, 三消分数
  repeated uint64           params              = 5; // slg用于双boss伤害
  repeated uint32           rand_seed_offsets   = 6; // 随机种子在每队战斗中的偏移量，多队战斗使用该字段
  optional uint64           oppo_gs             = 7; // 敌方战力，仅推关、推塔战斗时该字段有值
  repeated uint64           oppo_gs_list        = 8; // 推关多队战力打点需求
}

message nonlocal {
  required uint32  platform   = 1;
}

message req_bad_guy {
  optional req_bad_guy_report  report         = 1;
  optional req_ingame_report   ingame_report  = 2;  // 决明系统举报日志上报
}

message req_bad_guy_report {
  required uint64           uid         = 1;
  required t_report_reason  reason_id   = 2;
}

message req_ingame_report {
  required uint64           uid                   = 1;  // 举报对象
  required string           report_scene          = 2;  // 举报场景大类
  required string           report_sub_scene      = 3;  // 举报场景大类下的具体场景
  required string           content               = 4;  // 消息内容
  required uint64           content_type          = 5;  // 消息类型
  required uint64           content_id            = 6;
  required uint64           content_create_time   = 7;  /// 消息创建时间
}

message req_svr_list {
  required t_platform  platform      = 1;
  required t_os        os            = 2;
  required string      open_id       = 3;
  required string      htoken        = 4;
  required string      cli_version   = 5; // 客户端版本号,用来跟服务器做比对用
}

message req_sdk_login { //返回消息可能时错误码
  required t_platform  platform          = 1;
  optional string      open_id           = 2;
  required string      token             = 3; // 微信登录时传wx.login返回给客户端的code
  optional uint32      svr_id            = 4; // 如果不传的话，默认取最近登陆一次svr_id, 或者最新服svr_id
  optional bool        is_debug          = 5 [ default = false ]; // true: debug 该字段对wechat登陆无效
  optional nonlocal    nonlocal          = 6;
  optional t_region    t_region          = 7; // 客户端手动选区时候，需要传入该字段
  optional string      lilither_region   = 8; // sdk 大会员打点字段
  optional string      lilither_id       = 9; // sdk 大会员id
  optional t_lang      lang              = 10; //语言
}

// 与客户端讨论过, 客户端不会传undefined, 只会传空字符串
message req_login { //返回消息可能是错误码
  required t_platform  platform      = 1;
  required t_os        os            = 2;
  required string      open_id       = 3;
  required uint32      svr_id        = 4;
  required string      htoken        = 5;
  required string      cli_version   = 6; // 客户端版本号,用来跟服务器做比对用
  required int32       time_zone     = 7;
  required t_lang      lang          = 8;
  required string      push_id       = 9;
  required string      idfa          = 10;
  required string      google_aid    = 11;
  required string      android_id    = 12;
  required string      os_version    = 13;
  required string      app_version   = 14;
  required string      device        = 15;
  required string      channel_id    = 16;
  required string      package       = 17;
  optional string      avatar        = 18; // 微信登录时上传头像信息
  optional string      union_id      = 19; // 微信登录时取得的union_id
  optional string      name          = 20; // 微信登录时取得的用户昵称
  optional string      ip            = 21; // 登录时的ip信息
  optional string      line          = 22; // 线路
  optional string      hgame_id      = 23; // 客户端js脚本生成的设备唯一id，重新安装包会重新生成
  optional uint64      reborn_uid    = 24; // 登录使用的reborn_uid
  optional string      country_code  = 25; // 国家码
  optional string      mini_game_type       = 26; // 由某个小游戏导量进来的做标记
  optional string      push_device_token    = 27; // 推送用的device_token，登陆时传来，服务器转发给平台
  optional string      adjust_id            = 28; // 魂斗罗deep_link标识设备号
  optional uint64      charge_product_index = 29; // 产品线索号
}

message req_reconnect { //没登陆成功不要重连， 返回消息可能是错误码，no_reply表示重连成功
  required t_platform  platform      = 1;
  required string      open_id       = 2;
  required uint32      svr_id        = 3;
  required uint64      uid           = 4; // 防止未创建的用户使用重连协议
  required string      htoken        = 5;
  optional string      cli_version   = 6; // 客户端版本号,用来跟服务器做比对用
  repeated req_md5     md5s          = 7;
  optional string      ip            = 8; // 登录时的ip信息
  optional string      hgame_id      = 9; // 客户端js脚本生成的设备唯一id，重新安装包会重新生成
}
message req_md5 {
  required string  type   = 1; // Type -> "currency"|"item"|"equip"|"hero"
  required string  md5    = 2;
}

message req_bag {
  optional req_msg  req_open_bag   = 1;
}

message req_unit {
  optional req_up_level            req_up_level                     = 1; // 单个英雄升级
  // 品阶
  optional req_up_quality          req_up_quality                   = 2; // 单个英雄升阶
  repeated req_up_quality          req_up_quality_one_key           = 3; // 一键升阶
  optional uint64                  req_up_cross_quality             = 4; // 虚空英雄升阶,传升阶英雄的ID
  // 装备
  optional req_wear_equip          req_wear_equip                   = 5; // 穿装备
  optional req_rm_equip            req_rm_equip                     = 6; // 脱装备
  optional uint32                  req_rm_all_equip                 = 7; // 卸下所有装备
  optional req_wear_best_equip     req_wear_best_equip              = 8; // 一键穿装备
  optional req_exchange_equip      req_exchange_equip               = 9; // 交换装备
  // 英雄
  optional uint64                  req_lock_hero                    = 10; // 英雄加锁
  optional uint64                  req_unlock_hero                  = 11; // 英雄解锁
  optional req_unit_query_hero     req_query_hero                   = 12; // 查询英雄
  // 神器
  optional req_wear_artifact       req_wear_artifact                = 13; // 穿神器
  optional uint32                  req_rm_artifact                  = 14; // 脱神器
  repeated req_wear_artifact       req_batch_wear_artifact          = 15; // 给多个英雄穿神器（用于战备界面优化，一键复制神器配置）
  optional req_msg                 req_pentagram_hids               = 16; // 共鸣水晶英雄
  repeated uint32                  req_build_balance_trial_heroes   = 17; // 构造试用英雄
  optional req_set_assist_hero_id  req_set_assist_hero_id           = 18; // 设置女仆助力英雄
}

message req_wear_best_equip {
  required uint64  hero_id          = 1; // 英雄唯一id
  required bool    tag_first_flag   = 2; // 玩家选择优先穿带有种族标记的装备
}

enum t_maid_src {
  normal                     = 1;
  maze_assist                = 2; // 迷宫马车女仆跟随
  maze_team                  = 3; // 组队迷宫女仆跟随
  infinite_pve_assist        = 4; // 乱时之境普通pve女仆跟随
  stage                      = 5; // 推关
  deep_stage                 = 6; // 困难本
  single_dream               = 7; // 梦境
  infinite_hard_pve_assist   = 8; // 乱时之境困难pve女仆跟随
