  optional req_raid_ai_interact          ai_interact           = 12; // ai与格子的互动
  optional req_raid_set_diy_rewards      set_diy_rewards       = 13;
  optional string                        query_diy_rewards     = 14;
  optional req_set_heirlooms             set_heirlooms         = 15;
  optional req_get_rank_detail           get_rank_detail       = 16;
  optional req_raid_bet_gamble           bet_gamble            = 17;
  optional req_raid_buy_heirloom         buy_heirloom          = 18; // 遗物商店购买遗物
  optional req_raid_reset_heirloom_shop  reset_heirloom_shop   = 19; // 重置遗物商店,相当于一键出售
  optional req_raid_sell_heirloom        sell_heirloom         = 20; // 遗物商店操作,售出遗物
  optional req_raid_recv_all_rewards     recv_all_rewards      = 21; // 秘宝峡湾想要一起领取多个奖励
  optional req_raid_cmd                  trigger_condition     = 22; // 触发condition
  optional req_raid_finish_task          finish_task           = 23; // 完成任务
  optional req_mystic_tower              req_mystic_tower      = 24;
  optional string                        query_effect2cnt      = 25; // 查一个raid的effect2cnt
  optional req_raid_choice_session       choice_session        = 26; // 执行选项对话的effect
  optional req_raid_auto_condition       auto_condition        = 27; // 自动触发condition
  optional req_raid_pass_contra_raid_stage pass_contra_raid_stage = 28; // 魂斗罗通关stage后改变地块数据
  optional req_raid_batch_move           batch_move            = 29; // 批量移动
