  optional uint64                 send_guild_reward               = 60; // 模拟war结算公会发奖，传task_id：2001黄金耀都/2002黄金巨树（发皮肤+雕像+荣誉并打弹窗红点）

}

// 根据公会id增加军备竞赛活动积分
message req_war_gm_add_guild_arm_point {
  required uint64 guild_id = 1; // 公会id
  required uint64 point    = 2; // 增加的积分
}

message req_war_gm_assemble {
  required uint64 guard_city_tid    = 1; // 守军所在城池tid
  optional uint64 proclaim_city_tid = 2; // 宣战城tid assemble才需要传
  optional uint64 troop_cnt         = 3; // 队伍数量，不传则全部
}

message req_war_gm_set_durability {
  optional uint64 tid         = 1; // 地块id，不传则设置所有地块
  required uint64 durability  = 2; // 耐久度
}

// 起单场围攻：self_city_tid\target_city_tid必须同时指定，否则将随机生成; troop_cnt: 不指定的话，将出动本盟所有部队
message req_war_gm_start_besiege {
  optional uint64 self_city_tid   = 1; // 宣战城
  optional uint64 target_city_tid = 2; // 被宣战城
  optional uint64 troop_cnt       = 3; // 出动的队伍数量
}

message req_war_gm_update_task {
  required uint64              tid            = 1;
  optional uint64              progress_id    = 2;
  required uint64              progress       = 3;
  required t_war_fun_type      fun_type       = 4;
}

message req_war_gm_update_ally_task {
  required uint64              tid            = 1;
  optional uint64              progress_id    = 2;
  required uint64              progress       = 3;
  required t_war_fun_type      fun_type       = 4;
}

message reply_war_gm_member {
  optional uint64           uid       = 1;
  optional string           uin       = 2;
  optional uint64           map_id    = 3;
  optional uint64           ally_id   = 4;
  optional t_war_ally_title title     = 5;
  optional uint64           voke_tid  = 6;
  optional uint64           score     = 7; //匹配分
}
message reply_gm_war {
  repeated reply_war_map        war_maps            = 1;
  repeated reply_war_gm_member  members             = 2; // 查看机器人会返回这个
  optional uint64               create_besiege      = 3; // 返回创建围攻的ID（收到后发进入协议）
  optional reply_gm_besiege_log report_besiege_log  = 4; // 导出围攻的统计日志
  optional reply_gm_war_phase   phase_msg           = 5; // 各个阶段时间
}

message reply_gm_war_phase {
  optional string phases      = 1; // 大阶段
  optional string day_phases  = 2; // 小阶段
}

message reply_gm_besiege_log {
  optional string           csv_battle_log        = 1;
  optional string           csv_troop_log         = 2;
  optional string           csv_user_log          = 3;
}

message req_war_gm_move_troops {
  required uint64  from_city_id  = 1; // 迁出城
  required uint64  to_city_id    = 2; // 迁入城
  optional uint64  troop_cnt     = 3; // 迁出数量，不填的话全部迁走
}

message req_gm_add_assigned_order{
  required uint32  stage_id   = 1; // 二合活动的关卡id
  required uint32  order_id   = 2; // 二合活动的订单id
}

message req_gm_cof_trigger_explore_event {
  required t_cof_event event_type     = 1;
  optional uint64      event_group_id = 2;
}

message reply_gm_contra {
  optional  reply_contra_end_battle unlock_contra = 1; // 解锁至魂斗罗关卡
}

message req_gm_act_bond_send_gifts {
  required uint64 hero_tid = 1; // 英雄 TID
  required uint64 count    = 2; // 设置该英雄好感度目标值（绝对值，非增量）
}
message req_gm_act_farm {
  optional uint64                            add_seed          = 1; // 添加幼苗
  optional uint64                            add_water         = 2; // 添加水滴
  optional req_gm_act_farm_set_buy_times     set_buy_times     = 3; // 设置道具已购次数
  optional uint64                            plot_mature       = 4; // 地块成熟，0:一键成熟
  optional uint64                            unlock_album_item = 5; // 解锁图鉴道具
  optional req_gm_act_farm_set_album_reward  set_album_reward  = 6; // 设置图鉴奖励领取状态
  optional req_gm_act_farm_trigger_buff      trigger_buff      = 7; // 触发buff（英雄来访/地块事件）
  optional uint64                            clear_items       = 8; // 清空指定道具
}
message req_gm_act_farm_set_buy_times {
  required uint64 item_id = 1; // 道具ID
  required uint64 times   = 2; // 已购次数
}
message req_gm_act_farm_set_album_reward {
  required t_farm_album_reward      reward_type = 1; // 奖励类型
  required uint64                   reward_id   = 2; // 奖励ID，final传0
  required bool                     recv        = 3; // true=标为已领，false=清空
}
message req_gm_act_farm_trigger_buff {
  required uint64 buff_id = 1; // buff_id
  optional uint64 plot_id = 2; //  地块的buff传 地块id
}

message req_gm_act_farm_lottery {
  optional uint64 recvd_reward = 1; // 指定奖项id进行领奖
  optional uint64 set_distance = 2; // 设置总前进距离
}

message req_gm_guild_boat {
  optional req_msg add_boat   = 1; // 添加所有船道具x10
  optional uint64  arrive     = 2; // 指定槽位航线立即到达，传slot_pos
  optional uint64  add_assist = 3; // 指定槽位航线添加一个协助，传slot_pos
}

message req_gm_guild_turntable {
  repeated uint64 end_poses = 1; // 预设落点队列（棋盘位置 1~map最大值）：不当场抽奖；之后每次正常抽奖（每个 draw 请求一次，单抽/多抽同）按顺序取一个作为落点，其余（扣罗盘/发奖/日志/事件）走正常流程，用完恢复随机；再次设置整体覆盖，传空数组清空
}

