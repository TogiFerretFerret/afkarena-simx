//================================================ 联动英雄活动 GM begin ==================================================
// 联动英雄活动（首期怪兽8号联动）GM 面板；参照 req_gm_act_guild_arm 接入模式
// 一次调用只填一个子字段，act_cross_story_gm:gm/2 按 pattern 分派
// 支持同类型活动多开，act_id 必带以定位到具体活动实例
message req_gm_act_cross_story {
  required uint64                                    act_id                 = 1; // 活动ID（同类型多开定位，必带）
  optional req_gm_act_cross_story_set_choice_hero    set_choice_hero        = 2; // 设置选角状态（0=清除；仅记录不发英雄）
  optional uint64                                    pass_stage             = 3; // 置关卡通关（arg: stage_id；Boss 战果即刻计入公会讨伐实时统计）
  optional uint64                                    unpass_stage           = 4; // 撤销关卡通关（arg: stage_id）
  optional uint64                                    send_first_pass_reward = 5; // 强制补发首通奖励（arg: stage_id；仅测试环境，不校验已发）
  optional uint64                                    add_task_progress      = 6; // 补触发通关任务进度 +1（arg: stage_id）
  optional req_gm_act_cross_story_set_guild_recvd    set_guild_reward_recvd = 7; // 设置/清除公会讨伐档位奖励领取记录
  optional bool                                      reset                  = 8; // 重置本 act_id 玩家活动数据（true 触发；仅清指定活动，不影响其他并行活动）
  optional bool                                      query                  = 9; // 查询本 act_id 玩家活动数据全量快照（true 触发；结果打日志）
  optional bool                                      query_guild_progress   = 10; // 实时查询本 act_id 公会讨伐进度（true 触发；结果打日志）
  optional bool                                      query_red_dot          = 11; // 查询本 act_id 玩家相关红点（true 触发；结果打日志）
  optional bool                                      act_status             = 12; // 查询本 act_id 活动开关/开启天数（true 触发；结果打日志）
  optional req_gm_act_cross_story_set_guild_prog     set_guild_progress     = 13; // 设置公会讨伐进度（对前 cnt 名公会成员写入该关卡战果，其余清除；受公会实际人数上限约束）
}

// 设置公会讨伐进度（仅测试环境）
// 零公会存储下进度是实时统计的派生值、无可写字段，故由 GM 造出对应的成员战果数据
message req_gm_act_cross_story_set_guild_prog {
  required uint64 stage_id = 1; // 讨伐 Boss 关卡ID
  required uint64 cnt      = 2; // 目标已击败人数（0 = 清空全公会该关卡战果；上限为公会实际人数）
}

message req_gm_act_cross_story_set_choice_hero {
  required uint64 hero_tid = 1; // 联动英雄TID（0=清除到未选状态）
}

message req_gm_act_cross_story_set_guild_recvd {
  required uint64 stage_id = 1; // 讨伐 Boss 关卡ID
  required bool   is_recvd = 2; // true=写入已领，false=清除已领标记
}
//================================================ 联动英雄活动 GM end ====================================================