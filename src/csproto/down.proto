  required cost   cost                 = 5; // 本次抽奖消耗的道具
}

message reply_act_farm_lottery_open_score_friend_rank {
  optional uint64            self_point = 1;
  optional uint64            self_rank  = 2;
  repeated rank_board_entry  entries    = 3;
  optional uint64            total_rank = 4; // 排名总人数
}

message reply_act_farm_lottery_open_recv_progress{
  required uint64                          race_times     = 1; // 总领奖次数
  repeated act_farm_lottery_recvd_progress recvd_progress = 2; // 领奖进度
}

