}

//============================================================
// 神魔对抗
//============================================================
message reply_cof {
    optional reply_cof_open_panel                 open_panel                 = 1;  // 打开面板
    optional reply_cof_enrollment                 enrollment                 = 2;  // 报名
    optional reply_cof_explore_start              explore_start              = 3;  // 开始探索
    optional reply_cof_explore_continue           explore_continue           = 4;  // 探索过程
    optional reply_cof_explore_end                explore_end                = 5;  // 结束探索
    optional reply_cof_explore_start_battle       explore_start_battle       = 6;  // 探索开始战斗
    optional reply_cof_explore_end_battle         explore_end_battle         = 7;  // 探索结束战斗
    optional reply_cof_explore_gamble_battle      explore_gamble_battle      = 8;  // 猜输赢战斗
    optional reply_cof_explore_reward             explore_reward             = 9;  // 探索次数进度奖励
    optional reply_cof_explore_phase_detail       explore_phase_detail       = 10; // 探索阶段详情
    optional reply_cof_fix_tower                  fix_tower                  = 11; // 为激活能量点充能
    optional reply_cof_fix_tower_reward           fix_tower_reward           = 12; // 能量点激活后的奖励
    optional reply_cof_monster_query              monster_query              = 13; // 查询魔物列表信息
    optional reply_cof_monster_battle_record      monster_battle_record      = 14; // 查询魔物战斗记录
    repeated reply_cof_recommend_record           monster_recommend_lineups  = 15; // 阵容推荐
    optional reply_cof_monster_challenge          monster_challenge          = 16; // 魔物挑战
    optional reply_cof_explore_phase_reward       explore_phase_reward       = 17; // 探索阶段结算奖励
    optional reply_cof_lane                       lane                       = 18; // 某路信息
    optional reply_cof_lane_refresh_oppo          lane_refresh_oppo          = 19; // 刷新敌人
    optional reply_cof_lane_challenge             lane_challenge             = 20; // pvp战斗
    repeated cof_battle_record                    lane_battle_record         = 21; // 战场战斗录像
    optional reply_battle_day_summary             battle_day_summary         = 22; // 昨日战报
    optional reply_cof_battle_pvp_reward          battle_pvp_reward          = 23;  // 探索次数进度奖励
    repeated reply_cof_boss                       boss_query                 = 24; // 查询boss信息
    optional reply_cof_boss_challenge             boss_challenge             = 25; // boss挑战
    optional reply_cof_boss_buy_count             boss_buy_count             = 26; // 购买boss 攻击次数
    repeated cof_boss_record                      boss_battle_record         = 27; // boss战斗录像
    optional reply_cof_boss_reward                boss_reward                = 28; // boss奖励
    repeated reply_cof_recommend_record           boss_recommend_lineups     = 29; // boss阵容推荐
    optional reply_cof_battle_phase_reward        battle_phase_reward        = 30; // 二阶段结算奖励
    optional reply_cof_rank                       cof_rank                   = 31; // 排行榜数据
    optional battle_record                        battle_record              = 32; // 别人的战斗录像
    optional reply_cof_rank                       boss_rank                  = 33; // 排行榜数据
    optional reply_cof_open_panel                 signup                     = 34; // 报名成功后刷新数据
    repeated reply_cof_phase_status               query_phase_statues        = 35; // 各阶段状态
}

message reply_cof_rank {
    optional uint64          self_rank    = 1;
    optional uint64          self_point   = 2;
    optional bytes           zlib_entries = 3; // 压缩后的cof_rank_entries
    optional uint64          count        = 4; //排行榜总人数
}

message cof_rank_entries {
    repeated cof_rank_entry      entries = 1;
}

message cof_rank_entry {
    required uint64           rank              = 1;
    optional user_summary     user_summary      = 2;
    required uint64           point             = 3;
    optional t_region         region            = 4;
    optional t_cof_faction    faction           = 5; //阵营
}

message reply_cof_open_panel {
    optional cof_phase                      phase              = 1;  // 当前阶段
    optional t_cof_faction                  faction            = 2;  // 所属阵营
    optional cof_recommend_faction          recommend_faction  = 3;  // 为了平衡，当前推荐阵营
    repeated cof_book                       books              = 4;  // 书本碎片信息
    optional cof_explore                    explore            = 5;  // 一阶段探索阶段信息
    optional cof_explore_phase_result       explore_result     = 6;  // 一阶段探索阶段结果
    optional cof_battle_phase               battle_phase       = 7;  // 二阶段信息
    optional reply_battle_day_summary       battle_day_summary = 8;  // 二阶段日报
    optional cof_battle_phase_result        battle_result      = 9;  // battle阶段结果 result阶段时发的是第二轮battle阶段的结果; 第二轮explore发的是第一轮battle阶段结果；第一轮explore阶段时不发该字段
    optional uint64                         enrollment_ts        = 10; // 报名时间
    optional uint64                         chat_group_id        = 11; // 聊天频道id
    optional uint64                         signup_ts            = 12; // 报名时间戳
    optional uint64                         enroll_cnt           = 13; // 选择阵营次数
}

message reply_cof_phase_status{
    required uint64            phase_tid                = 1;
    optional bool              can_recv_reward          = 2;     // 是否可以领奖
    optional bool              is_recvd_reward          = 3;     // 是否已经领过奖
    optional t_cof_faction     winner_faction           = 4;     // 胜利阵营
    optional t_cof_faction     user_faction             = 5;     // 用户所属阵营
}

message reply_cof_enrollment {
    required result                         result             = 1;  // 失败可能是因为强制推荐，可以用下面的推荐信息，重新刷新一下页面
    optional cof_recommend_faction          recommend_faction  = 2;  // 当前推荐阵营
    optional cof_explore                    explore            = 3;  // 探索阶段信息
    optional cof_explore_phase_result       explore_result     = 4;  // 一阶段探索阶段结果
    optional cof_battle_phase               battle_phase       = 5;  // 二阶段探索信息
    optional reply_battle_day_summary       battle_day_summary = 6;  // 二阶段日报
    optional uint64                         chat_group_id      = 7; // 聊天频道id
    optional uint64                         enroll_cnt         = 8; // 选择阵营次数
    optional uint64                         enrollment_ts      = 9; // 报名时间
}

enum t_cof_phase {
    prepare     = 1; // 准备阶段 报名
    match       = 2; // 匹配阶段
    explore     = 3; // 探索阶段
    battle      = 4; // 战斗阶段
    result      = 5; // 结果展示阶段
}

message cof_phase {
    required  t_cof_phase type      = 1; // 阶段类型
    required  uint64      start_ts  = 2; // 阶段开始时间
    required  uint64      end_ts    = 3; // 阶段结束时间
    required  uint64      phase_tid = 4; // 阶段配置id，对应 csv_act_clash_phase.erl的主键
}

enum t_cof_recommend {
    show   = 1; // 仅提示
    force  = 2; // 强制
}

message cof_recommend_faction {
    required t_cof_recommend type    = 1;
    required t_cof_faction   faction = 2;  // 为了平衡推荐阵营
}

message cof_fix_tower {
    required uint64   id          = 1;
    required uint64   amount      = 2; // 能量点数
    required uint64   amount_self = 3; // 自己贡献的能量点数
}

message cof_explore {
    optional uint64                     score                   = 1;     // 探索阶段积分
    optional uint64                     count_used              = 2;     // 已经使用了的探索次数
    optional cof_explore_event_progress pending_event           = 3;     // 还需用户进一步操作的探索事件
    repeated uint64                     recvd_rewards           = 4;     // 已经领取的id列表
    optional uint64                     fix_tower_item_amount   = 5;     // 修复能量点的道具数量
    repeated cof_fix_tower              fix_towers              = 6;     // 能量点信息
    repeated uint64                     fix_tower_reward_recvd  = 7;     // 领取过奖励的能量点列表
    repeated cof_faction_score          faction_scores          = 8;     // 阵营积分
    repeated cof_monster_summary        monsters                = 9;     // 魔物
}

enum t_cof_tower_owner {
    god          = 1; // 神
    devil        = 2; // 魔
}

message cof_tower {
    required uint64            id           = 1;
    optional t_cof_tower_owner owner        = 2;
    required bool              is_destroyed = 3;
}

message cof_monster_summary {
    required uint64    id         = 1; // 魔物id
    required uint64    tid        = 2; // 魔物类型id
    optional uint64    count_used = 3[default= 0]; // 已经挑战的次数
    optional string    user_name  = 4; // 触发者名字
}

message cof_boss_summary {
    required  uint64             id              = 1; // id
    optional  uint64             start_ts        = 3; // 开始时间
    optional  uint64             end_ts          = 4; // 结束时间
    optional  uint64             count_used      = 5[default= 0]; // 已经使用的攻击次数
}

message reply_cof_boss {
    required  uint64             id                = 1; // id
    optional  uint64             start_ts          = 3; // 开始时间
    optional  uint64             end_ts            = 4; // 结束时间
    optional  uint64             count_used        = 5; // 已经使用的攻击次数
    optional  uint64             count_total       = 6; // 总的可以使用攻击次数
    optional  uint64             damage_max        = 7;
    repeated  cof_faction_score  faction_damages   = 8;
    repeated  uint64             recvd_rewards     = 9; // 领取过的奖励
    optional  bytes              zlib_expand_in_view_entries = 10; // 压缩后的cof_rank_entries top5
    optional  uint64             self_rank                   = 11; // 自己的排名
    optional  uint64             rank_lower_bound_dmg        = 12; // 排名200的伤害
}

message cof_boss_day_summary {
    required  uint64             id              = 1; // id
    repeated  cof_faction_score  faction_damages = 3;
    optional  t_cof_faction      winner          = 4;
}

message cof_battle_phase {
    optional uint64                     score                   = 1;     // 二阶段积分
    repeated cof_faction_score          faction_scores          = 2;     // 二阶段阵营积分
    repeated cof_tower                  towers                  = 3;     // 塔的归属情况
    optional uint64                     count_used              = 4;     // 已经使用了的pvp次数
    repeated cof_lane_summary           lanes                   = 5;     // 各路简要信息
    repeated cof_boss_summary           bosses                  = 6;     // 当前的boss
    repeated uint64                     recvd_rewards           = 7;     // 已经领取的id列表
    optional t_cof_faction              bonus_faction           = 8;     // 悬赏状态的阵营
    optional t_cof_faction              explore_phase_winner    = 9;     // 一阶段探索阶段胜利者
}

message cof_faction_score {
    optional t_cof_faction  faction  = 1;     // 阵营
    optional uint64         score    = 2;     // 积分
}

message cof_faction_buff {
    optional t_cof_faction  faction  = 1;     // 阵营
    repeated uint64         buffs    = 2;
}

message cof_explore_event_progress {
    required cof_explore_event  event       = 1; // 事件
    repeated uint64             choice      = 2; // 事件选择列表
    optional cof_explore_gamble gamble      = 3; // 竞猜战斗信息
    repeated slot_hero          oppo_heroes = 4; // pve战斗对手阵容
}

message cof_explore_gamble {
    repeated slot_hero left_heroes   = 1; // 左边阵容
    repeated slot_hero right_heroes  = 2; // 右边阵容
}

message reply_cof_explore_start {
    optional cof_explore_event_progress progress = 1; // 进度
}

message reply_cof_explore_continue {
    optional cof_explore_event_progress progress       = 1; // 进度
    optional cof_reward                 reward         = 2; // 获得的奖励
    optional uint64                     count_used     = 3; // 同步已经使用的探索次数
    repeated cof_faction_score          faction_scores = 4; // 阵营积分
    optional uint64                     score          = 5; // 自己的积分
}

message cof_reward {
    optional reward         reward      = 1; // 获得的奖励
    repeated cof_book_shard book_shards = 2; // 书籍碎片
}

message cof_book_shard {
    required uint64 book_id  = 1;
    required uint64 shard_id = 2;
}

message reply_cof_explore_end {
    optional uint64              event_id       = 1; // 结束事件
    optional cof_reward          reward         = 2; // 获得的奖励
    optional uint64              count_used     = 3; // 同步已经使用的探索次数
    repeated cof_faction_score   faction_scores = 4; // 阵营积分
    optional uint64              score          = 5; // 自己的积分
}

message reply_cof_explore_start_battle {
    optional battle start_battle_info = 1;  // 返回开始战斗公共信息
}

message reply_cof_explore_end_battle {
    optional reply_cof_explore_end  explore_end    = 1;
    required t_battle_result        result         = 2; // 战斗结果
}

message reply_cof_explore_gamble_battle {
    optional reply_cof_explore_end  explore_end    = 1;
    optional battle                 battle         = 2; // 战斗录像
}

message reply_cof_explore_reward {
    required uint64      id         = 1;
    optional reward      reward     = 2; // 获得的奖励
}

message reply_cof_explore_phase_reward {
    optional reward      reward     = 1; // 获得的奖励
}

message reply_cof_explore_phase_detail {
    repeated cof_faction_score          faction_scores           = 1;     // 阵营积分
}

message cof_explore_phase_result {
    repeated cof_faction_score          faction_scores           = 1;     // 阵营积分
    optional t_cof_faction              winner                   = 2;     // 胜方
    optional bool                       can_recv_reward          = 3;     // 是否可以领奖
}

message reply_cof_fix_tower {
    required uint64         amount_add   = 1; // 实际充能数量
    required uint64         amount_left  = 2; // 玩家剩余充能数量
    required cof_fix_tower  tower        = 3; // 能量点信息
}

message reply_cof_fix_tower_reward {
    optional reward            reward     = 1; // 获得的奖励
}

message cof_monster_appear {
    optional string        user_name  = 1; // 触发者名字
    required uint64        id         = 2; // 魔物id
    required uint64        tid        = 3; // 魔物类型id
    optional t_cof_faction faction    = 4; // 阵营
}

message cof_monster_disappear {
    required uint64        id         = 1; // 魔物id
    optional t_cof_faction faction    = 2; // 阵营
}

message reply_cof_monster {
    required uint64    id         = 1; // 魔物id
    required uint64    tid        = 2; // 魔物类型id
    required uint64    hp_total   = 3; // 魔物总血量
    required uint64    hp_left    = 4; // 魔物剩余血量
    required uint64    count_used = 5; // 已经挑战的次数
}

message reply_cof_monster_query {
    repeated reply_cof_monster monsters = 1;
}

message reply_cof_monster_battle_record {
    repeated cof_monster_battle_record records = 1;
}

message reply_cof_recommend_record {
    required battle_record              battle_record        = 1;
    optional uint64                     damage               = 2;
}

message reply_cof_monster_challenge {
    required uint64            damage         = 1;
    optional reward            reward         = 2;
    repeated battle_stats      battle_stats   = 3;
    optional uint64            battle_id      = 4;
    optional t_battle_result   result         = 5;
    optional battle            battle         = 6;
    optional reply_cof_monster monster        = 7;
    repeated cof_faction_score faction_scores = 8;
}

message cof_lane_day_summary {
    required t_cof_lane         lane           = 1;
    repeated cof_faction_score  faction_scores = 2;
    optional t_cof_faction      winner         = 3;
}

message cof_lane_summary {
    required t_cof_lane           lane               = 1;
    repeated cof_faction_score    faction_points     = 2;     // 战场点数
}

message reply_cof_lane {
    repeated cof_faction_score    faction_points     = 1;     // 战场点数
    repeated cof_faction_buff     faction_buffs      = 2;
    repeated cof_battle_oppo      oppos              = 3;
    optional uint64               refresh_count      = 4;     // 已经使用的刷新对手次数
    optional uint64               refresh_count_ts   = 5;     // 刷新对手次数信息的时间, 隔天清零
}

message reply_cof_lane_refresh_oppo {
    repeated cof_battle_oppo      oppos              = 1;
    optional cost                 cost               = 2;
    optional uint64               refresh_count      = 3;     // 已经使用的刷新对手次数
    optional uint64               refresh_count_ts   = 4;     // 刷新对手次数信息的时间, 隔天清零
}

message reply_cof_lane_challenge {
    optional uint64            count_used     = 1;     // 已经使用了的pvp次数
    optional cof_reward        reward         = 2;
    optional uint64            battle_id      = 3;
    optional t_battle_result   result         = 4;
    optional battle            battle         = 5;
    repeated cof_battle_oppo   oppos          = 6;
    repeated cof_faction_score faction_points = 7;
}

message reply_battle_day_summary {
    optional uint64                timestamp            = 1; // 日报对应那天的时间戳
    repeated cof_faction_score     faction_init_scores  = 2; // 积分
    repeated cof_faction_score     faction_add_scores   = 3; // 积分增加的值
    optional t_cof_faction         bonus_faction_init   = 4; // 结算前悬赏状态的阵营
    optional t_cof_faction         bonus_faction        = 5; // 结果悬赏状态的阵营
    repeated cof_lane_day_summary  lanes                = 6;
    repeated cof_boss_day_summary  bosses               = 7;
    repeated cof_tower             towers_before        = 8;
    repeated cof_tower             towers_change        = 9;
}

message reply_cof_boss_challenge {
    required  uint64              damage          = 1;
    repeated  battle_stats        battle_stats    = 2;
    optional  uint64              battle_id       = 3;
    optional  t_battle_result     result          = 4;
    optional  battle              battle          = 5;
    optional  uint64              count_used      = 6;
    optional  uint64              count_total     = 7;
    optional  uint64              damage_max      = 8;
    repeated  cof_faction_score   faction_damages = 9;
    optional  bytes              zlib_expand_in_view_entries = 10; // 压缩后的cof_rank_entries top5
    optional  uint64             self_rank                   = 11; // 自己的排名
