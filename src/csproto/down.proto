    optional guild_boat_be_assist  be_assist = 2; // 被协助信息
}

message reply_guild_boat_batch_assist {
    repeated guild_boat_be_assist  be_assists  = 1; // 被协助信息列表
}

// 被协助信息
message guild_boat_be_assist {
    required uint64                        target_uid  = 1; // 被协助玩家uid
    required uint64                        boat_tid    = 2; // 船tid
    optional reward                        reward      = 3; // 协助奖励
    required t_guild_boat_be_assist_result result      = 4; // 结果
    optional bool                          is_sp_assist = 5; // 你是否是 该船的特别协助人
}

message reply_guild_boat_open_log {
    repeated guild_boat_log  logs  = 1; // 日志列表
}

message reply_extra_guild_boat {
    optional guild_boat_assist_extra assist          = 1; // 有人协助了你
    optional guild_boat_req_assist   req_assist      = 2; // 有人请求协助
    optional reply_guild_boat_info   guild_boat_info = 3; // 登录下发
    optional guild_boat_be_assist    auto_assist     = 4; // 自动协助
}

// 请求协助信息
message guild_boat_req_assist {
    required uint64  uid         = 1; // 请求uid
    required uint64  slot_pos    = 2; // 槽位
}

message guild_boat_assist_extra {
    optional uint64               uid         = 1; // 协助人uid
    optional guild_boat_dispatch  dispatch    = 2; // 派遣信息
}

