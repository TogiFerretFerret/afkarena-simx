//============================================================
// 工会猎宝 down
//============================================================
message reply_guild_camp {
  optional reply_guild_camp_open_panel           open_panel              = 1; // 打开面板
  optional reply_guild_camp_open_camp            open_camp               = 2; // 打开自己的阵营
  optional guild_camp_score_panel                open_camp_score_panel   = 3; // 阵营积分面板
  optional reply_guild_camp_query_battle_rounds  query_battle_rounds     = 4; // 查询战斗记录
  optional reply_guild_camp_query_rank           query_rank              = 5; // 查询排行榜
  optional result                                set_lineup              = 6; // 设置阵容
  optional guild_camp_act_signup                 act_signup              = 7; // 设置战斗类型
  repeated reply_guild_camp_battle_record        query_battle_record     = 8; // 查询战斗记录详情
  optional reply_guild_camp_battle_his           query_battle_his        = 9; // 战报
  optional reply_camp_task_panel                 open_camp_task_panel    = 10; // 任务面板
  optional reply_recv_camp_task                  recv_task               = 11; // 领取任务
  optional reply_guild_camp_top_general          top_general             = 12; // 获取大将军user_summary
  optional reply_guild_camp_general_stat         query_general_stat      = 13; // 查看大将军胜率
  optional guild_camp_war_panel                  open_war_panel          = 14; // 战况看板
  optional reply_guild_camp_info                 open_general_panel      = 15; // 打开大将军（工会之星）面板
  optional result                                give_up_general         = 16; // 放弃成为大将军
  optional result                                cancel_give_up          = 17; // 取消放弃
  optional result                                apply_general           = 18; // 申请成为大将军
  optional result                                cancel_apply            = 19; // 取消申请成为大将军
  optional result                                refuse_general_apply    = 20; // 拒绝大将军申请
  optional result                                agree_general_apply     = 21; // 同意大将军申请
  optional string                                edit_desc               = 22; // 编辑留言板
  repeated reply_guild_camp_war                  wars                    = 23; // 出征记录
  repeated reply_guild_camp_battle_record        query_team_bt_records   = 24; // 查询单队一次出征的所有战斗记录
  optional reply_guild_camp_guild_rank_his       guild_rank_his          = 25; // 查询公会各名次获得次数
}

message reply_guild_camp_guild_rank_his {
  map<uint64, uint64>   rank2times   = 1; // rank -> times
}

message reply_guild_camp_war {
  required uint64                 war_index     = 1; // 第几次出征
  optional bool                   is_bye        = 2; // 是否轮空
  optional guild_camp_act_signup  act_signup    = 3; // 锁定报名
  required uint64                 bt_cnt        = 4; // 总战斗次数
  required uint64                 win_cnt       = 5; // 胜利次数
  repeated camp_buff_score        buff_scores   = 6; // 本次出征的收获
}

message reply_camp_task_panel {
  optional act_task  act_task   = 1;
}

message reply_recv_camp_task {
  optional result    result     = 1 [ default = success ];
  optional reward    reward     = 2; // 这里可能没有奖励
  optional act_task  act_task   = 3;
}

// 打开面板: 返回各阵营积分
message reply_guild_camp_open_panel {
  required            uint64                  season_id      = 1; // 赛季id： yyyyww
  required            uint64                  camp_id        = 2; // 自己所在阵营编号：1-4
  required            uint64                  gid            = 3; // 自己公会id
  map<uint64, uint64>                         camp2gid       = 4; // camp_id -> guild_id 列表
  repeated            guild_camp_score_panel  camp_panels    = 5; // 各阵营信息
  optional            uint64                  battle_times   = 6 [ default = 1 ]; // 参与的第几个赛季
  optional            reply_server_level      svr_level      = 7; // 当前赛季竞技等级
  optional            t_scope_type            scope_type     = 8; // 类型
}

// 打开自己阵营面板
message reply_guild_camp_open_camp {
  required reply_uguild_camp           uguild_camp       = 1;
  optional reply_guild_camp_info       guild_camp_info   = 2; // 报名阶段大将军相关数据
  optional uint64                      round             = 3; // 当前打到第几轮
  optional uint64                      chat_group_id     = 4; // 聊天id(目前就是公会频道)
  repeated reply_guild_camp_war_brief  war_briefs        = 5; // 再次回来,中间打了多少轮
}

message reply_guild_camp_war_brief {
  required uint64  war_index   = 1;
  required bool    is_bye      = 2 [ default = false ];
  required uint64  bt_cnt      = 3 [ default = 0 ];
  required uint64  win_cnt     = 4 [ default = 0 ];
}

message reply_uguild_camp {
  required uint64                   season_id           = 1;
  required t_camp_title             title               = 2; // 普通玩家 or 大将军
  repeated guild_camp_id_lineup     farm_lineups        = 3; // 悬赏阵容
  optional guild_camp_lineup        scout_lineup        = 4; // 侦察阵容
  repeated guild_camp_id_lineup     fight_lineups       = 5; // 争夺阵容
  optional guild_camp_lineup        general_lineup      = 6; // 大将军阵容
  repeated camp_buff_score          buff_scores         = 7; // 为阵营获取的各个buff积分，用于计算
  optional guild_camp_act_signup    act_signup          = 8; // 行动报名(下两场希望参与的行动)
  optional act_task                 act_task            = 9; // 任务模块，用 act_task \ act_chest 来实现
  optional uint64                   score               = 10; // 大将军 elo分数
  optional uint64                   rank                = 11 [ default = 0 ]; // 大将军当前排名
  optional guild_camp_act_signup    locked_act_signup   = 12; // 当前行动报名
  repeated guild_camp_soldier_stat  stats               = 13; // 整个赛季各个行动的战斗次数&胜利次数
  optional uint64                   his_max_score       = 14; // 本赛季最高分数
}

// 查询战斗记录
message reply_guild_camp_query_battle_rounds {
  required uint64                          war_index       = 1 [ default = 1 ]; // 第几次出征
  repeated reply_guild_camp_battle_rounds  battle_rounds   = 2; // 战斗记录
  optional user_summary                    user_summary    = 3; // 玩家信息
  repeated guild_camp_battle_his           reports         = 4;
}

message reply_guild_camp_battle_rounds {
  required uint64  round          = 1; // 第几轮战斗
  required uint64  before_score   = 2; // 本轮战斗结束前的积分|资源
  optional uint64  after_score    = 3; // 本轮战斗结束后的积分|资源
  optional uint64  bt_cnt         = 4; // 战斗数量 轮空或悬赏,这个值返回0
}

// 查询排行榜
message reply_guild_camp_query_rank {
  repeated rank_board_entry   entries     = 1; // 其他玩家\公会的信息(如果玩家自己也在前n名, 这里也包括)
  optional rank_board_entry   self        = 2; // 玩家自己\公会的信息
  optional t_scope_type       scope_type  = 3;
}

// 查询具体某轮战斗的战斗记录
message reply_guild_camp_battle_record {
  optional uint64                    team_id         = 1;
  required battle_record             record          = 2;
  optional guild_camp_battle_record  record_detail   = 3;
}
// 战报
message reply_guild_camp_battle_his {
  required uint64                 war_index    = 1 [ default = 1 ]; // 赛季内第几次出征
  required uint64                 round        = 2 [ default = 1 ]; // 本次出征达到第几轮
  repeated camp_buff_score        buff_score   = 3; // 本次出征达到第几轮
  repeated guild_camp_battle_his  reports      = 4;
}

message reply_guild_camp_top_general {
  repeated user_summary      summaries       = 1;
  repeated guild_camp_log    logs            = 2; // 事件
  repeated general_stat      stats           = 3; // 大将军胜率
  repeated camp_score_entry  score_entries   = 4; // topn 积分
}

// 异域夺金 战况面板
message guild_camp_war_panel {
  repeated guild_camp_war_camp  camps   = 1;
}

message guild_camp_war_camp {
  required            uint32  gid          = 1; // 阵营
  required            uint64  score        = 2; // 积分
  map<uint64, uint64>         score_list   = 3; // 每次行动后的积分, <行动编号 - 结束时积分>
}

message reply_guild_camp_general_stat {
  repeated general_stat  stats   = 1;
}
// 大将军胜率统计: 整个赛季有效
message general_stat {
  required uint64  id        = 1; // camp_id1 * 100 + camp_id2
  required uint64  win_cnt   = 2; // 胜利次数，如果是失败，那么就有另外一个key camp_id2 * 100 + camp_id1 存 win_cnt
}

message reply_guild_camp_info {
  required                           uint64                    id                    = 1;
  required                           uint64                    season_id             = 2;
  optional                           uint64                    room_id               = 3; // 每4个(有可能不到4个)工会一个房间
  optional                           uint64                    camp_id               = 4; // 所属阵营
  map<uint64, uint64>                                          camp2gid              = 5; // camp_id -> guild_id 列表
  repeated                           uint64                    generals              = 6; // 大将军uid列表: 备战阶段存的是默认topN, 备战结束后，存的是正式的大将军列表
  repeated                           uint64                    soldiers              = 7; // 大将军uid列表: 备战阶段存的是默认topN, 备战结束后，存的是正式的大将军列表
  repeated                           uint64                    give_up_generals      = 8; // [仅备战期下发]放弃uid列表
  repeated                           guild_camp_general_apply  apply_generals        = 9; // [仅备战期下发]申请列表
  optional                           string                    desc                  = 10; // 留言板
  repeated                           guild_camp_log            logs                  = 11; // 日志
  repeated                           camp_buff_score           buff_scores           = 12; // 已获取的各buff积分 不同类型 自增数字
  map<uint64, guild_camp_act_signup>                           act_signups           = 13; // 成员行动报名
  repeated                           soldier_buff_score        soldier_buff_scores   = 14; // [仅展示期下发]各普通玩家当前赛季贡献的积分
  repeated                           user_summary              summaries             = 15;
}

