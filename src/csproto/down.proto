}

message reply_guild_boat_recv {
    required uint64           slot_pos  = 1; // 槽位
    required uint64           boat_tid  = 2; // 船tid
    optional reward           reward    = 3; // 奖励
    optional guild_boat_draw  draw      = 4; // 宝箱抽取
}

