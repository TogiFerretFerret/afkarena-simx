message guild_boat_draw {
    repeated guild_boat_draw_grid  grids  = 1; // 格子数据
    repeated guild_boat_draw_step  steps  = 2; // 抽取过程
}

message guild_boat_draw_grid {
    required uint64  pos  = 1; // 位置
    optional int64   uid  = 2; // 协助成员uid / 负数 代表机器人 / undefined就是钥匙
