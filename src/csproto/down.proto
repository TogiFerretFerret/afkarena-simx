  optional uint64                   self_damage  = 3;
}

message reply_raid_octopus_query_history {
  repeated raid_boss_record  his_list   = 1;
}

message reply_raid_octopus_challenge {
  required t_battle_result                result              = 1;
  required battle                         battle              = 2;
  required uint64                         damage              = 3;
  repeated uint64                         damages             = 4;
  required reply_raid_change              change              = 5;
  required cd                             cd                  = 6;
  optional uint64                         old_max_dmg         = 7;
}

message reply_raid_octopus_reset_cd {
  required cd                             cd                  = 1;
  required cost                           cost                = 2;
}

message reply_raid_octopus_guild_top_info {
  optional user_summary summary = 1; // 玩家数据
  optional uint64       rank    = 2; // 排名
  optional asset        asset   = 3; // 红包内容
}

message reply_raid_octopus_recv_boss_reward {
  repeated uint64                         recvd_list          = 1;
  required reward                         reward              = 2;
}

