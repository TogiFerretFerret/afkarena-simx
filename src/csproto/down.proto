message reply_msg {    // 空的协议结构体
}

message reply_err_code {
  required string  err_code   = 1;
}

message reply_svr_list {
  repeated server_status  svr_list    = 1; // 所有服务器的状态信息
  repeated user_summary   role_list   = 2; // 所有的角色信息
}

message reply_sdk_login {
  required string    htoken     = 1; // hgame token
  required int32     svr_id     = 2; // 上次登录的服务器ID， 返回-1表示没有登录任何服务器
  optional string    host       = 3; // 新服务器的IP地址:端口，如果没有表示就是当前连接
  optional string    open_id    = 4; // 验证微信登录时取得
  optional string    union_id   = 5; // 微信登录时取得
  optional t_region  redirect   = 6; // 优先判断是否存在该字段，如果存在直接在登录地址后面拼接上这个串
  optional bool      migrated   = 7 [ default = false]; // 账号被迁移
  optional int32     zone_id    = 8 [ default = 0 ]; // zone_id：用于合服、请求排行榜
  optional bool      is_new_reg = 9 [ default = false]; // 是否在经典服创建过账号
  optional string    test_debug = 10;
}

message reply_login {
  optional reply_user            user_info         = 1; // 玩家信息
  required reply_im              im_info           = 2; // 聊天服务器env_id
  required bool                  battle_report     = 3; // 校验失败战斗日志上报
  required int32                 svr_time_zone     = 4; // 服务器时区
  required t_region              region            = 5; // 服务器的性质
  repeated reply_activity_info   activities        = 6; // 活动信息
  repeated reply_challenge_info  challenges        = 7; // 极限挑战时间
  optional string                forum_env_id      = 8; // sdk forum env id
  required bool                  is_new_user       = 9; // 是否是新角色
  optional uint64                create_ts         = 10; // 创建时间
  optional uint64                prohibited_time   = 11; // 被禁止修改信息的时间
  optional bool                  is_roll_svr       = 12; // 是否为滚服玩家
  optional bytes                 d_test            = 13;
  optional reply_server_level    server_level      = 14; // 当前服务器竞技等级相关信息
  optional reply_server_group    server_group      = 15; // 当前服务器分组信息
  optional bool                  is_acc_reborn     = 16[default = false]; // 是否已经账号重生过
  optional acc_reborn_info       acc_reborn_info   = 17; // 账号重生数据
  optional uint64                last_logout_ts    = 18; // 最后一次登出时间
  optional bool                  show_club         = 19[default = false]; // 是否显示俱乐部
  optional t_mini_game           user_type         = 20; // 用户类型
  repeated t_close_system        closed_systems    = 21; // 对玩家关闭的功能列表
}

message d_test {
  repeated d_item  items   = 1;
}

message d_item {
  required string  key    = 1;
  required string  data   = 2;
}

message reply_login_slg {
  optional t_slg_phase     phase             = 1; // slg阶段
  optional uint32          team_id           = 2; // slg的team_id
  optional uint64          map_end_ts        = 3; // slg 地图结束时间
  optional uint64          map_freeze_ts     = 4; // slg 地图沉寂时间
  repeated uint64          slg_hero_ids      = 5; // slg 格子里的英雄ids
  optional uint64          slg_season_id     = 6; // slg 赛季id
  optional uint32          nobility          = 7; // slg 爵位
  optional uint32          warband_id        = 8; // slg 军团id
  optional uint64          last_season_id    = 9; // 上一个结束了的赛季id,客户端用荣誉榜单可显示的赛季ID
  optional uint32          cur_block_id      = 10; // 如果为undefined则说明从来没进过slgmap
  optional uint64          season_start_ts   = 11; // 赛季开始时间
  optional t_slg_identify  identify          = 12; // 身份标识
}

message reply_im {
  optional string  env_id        = 1; // 环境ID(空值表示该环境没有IM3.0， 例如本地私服）
  repeated string  api_urls      = 2; // 客户端使用的IM API地址（多个）
}

message reply_bag {
  optional reply_open_bag  reply_open_bag   = 1;
}

message reply_open_bag {
  repeated item   items    = 1;
  repeated equip  equips   = 2;
}

// 整理顺序
