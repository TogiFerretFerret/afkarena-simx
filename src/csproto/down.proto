//============================================================
message reply_guild_turntable {
    optional reply_guild_turntable_open_panel open_panel   = 1;
    optional reply_guild_turntable_draw       draw         = 2;
    optional reply_guild_turntable_qte_choose qte_choose   = 3;
    optional reply_guild_turntable_open_log   open_log     = 4;
}

message reply_guild_turntable_open_panel {
    required uint64                         cur_pos              = 1; // 当前位置
    optional guild_turntable_event          pending_event        = 2; // 有未完成事件,仅传qte事件的id和resultid，奖励由qte_choose协议完成
    required uint64                         tech_exp             = 3 [default = 0]; // 科技树经验
    optional reward                         boat_daily_rewards   = 4; // 跑船的每日奖励
}

message reply_guild_turntable_draw {
    required uint64                dice               = 1; // 步数
    required uint64                end_pos            = 2; // 落点位置
    required uint64                block_tid          = 3; // 格子配置id
    optional reward                start_reward       = 4; // 起点奖励
    optional reward                reward             = 5; // 本次奖励，当处于问号格：qte事件：单倍时，客户端请求发奖，多倍，自动发奖
    optional guild_turntable_event event              = 6; // eventid必需。另外两种字段二选一：qte事件传resultid；另一种传usersummary
    optional cost                  cost               = 7;

}

message reply_guild_turntable_qte_choose {
    optional reward  reward       = 1;
}

message reply_guild_turntable_open_log {
    repeated guild_turntable_log logs = 1;
}

