  repeated m_mark  marks   = 1;
}

message reply_m_block_summary {
  required uint32                  id                      = 1;
  repeated reply_m_object_summary  objects                 = 2;
  optional sint64                  owner                   = 3;
  optional uint32                  group                   = 4;
  optional uint64                  give_up_ts              = 5;
  optional uint32                  active_bonus_param      = 6; // 开垦英雄种族ID(unit_tag) 或者 英雄tid, 已经开垦时才会下发
  optional bool                    is_stationed            = 7;
  optional uint64                  privilege_finish_time   = 8; // 特权结束时间
  // slg9 新加字段 author: York
  repeated m_block_param           params                  = 9; // 格子参数
}

message reply_m_object_summary {
  required uint32  id                  = 1;
  optional uint64  reset_ts            = 2; // mineral 恢复时间
  repeated uint64  boss_params         = 3; // boss_hps
  optional uint64  left_enemy_cnt      = 4;
  optional uint64  battle_expired_ts   = 5; // 战斗中状态过期时间
}

message reply_m_block {
  required uint32          id                      = 1;
  optional uint32          seq                     = 2;
  optional sint64          owner                   = 3; // owner 负数 表示公共占地
  optional uint32          group                   = 4;
  optional uint64          give_up_ts              = 5;
  repeated slg_object      objects                 = 6;
  optional uint32          bonus_param             = 7; // bonus_param tag_id or hero_tid
  optional hero_summary    bonus_hero              = 8; // bonus_hero
  optional bool            is_stationed            = 9; // 驻扎建筑
  optional uint64          privilege_finish_time   = 10; // 特权结束时间
  optional uint64          occupy_ts               = 11; // 占领时间
  optional cd              battle_cd               = 12; // 请求者这个地块的战斗次数限制
  optional t_block_status  status                  = 13; // 1:标识已被火把照亮
  // slg9 新加字段 author: York
  repeated m_block_param   params                  = 16; // 格子参数
}

