import "common.proto";

package hgame;

//----------------全局枚举定义, 请不要使用内嵌枚举(JS 限制)----------
// 类型定义, t_开头, t_表示type
// @def enum

enum t_hotness {
  total   = 1;
  stage   = 2;
  arena   = 3;
  tower   = 4;
}

enum t_apply_join_view {
  join_success    = 1;
  apply_success   = 2;
}

enum t_join_team_state {
  join_now      = 1; // 可直接加入
  need_pass     = 2; // 需要小队玩家通过
  applied       = 3; // 已申请
  viewer_max    = 4; // 观众席位已满
  quited_team   = 5; // 已退出不能再次加入
}

enum t_close_system {
  perman_login  = 1; // 永久签到
  hero_return   = 2; // 英雄回归
}

enum guild_vehicle_phase {
  match  = 1; // 匹配阶段
  repair = 2; // 修缮阶段
  battle = 3; // 战斗阶段
  settle = 4; // 结算阶段
}

// @end
//-------------------------------------------------------------------

message down_msg {
