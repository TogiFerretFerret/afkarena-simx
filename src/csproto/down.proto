message reply_single_dream {
  optional reply_single_dream_open_panel         open_panel          = 1;
  optional reply_single_dream_buy_ticket         buy_ticket          = 2; // 购买挑战次数
  optional reply_single_dream_challenge          challenge           = 3; // 挑战
  repeated reply_single_dream_record             open_record         = 4; // 打开战斗记录
  optional reply_single_dream_rank_board         open_rank           = 5; // 打开排行榜
  optional battle_record                         query_best_record   = 6; // 查询排汗榜上的战斗记录
  optional reply_single_dream_recommend_lineups  recommend_lineups   = 7;
  optional reply_single_dream_war_panel          open_war_panel      = 8; // 打开战况面板
}

message reply_single_dream_war_panel {
  repeated war_report    war_report        = 1;
  repeated user_summary  summaries         = 2;
  optional single_dream_season last_season = 3; // 上一个梦境赛季的信息
}

message war_report {
  optional t_social_relation  type         = 1;
  required uint64             uid          = 2;
  optional uint64             rank         = 3;
  optional uint64             rank_scale   = 4;
}



message reply_single_dream_record {
  required uint64 replay_id   = 1;
  required uint64 damage      = 2;
  required uint64 bt_ts       = 3;
  optional uint64 boss_id     = 4;
  optional uint64 floor       = 5;
  optional user_summary assist_us  = 6;//助战的玩家
}

message reply_single_dream_open_panel {
  optional single_dream_season            season          = 1;
  optional reply_usingle_dream            usingle_dream   = 2;
  optional reply_single_dream_rank_board  rank_board      = 3;
  optional single_rank_section_info       section_info    = 4; // 无尽层下一档伤害
  optional uint64                         team_cnt        = 5; // 可上阵队伍数
  optional reply_server_level             svr_level       = 6; // 本赛季竞技等级
  optional reply_assist_stage_data        assist_dream    = 7; // 组队信息
  optional uint64                         assist_rank     = 8; // 队友的排名
  optional uint64                         pre_rank        = 9; // 上一轮排名
  optional uint64                         boss_id         = 10; // bossid 锦标赛用
  optional single_dream_season            next_cross_season = 11; // 下一期的跨服赛季信息（用来做倒计时）
  optional reward                         privilege_reward  = 12; //特权奖励
  repeated uint64                         privilege_ids     = 13; // 特权奖励的IDS
  optional uint64                         next_war_start_ts = 14; // 下一赛季开始时间，客户端用来做倒计时（只有当跨服特权开启时才读）
}

message reply_usingle_dream {
  optional uint64              ticket                = 1; // 可挑战次数
  optional cd                  buy_cd                = 2; // 挑战次数购买
  optional single_dream_floor  floor                 = 3; // 当前层数
  optional uint64              battle_id             = 4; // 最好伤害时的战斗录像
  optional uint64              pre_battle_id         = 5; // 上一期最好伤害时的战斗录像
  optional uint64              battle_assist_uid     = 6; // 最好伤害时的帮打人的ID（没有则表示自己打的）
  optional cd                  assist_bt_reward_cd   = 7; // 援助挑战奖励cd
  optional uint64              privilege_active_days = 8; // 特权活跃天数
  optional uint64              used_extra_ticket     = 9; // 已经使用的特权挑战次数
}

message reply_single_dream_buy_ticket {
  required cost  cost     = 1;
  required cd    buy_cd   = 2; // 次数cd
}

message reply_single_dream_challenge {
  optional uint64                    battle_id      = 1;
  optional battle                    battle         = 2;
  optional single_dream_floor        floor          = 3; // 当前层数
  optional uint64                    rank           = 4;
  optional uint64                    total_cnt      = 5;
  optional uint64                    damage         = 6;
  optional single_rank_section_info  section_info   = 7; // 无尽层下一档伤害
  optional reward                    task_reward    = 8; // boss击杀奖励
  repeated uint64                    damages        = 9; // 每一队伍的伤害
}

message single_dream_rank_board_entry {  // 根据排行榜类型不同，可能返回user_summary或guild_summary
  required uint64        uid            = 1;
  required uint32        rank           = 2;
  optional user_summary  user_summary   = 3;
  required uint64        point          = 4; // 伤害
  required uint32        floor          = 5 [ default = 1 ]; // 战斗层数
}

message reply_single_dream_rank_board {
  repeated single_dream_rank_board_entry entries     = 1;
  optional uint64           self_rank   = 2;
  optional uint64           self_point  = 3;
  optional uint64           self_floor  = 4 [default = 1];
  required uint64           count       = 5 [default = 0]; //排行榜总人数
}

message reply_single_dream_recommend_lineups {
  repeated reply_single_dream_recommend_lineup  recommends   = 1;
}

message reply_single_dream_recommend_lineup {
  required uint64              uid            = 1;
  required t_recommend_lineup  source         = 2 [ default = world ]; // 推荐来源
  optional uint64              floor          = 3; // 层数
  optional uint64              point          = 4; // 积分
  optional uint64              rank           = 5; // 排名
  optional bool                available      = 6; // 是不是可用阵容
  required user_summary        user_summary   = 7; // 玩家简要信息
  repeated hero                heroes         = 8;
  repeated lineup              lineups        = 9;
}


message reply_pet {
  optional reply_pet_open_panel         open_panel           = 1;
  optional reply_pet_up_quality         up_quality           = 2; // 进阶
  optional reply_pet_up_quality         up_quality_one_key   = 3; // 一键进阶
  optional pet_mix_info                 mix                  = 4; // 合成
  optional reply_pet_mix_confirm        mix_confirm          = 5;
  optional reply_pet_capture            capture              = 6;
  optional reply_pet_refresh_region     refresh_capture      = 7; // 刷新抓捕地区宠物
  optional reply_pet_book               reply_pet_book       = 8; // 宠物百科
  optional reply_pet_note               reply_pet_note       = 9;
  optional reply_pet_sp_up_quality      sp_up_quality        = 10; // SP进阶
  optional reply_pet_up_talent_quality  up_talent_quality    = 11; // 提升词条品阶（SP专用）
}

message reply_pet_up_talent_quality {
  optional pet_talent              pet_talent                = 1; // PET词条数据更新
  optional cost                    cost                      = 2; // 扣除信息
}

message reply_pet_note {
  required pet_note  pet_node   = 1;
  optional reward    reward     = 2; // 完成全部的品质查看获得一个头像
}

message reply_pet_capture_info {
  required uint64              level         = 1 [ default = 1 ]; // 抓捕等级
  required uint64              capture_cnt   = 2 [ default = 0 ]; // 抓捕次数
  repeated pet_capture_region  regions       = 3; // 解锁的抓捕区域
}

message reply_pet_refresh_region {
  optional reply_pet_capture_info  pet_capture_info   = 1;
  optional cost                    cost               = 2;
}

message reply_pet_capture {
  optional reply_pet_capture_info  pet_capture_info   = 1;
  optional reward                  reward             = 2; // 获得的宠物信息
}

message reply_pet_open_panel {
  optional pet_mix_info            pet_mix_info         = 1;
  optional reply_pet_capture_info  pet_capture_info     = 2;
  optional uint32                  pet_up_quality_cnt   = 3;
  repeated pet_note                pet_notes            = 4;
  optional reward                  unlock_reward        = 5;
  optional uint32                  sp_pet_tid           = 6; //设置的抽卡SP宠物TID
  optional uint64                  privilege_pet_tid    = 7; //war特权宠物TID 空表示没有特权宠物
  optional uint64                  privilege_version_id = 8; //war特权宠物赛季配置表ID 空表示当前没有赛季
  repeated reply_charge_gift       charge_gifts         = 9; //宠物特惠周礼包
}

message reply_pet_sp_up_quality {
  optional pet     pet                  = 1; // SP宠物数据更新
  optional cost    cost                 = 2; // 扣除的宠物信息
  optional reward  reward               = 3; // 提升SP宠物品质获得的奖励（赛季特权才会有值）
}

message reply_pet_up_quality {
  optional reward  reward               = 1; // 获得的宠物信息
  optional cost    cost                 = 2; // 扣除的宠物信息
  optional uint32  pet_up_quality_cnt   = 3;
}

message reply_pet_mix_confirm {
  optional result  result   = 1; // 确认结果（成功清除身上的pet_mix_info）
  optional reward  reward   = 2; // 获得的宠物信息
  optional cost    cost     = 3; // 扣除的宠物信息
}

message reply_pet_book {
  optional pet_book  open_panel   = 1;
}

message reply_hero_return {
  optional reply_hero_return_open_panel      open_panel       = 1;
  optional reply_hero_return_select_inherit  select_inherit   = 2;
  optional reply_hero_return_call_hero       call_hero        = 3;
  optional reply_hero_return_exchange        exchange         = 4;
  optional reply_hero_return_query_account   query_account    = 5;
}

message reply_hero_return_select_inherit {
  optional string       open_id       = 1; // 如果选择激活的是其他账号 需要重启游戏
  optional string       app_token     = 2;
  optional hero_return  hero_return   = 3;
}

message reply_hero_return_query_account {
  optional            string  uin                = 1;
  map<uint64, uint64>         hero_return_list   = 2; // 继承的英雄品阶 hero_tid -> quality
  optional            bool    is_acc_reg         = 3; // 账号是否在组队服创号过
}

message reply_hero_return_open_panel {
  optional hero_return        hero_return       = 1; // 英雄回归相关数据
  repeated uint64             hots              = 2; // 热门英雄(tid)列表
  repeated reply_task_reward  rewards           = 3; // 自动领取的task_line奖励
  optional bool               is_acc_migrated   = 4; // 账号是否有继承过其他账号福利数据产生过迁移
}

message reply_hero_return_call_hero {
  optional result            result       = 1;
  optional cost              cost         = 2;
  optional reward            reward       = 3;
  optional hero_return_call  his          = 4;
  repeated hero_return_call  round_call   = 5; // 本轮次召唤记录
}

message reply_hero_return_exchange {
  optional result            result       = 1;
  optional cost              cost         = 2;
  optional reward            reward       = 3;
  optional hero_return_call  his          = 4;
  repeated hero_return_call  round_call   = 5; // 本轮次召唤记录
}


message reply_raid {
  optional reply_raid_open_panel         open_panel            = 1;
  optional reply_raid_open_raid          open_raid             = 2;
  optional reply_raid_close              close_raid            = 3;
  optional reply_raid_move               move                  = 4;
  optional reply_raid_transmit           transmit              = 5;
  optional reply_raid_start_battle       start_battle          = 6; // 战斗cell
  optional reply_raid_end_battle         end_battle            = 7;
  optional reply_raid_operation          operation             = 8;
  optional reply_raid_recv_reward        recv_reward           = 9;
  optional reply_raid_change             give_up               = 10;
  optional reply_raid_ai_move            ai_move               = 11;
  optional reply_raid_change             ai_interact           = 12;
  optional reply_raid_change             set_diy_rewards       = 13;
  optional reply_raid_query_diy_rewards  query_diy_rewards     = 14;
  optional reply_set_heirlooms           set_heirlooms         = 15;
  optional reply_get_rank_detail         get_rank_detail       = 16;
  optional reply_raid_bet_gamble         bet_gamble            = 17;
  optional reply_raid_heirloom_shop      buy_heirloom          = 18;
  optional reply_raid_heirloom_shop      reset_heirloom_shop   = 19;
  optional reply_raid_heirloom_shop      sell_heirloom         = 20;
  repeated m_hero_act                    change_hero_act_res   = 21; // 修改成功后再次同步体力槽数据
  repeated m_hero_act                    hero_acts             = 22; // 英雄体力
  optional reward                        boat_rewards          = 23; // 修船奖励,已领取过时返回空
  repeated reply_raid_recv_reward        recv_all_rewards      = 24; // 秘宝峡湾一次领取多个奖励
  optional reply_raid_change             detect_block          = 25; // 清除掉迷雾的地块变化
  optional reply_raid_change             trigger_condition     = 26; // 触发condition
  optional reply_raid_finish_task        finish_task           = 27; // 完成任务
  optional reply_mystic_tower            reply_mystic_tower    = 28;
  optional reply_raid_boss               reply_raid_boss       = 29; // 迷宫boss
  optional reply_raid_query_effect2cnt   query_effect2cnt      = 30; // 查看raid的effect2cnt
  optional reply_raid_change             choice_session        = 31; // 执行选项对话的effect
  optional reply_raid_auto_condition     auto_condition        = 32; // 自动触发迷宫条件
  optional reply_raid_change             pass_contra_raid_stage = 33; // 魂斗罗通关stage后改变地块数据
  optional reply_raid_move               batch_move             = 34; // 批量移动
}

message reply_raid_finish_task {
  optional reply_raid_change raid_change  = 1;
  optional reward            reward       = 2;
}

message reply_raid_auto_condition {
  optional reply_raid_change raid_change = 1;
}

message reply_raid_query_effect2cnt {
  map<uint32, uint64>         effect2cnt         = 1;//Effect生效次数
}

message reply_raid_heirloom_shop{
  required uint64              coin     = 1;
  required raid_heirloom_shop  shop     = 2;
  required reply_raid_change   change   = 3;
}

message reply_raid_bet_gamble {
  required result             result   = 1; // 竞猜结果
  required reply_raid_change  change   = 2;
  required battle             battle   = 3; // 战斗录像
}

message reply_set_heirlooms {
  repeated uint32  heirlooms   = 1;
}

message reply_get_rank_detail {
  repeated uint32     heirlooms     = 1;
  repeated slot_hero  slot_heroes   = 2;
}

message reply_raid_query_diy_rewards {
  map<uint32, raid_diy_reward>   diy_rewards   = 1; // <reward_id, rewards>
}


message reply_raid_open_raid {
  optional raid               raid     = 1;
  optional reply_raid_change  change   = 2;
  optional lineup             lineup   = 3;
  required raid_status        status   = 4;
  optional reward             reward   = 5;
}

message reply_raid_close {
  required string  key      = 1;
  optional reward  reward   = 2;
}

message reply_raid_transmit {
  required raid               raid     = 1; // 如果有change, raid+change才是最新的
  optional reply_raid_change  change   = 2;
}

message reply_raid_open_panel {
  required t_raid       type               = 1;
  repeated string       raid_keys          = 2;
  repeated raid_status  raid_status_list   = 3; // 迷宫状态
}

message reply_raid_recv_reward {
  optional uint32                        reward_id        = 1;
  required reward                        reward           = 2;
  required reply_raid_change             change           = 3;
  optional raid_recved_diy_rewards_info  diy_recvd_info   = 4;
  optional uint32                        heirloom_coin    = 5; // 遗物币数量
  optional string                        cell_type        = 6; // 用于客户端区分夏日活动的特殊地块
}

message reply_raid_recv_heirloom_coin{
  optional uint32              new_heirloom_coin   = 1; // 遗物货币剩余
  optional raid_heirloom_shop  new_heirloom_shop   = 2; // 遗物
}

message reply_raid_move {
  required result             result       = 1; // 移动是否成功
  optional bool               flash_move   = 2; // 是否快速移动,快速移动不播放动画
  optional reply_raid_change  change       = 3;
}

message reply_raid_ai_move {
  required result             result   = 1; // 移动是否成功
  required uint32             ai_id    = 2;
  optional reply_raid_change  change   = 3;
}

message reply_raid_end_battle {
  required t_battle_result    result              = 1;
  required reply_raid_change  change              = 2;
  optional reward             rebate_reward       = 3; // 返还的奖励
  repeated uint32             dilemma_heirlooms   = 4; // 奇境探险挑战本通关词条
}

message reply_raid_operation {
  required uint32             cell_id   = 1; // cell id
  optional reply_raid_change  change    = 2;
}


message reply_raid_boss{
  optional reply_raid_boss_open_panel  open_panel           = 1; // 打开界面,返回实时的血量信息
  optional reply_raid_boss_rank_board  query_rank_board     = 2; // 获取排行榜信息
  optional reply_raid_boss_his         query_his            = 3; // 获取历史记录
  optional reply_raid_boss_reset       reset_battle_times   = 4; // 重置战斗cd
  optional battle_record               query_oppo_record    = 5;
  optional reply_raid_start_battle     start_battle         = 6; // 返回值需求变动比较多,因此额外使用start end协议
  optional reply_raid_boss_end_battle  end_battle           = 7;
  optional reward                      recv_reward          = 8;
  optional reply_guild_top_info        guild_top_info       = 9; // 公会最高排名
}

message reply_raid_boss_open_panel{
  required uint64  today_best_damage   = 1; // 今日最佳伤害值
  required cd      battle_cd           = 2;
  optional uint64  his_best_damage     = 3; // 活动期间历史最佳伤害值
}

message reply_raid_boss_rank_board{
  repeated raid_boss_rank_entry  entries       = 1; // 排行榜Top数据
  optional uint64                self_rank     = 2;
  optional uint64                self_damage   = 3;
  repeated raid_boss_rank_user   ranks_user    = 4; // 每个排名段信息
}

message raid_boss_rank_user {
  repeated raid_boss_rank_entry  rand_entries   = 1; // 周年庆:前5%若干名的挑选一些数据 夏日活动:排名段内(如101-1000)若干玩家数据
  optional uint64                total_cnt      = 2; // 总人数
  optional uint64                pct_damage     = 3; // 基准伤害值
}

message raid_boss_rank_entry {
  required uint32        rank           = 1;
  required user_summary  user_summary   = 2;
  required uint64        damage         = 3;
}

message heirloom_boss_rank_entry {
  required uint32        rank           = 1;
  required user_summary  user_summary   = 2;
  required uint64        damage         = 3;
}

message reply_raid_boss_his{
  repeated raid_boss_record  his_list   = 1;
}

message reply_raid_boss_reset{
  required cd      battle_cd       = 1;
  required uint32  refresh_times   = 2; // 已经重置cd的次数
  required cost    cost            = 3;
}

message reply_raid_boss_end_battle {
  required reply_raid_end_battle  end_battle          = 1;
  required uint64                 today_best_damage   = 2; // 今日最佳伤害值
  required uint32                 lost_pct            = 3; // 已经打掉血量万分比
  required cd                     battle_cd           = 4;
  required uint64                 damage              = 5; // 本次的伤害值
  optional uint32                 cost_item_id        = 6; // 夏日活动消耗的局内道具ID
}


message reply_mystic_tower {
  optional reply_mystic_tower_start_battle   start_assist_battle      = 1;
  optional reply_mystic_tower_end_battle     end_assist_battle        = 2;
  repeated reply_mystic_tower_floor_record   query_floor_records      = 3;
  repeated reply_mystic_tower_assist_record  query_assist_records     = 4;
  repeated reply_mystic_tower_assist_record  query_assisted_records   = 5;
  optional reply_mystic_tower_rank_board     query_rank_board         = 6;
  optional reply_mystic_tower_apply          apply                    = 7;
  optional reply_mystic_tower_apply_list     query_apply_list         = 8;
}

message  reply_mystic_tower_start_battle{
  optional battle  start_battle_info   = 1; // 返回开始战斗公共信息
}

message reply_mystic_tower_end_battle {
  required t_battle_result  result   = 1;
}

message reply_mystic_tower_floor_record {
  required t_battle_record_source  source          = 1 [ default = server ];
  required battle_record           battle_record   = 2;
  repeated uint32                  changed_gates   = 3;
}

message repeated_query_floor_records {
  repeated reply_mystic_tower_floor_record  records   = 1;
}

message reply_mystic_tower_assist_record{
  required user_summary   user_summary    = 1;
  required uint32         block_id        = 2;
  required battle_record  battle_record   = 3;
}

message reply_mystic_tower_apply_list{
  repeated reply_mystic_tower_apply_info  list   = 1;
}
message reply_mystic_tower_apply_info{
  required user_summary  user_summary   = 1;
  required uint32        block_id       = 2;
}


message reply_mystic_tower_rank_board{
  repeated reply_mystic_tower_rank_board_entry  boards      = 1;
  optional uint32                               self_rank   = 2;
}

message reply_mystic_tower_rank_board_entry{
  required uint32        rank           = 1;
  required user_summary  user_summary   = 2;
  required uint32        score          = 3;
}

message reply_mystic_tower_apply{
  required result  result   = 1;
  optional cost    cost     = 2;
}

message reply_raid_start_battle{
  required battle             start_battle_info   = 1;
  required reply_raid_change  change              = 2;
}

message reply_raid_effect {
  required t_raid_condition  condition   = 1;
  required uint32            block_id    = 2;
  repeated uint32            groups      = 3;
}

//change数据均是增量更新，不是全量更新
message reply_raid_change {
  required                     uint64              cur_block            = 1;
  repeated                     raid_block          blocks               = 2;
  map<uint64, hero_dyn>                            self_dyns            = 3;
  repeated                     hero                assist_heroes        = 4;
  repeated                     uint64              heirlooms            = 5; // 增加的遗物
  map<uint32, uint64>                              effect2cnt           = 6;
  repeated                     raid_log            logs                 = 7;
  repeated                     reply_raid_effect   effect_groups        = 8;
  repeated                     raid_sprite         sprites              = 9;
  map<uint32, raid_diy_reward>                     diy_rewards          = 10;
  repeated                     uint32              deleted_heirlooms    = 11; // 减少的遗物
  optional                     uint32              heirloom_coin        = 12; // 新的遗物币的数量,有则触发本地对比,无则表示没有变化
  repeated                     int64kv             items                = 13; // 迷宫背包物品
  repeated                     m_hero_act          hero_acts            = 14; // 英雄体力
  optional                     uint32              cost_act_point       = 15; // 清除迷雾消耗体力数量
  optional                     uint64              skin_id              = 16; // 马车皮肤id发生变化,以同步为准
  optional                     raid_heirloom_boss  heirloom_boss_info   = 17; // 遗物boss
  repeated                     uint64              unlock_area_ids      = 18; // 已解锁的区域列表
  optional                     raid_task_change    task_info            = 19; // 任务数据
  repeated                     string              histories            = 20; // 策划所配置的history
  repeated                     uint64              must_hero_tids       = 21; // effect触发后需要一直生效的英雄上阵要求
  optional                     big_rich_man_info   big_rich_man_info    = 22; // 新的big_rich_man_info数据
}


message reply_mystic_tower_extra {
  optional reply_raid_change  change                  = 1; // 被别人协助通关之后的地块变化
  optional user_summary       assist_user_summary     = 2; // 被谁挟制
  optional bool               is_assist_applied       = 3; // 当前是否发起协助请求
  optional uint64             apply_assist_block_id   = 4; // 发起协助请求的block_id
  optional uint64             apply_assist_cnt        = 5; // 发起请求的累计次数
}


enum t_guild_result {
  success         = 1;
  wait_approval   = 2;
  guild_full      = 3;
}


message reply_guild {
  optional t_guild_result                result                   = 1;
  optional reply_open_guild              open_guild               = 2;
  optional reply_guild_info              create_guild             = 3;
  optional guild_info                    edit_guild               = 4;
  optional reply_search_guild            search_guild             = 5;
  optional reply_guild_info              join_guild               = 6;
  optional result                        leave_guild              = 7;
  optional reply_guild_info              kick_member              = 8;
  optional reply_guild_info              handle_guild_apps        = 9;
  optional reply_guild_info              promote_to_leader        = 10;
  optional reply_guild_info              demote_to_member         = 11;
  optional reply_guild_info              transfer_guild           = 12;
  optional reply_guild_history           guild_history            = 13;
  optional cd                            send_guild_mail          = 14;
  optional result                        disband_guild            = 15;
  optional reply_guild_applies           guild_applies            = 16;
  optional reply_rec_guilds              refresh_rec_guilds       = 17;
  optional reply_guild_members           guild_members            = 18;
  optional reply_guild_member_summaries  guild_member_summaries   = 19;
  optional reply_rec_guilds              rec_guilds               = 20;
  optional result                        set_strong_man           = 21;
  optional result                        rm_strong_man            = 22;
  optional reply_guild_info              leave_and_join           = 23;
  optional reply_guild_summary           guild_info               = 24;
  optional reply_guild_boss              reply_guild_boss         = 25;
  optional reply_guild_manor             reply_guild_manor        = 26;
  optional reply_guild_bounty            reply_guild_bounty       = 27;
  optional reply_guild_treasure          reply_guild_treasure     = 28;
  optional reply_guild_trial             reply_guild_trial        = 29;
  optional reply_guild_mile_stone        reply_guild_mile_stone   = 30;
  optional reply_guild_honor             reply_guild_honor        = 31;
  optional reply_hunting_star_info       set_hunting_star         = 32;
  optional result                        rm_hunting_star          = 33;
  optional reply_guild_vehicle           reply_guild_vehicle      = 34; // 公会战车
  optional reply_war_reward_popup        reply_war_reward_popup   = 35; // war结算奖励弹窗
  optional reply_guild_turntable         reply_guild_turntable    = 36; // 公会转盘
  optional reply_guild_boat              reply_guild_boat         = 37; // 公会跑船
}

message reply_guild_boss {
  optional reply_guild_boss_open_panel       open_panel        = 1;
  optional reply_guild_boss_challenge        challenge         = 2;
  repeated reply_guild_boss_rank_member      query_rank        = 3;
  optional reply_guild_boss_increase_reward  increase_reward   = 4;
  optional reply_guild_relations             pack_relations    = 5;
}

message reply_guild_relations {
  repeated user_relation  relations   = 1; // 公会成员信息
}

message reply_guild_boss_open_panel {
  repeated reply_guild_boss_info       bosses                   = 1; // BOSS信息
  required uint64                      team_cnt                 = 2; // 队伍数量
  required uint64                      yesterday_team_cnt       = 3; // 昨天队伍数量
  required uint64                      assist_cnt_limit         = 4; // 向狩猎之星借兵上限
  required uint64                      yesterday_cnt_limit      = 5; // 昨天向狩猎之星借兵上限
  required reply_next_guild_boss_info  next_boss_info           = 6; // 下一个boss的信息
  required reply_hunting_star_info     hunting_star_info        = 7; // 狩猎之星信息
  required uint64                      open_days_cnt            = 8; // 开服多少天了
  optional uint64                      yesterday_boss_id        = 9; // 昨天的bossID
  required uint64                      rank_board_id            = 10; // 公会排行榜key
  required uint64                      yesterday_rank_board_id  = 11; // 昨日公会排行榜key
}

message reply_hunting_star_info {
  optional user_summary  summary   = 1;
  repeated hero          heroes    = 2; // 狩猎之星提供的英雄
}

message reply_next_guild_boss_info {
  required uint64  boss_id   = 1;
  required uint64  open_ts   = 2;
}

message reply_guild_boss_info {
  required uint32                        id                     = 1; // BOSS ID
  optional cd                            cd                     = 2; // 挑战CD
  optional uint64                        max_damage             = 3; // 当日最大伤害
  optional uint64                        total_damage           = 4; // 当日总伤害
  optional uint32                        incr_reward_start_ts   = 5; // 额外奖励增幅的开始时间
  optional uint32                        incr_reward_end_ts     = 6; // 额外奖励增幅的截止时间
  repeated guild_boss_battle             self_battles           = 7; // 今日的自己的挑战记录
  required bool                          guide_flag             = 8;
  repeated reply_guild_boss_rank_member  guild_top_members      = 9; // 前三的玩家详细数据
  repeated guild_boss_battle             guild_battles          = 10; // 公会所有的战斗记录
  optional reply_guild_boss_settlement   settlement             = 11; // 结算信息
  optional reply_server_level            server_level           = 12; //锁定的竞技等级
}

message reply_guild_boss_settlement {
  repeated reply_guild_boss_rank_guild  settlement_tops      = 1; // 昨日结算最强工会（当天第一次打开有数据）
  optional uint64                       settlement_damage    = 2; // 昨日结算的总伤害（当天第一次打开有数据）
  optional uint64                       settlement_members   = 3; // 昨日参与人数
}

message reply_guild_boss_rank_guild {
  optional uint32         rank            = 1;
  optional guild_summary  guild_summary   = 2;
  optional uint64         total_damage    = 3;
}

message reply_guild_boss_challenge {
  optional reply_guild_boss_challenge_rslt  rslt                = 1;
  optional string                           err_code            = 2;
  optional reply_hunting_star_info          hunting_star_info   = 3;
}

message reply_guild_boss_challenge_rslt {
  required uint32  boss_id        = 1;
  required cd      battle_cd      = 2;
  required uint64  max_damage     = 3; // 本次战斗之后的最高伤害
  required uint64  damage         = 4; // 本次伤害
  required uint64  total_damage   = 5; // 总伤害
  required uint64  battle_id      = 6;
  required battle  battle         = 7;
  optional reward  reward         = 8; // 本次战斗的奖励
  required uint64  reward_cnt     = 9; // 奖励个数
}

message reply_guild_boss_rank_member {
  required user_summary  user_summary   = 1;
  required uint64        damage         = 2;
  required uint64        battle_id      = 3;
}

message reply_guild_boss_increase_reward {
  required uint32  boss_id                = 1;
  optional uint32  incr_reward_start_ts   = 2; // 额外奖励增幅的开始时间
  optional uint32  incr_reward_end_ts     = 3; // 额外奖励增幅的截止时间
  repeated item    guild_items            = 4; // 更新当前的公会道具信息
}

message reply_guild_member_summaries {
  repeated user_summary  summaries   = 1;
}

message reply_war_reward_popup {
  repeated war_guild_reward_popup popups = 1;
}

message reply_open_guild {
  optional reply_guild_info  guild_info     = 1; // 已经加入公会的返回公会信息
  optional reply_rec_guilds  rec_guilds     = 2; // 没有加入公会的返回推荐列表100条
}

message reply_rec_guilds {
  repeated guild_summary  guilds           = 1; // 推荐信息
  optional uint64         leave_guild_ts   = 2; // 上次离开公会时间
  optional uint64         leave_guild_cnt  = 3; // 离开公会的次数
}

message reply_search_guild {
  repeated guild_summary  guilds   = 1;
}

message reply_guild_summary {
  required guild_summary  guild   = 1;
}

message reply_guild_history {
  repeated guild_history_entry  guild_history   = 1;
}

message reply_guild_info {
  required uint32                 id             = 1;
  required guild_info             info           = 2;
  repeated reply_guild_member     members        = 3;
  optional reply_user_guild_info  user           = 4;
  repeated item                   items          = 5;
}

message reply_user_guild_info {
  required uint32  daily_active_point   = 1;
  required bool    guide_flag           = 2;
}

message reply_guild_applies {
  repeated user_summary  applies   = 1;
}

message reply_guild_members {
  repeated reply_guild_member  members   = 1;
}

message reply_guild_member {
  optional user_summary  summary               = 1;
  optional uint32        recent_active_point   = 2;
  optional uint64        enter_time            = 3;
}

message gv_preview {
  required uint32              season_id            = 1; // 本期赛季ID
  required guild_vehicle_phase phase                = 2; // 当前阶段
  repeated gv_guild_info       gv_guild_info        = 3; // 同组的所有公会信息，捐献量，随机展示的成员列表
  optional uint64              guild_total_dmg      = 4; // 公会累计伤害，battle/settle有值
  optional bool                settle_can_recv      = 5; // 有结算奖励可以领取
  optional uint64              group_id             = 6; // 有group_id说明有group，可以参与公会boss
  required uint64              end_ts               = 7; // 本期结束时间戳
  required uint64              phase_end_ts         = 8; // 当前阶段结束时间戳
}

// -------- 公会战车 --------

message gv_group_guild_brief {
  optional guild_summary guild_summary = 1; // 公会基本信息
  required uint64  total_damage        = 2; // 本期累计伤害
}

message gv_rank_item {
  required user_summary summary = 1;
  required uint64       value   = 2; // 伤害或捐献量
  optional uint64       ts      = 3; // 末次操作时间戳（伤害取last_attack_ts，捐献取last_donate_ts）
}

message reply_guild_vehicle {
  optional reply_guild_vehicle_info             info             = 1; // 打开主界面
  optional reply_guild_vehicle_donate           donate           = 2; // 捐献
  optional reply_guild_vehicle_attack           attack           = 3; // 攻击
  optional reply_guild_vehicle_rank             rank             = 4; // 排行榜
  optional reply_guild_vehicle_battle_records   battle_records   = 5; // 战斗记录
  optional reply_guild_vehicle_settle_reward    settle_reward    = 6; // 领取结算奖励
  optional reply_guild_vehicle_donate_log       donate_log       = 7; // 捐献日志
  optional reply_guild_vehicle_claim_task       claim_task       = 8; // 领取任务奖励
  optional reply_guild_vehicle_settle           settle           = 9; // 结算面板数据
  optional reply_guild_vehicle_contrib_panel    contrib_panel    = 10; // 查看公会捐献面板
  optional result                               set_lineup       = 11; // 设置战车出战成员
  optional reply_gv_group_info                  query_group_info = 12; // 查询本组信息
  optional gv_preview                           query_gv_preview = 13; // GV 预览数据
  optional reply_gv_recommend_records           recommend_records = 14; // 当期 Boss 推荐阵容战斗录像
}
message reply_guild_vehicle_settle_reward {
  optional reward  reward            = 1; // 基础奖励
  optional reward  settle_tech_bonus = 2; // 公会科技树加成部分（无加成时不下发）
}

message reply_gv_recommend_records {
  repeated gv_recommend_record records = 1;
}

message gv_recommend_record {
  required t_battle_record_source  source          = 1 [ default = server ]; // 录像来源
  required battle_record           battle_record   = 2; // 战斗录像
  optional uint64                  gs              = 3; // 阵容总战力
  optional uint64                  damage          = 4; // 该场战斗伤害
}

message reply_gv_group_info {
  repeated gv_guild_info       gv_guild_info        = 1; //key:同组的公会ID value:战车捐献总量
  optional uint64              guild_total_dmg      = 2; // 公会累计伤害，battle/settle有值
}

message gv_guild_info {
  optional guild_summary guild_summary  = 1; // 公会基本信息
  required uint64        contrib        = 2; // 战车捐献总量
  repeated user_summary  random_members = 3; // 随机展示的成员列表
}

message reply_guild_vehicle_claim_task {
  repeated uint32        tids    = 1; // 领取的任务 IDs
  optional reward        rewards = 2; // 实际发放的奖励
}

message reply_guild_vehicle_info {
  required guild_vehicle_phase          phase            = 1; // 当前阶段
  required uint32                       phase_end_ts     = 2; // 当前阶段结束时间戳
  required uint32                       vehicle_id       = 3; // 战车档位（所有阶段）
  repeated gv_group_guild_brief         group_guilds     = 4; // 本组公会列表（所有阶段）
  optional uint64                       vehicle_contrib  = 5; // 战车捐献总量，repair/battle有值
  optional uint64                       guild_total_dmg  = 7; // 公会累计伤害，battle/settle有值
  optional uint32                       box_lv           = 8; // 宝箱等级，battle有值
  optional uint64                       chest_dmg        = 9; // 宝箱当前伤害进度，battle有值
  optional uint32                       atk_count        = 10; // 今日已攻击次数，battle有值，客户端自行计算剩余
  optional uint64                       personal_contrib = 11; // 个人捐献量，repair/settle有值
  optional uint64                       personal_damage  = 12; // 个人伤害，battle/settle有值
  optional bool                         settle_can_recv  = 13; // 有结算奖励可以领取
  repeated gv_rank_item                 top3             = 14; // 本公会伤害top3，battle有值，最多3条
  repeated gv_user_task                 tasks            = 15; // 当日任务列表
  required uint64                       team_cnt         = 16; // 挑战队伍数量
  optional reply_server_level           server_level     = 17; // 当前服务器竞技等级相关信息
}

message reply_guild_vehicle_settle {
  repeated gv_rank_item                 member_contrib_rank   = 1; // 本公会所有成员捐献排行
  optional uint64                       guild_contrib_rank    = 2; // 本公会在组内捐献排名
  repeated gv_rank_item                 member_damage_rank    = 3; // 本公会所有成员伤害排行
  optional uint64                       guild_damage_rank     = 4; // 本公会在组内伤害排名
  optional uint64                       vehicle_id            = 5; // 战车档位
  optional uint64                       box_lv                = 6; // 宝箱等级
}

message reply_guild_vehicle_contrib_panel {
  required uint32        vehicle_id    = 1; // 战车档位
  required uint64        total_contrib = 2; // 本期捐献进度总值
  repeated user_summary  members       = 3; // 本期有捐献的成员，按捐献量逆序
}


message reply_guild_vehicle_donate {
  required uint32  vehicle_id       = 1; // 捐献后的战车档位
  required uint64  vehicle_contrib  = 2; // 捐献后的战车捐献总量
  required bool    level_up         = 3; // 是否升级
  required uint64  personal_contrib = 4; // 捐献后个人累计捐献量
  optional reward  rewards          = 5; // 本次捐献奖励
  optional cost    cost             = 6; // 本次消耗
}

message reply_guild_vehicle_attack {
  required uint64  damage           = 1; // 本次战斗伤害
  required uint32  atk_count        = 2; // 今日已攻击次数，客户端自行计算剩余
  required uint64  personal_damage  = 3; // 个人累计伤害
  required uint64  guild_total_dmg  = 4; // 公会累计伤害
  required uint32  box_lv           = 5; // 当前宝箱等级
  required uint64  chest_dmg        = 6; // 宝箱当前伤害进度
  required uint64  battle_id        = 7; // 录像ID
  optional reward  rewards          = 8; // 本次战斗奖励
  optional uint64  max_damage       = 9; // 个人历史最高伤害
}

message reply_guild_vehicle_rank {
  required guild_vehicle_rank_type  type          = 1;
  repeated gv_group_guild_brief     guild_ranks   = 2; // GV_RANK_GUILD_DMG时有值
  repeated gv_rank_item             member_ranks  = 3; // GV_RANK_MEMBER_DMG / GV_RANK_MEMBER_DONATE 时有值
}

message reply_guild_vehicle_battle_records {
  repeated gv_battle_record  records = 1;
}

message reply_guild_vehicle_donate_log {
  repeated gv_donate_log  logs = 1; // 最近20条，按时间倒序
}

// -------- 公会战车 end --------

message reply_guild_manor {
  optional reply_guild_manor_open_panel          open_panel           = 1;
  optional cd                                    occupy_block         = 2;
  optional cd                                    exchange_block       = 3;
  optional cd                                    set_glory_statue     = 4; // 放置荣誉雕像
  optional reply_guild_manor_query_glory_statue  query_glory_statue   = 5; // 查询荣誉雕像信息
  optional reply_guild_manor_visit               visit                = 6; // 拜访公会领地
  optional reward                                help_uid             = 7; // 拯救其他公会成员的挂机时间
  optional reward                                recv_dock_log        = 8; // 领取码头奖励
  optional reward                                claim_area_box       = 9;  // 领取大礼盒奖励
  optional reward                                claim_block_box      = 10; // 领取小礼盒奖励
  optional result                                assist_area_box      = 11; // 助力结果
  optional cd                                    share_assist_box     = 12; // 分享助力礼盒消息
  optional guild_skin                            save_skin_display    = 13; // 保存展示组合成功后返回最新装扮数据
}

message reply_guild_manor_open_panel{
  required result                               result                   = 1;
  optional guild_info                           guild_info               = 2;
  optional u_guild_manor                        u_guild_manor            = 3;
  repeated reply_guild_manor_block              blocks                   = 4;
  repeated guild_manor_building                 buildings                = 5;
  optional reply_word_boss_active_info          world_boss_active_info   = 6;
  repeated reply_guild_manor_query_glory_statue glory_statues            = 7; // 荣誉雕像,因war需要显示赛季信息，故提前下发部分数据，不包括users和damages
  optional reply_curseland_active_info          curseland_active_info    = 8;
  optional reply_race_dream_active_info         race_dream_active_info   = 9;
  optional uint64                               leave_guild_ts           = 10;
  optional uint64                               enter_time               = 11;
  optional guild_camp_banner                    guild_camp_banner        = 12;
  optional uint64                               shop_level               = 13;
  optional uint64                               boss_level               = 14;
  repeated reply_guild_manor_area               areas                    = 15; // 区域状态
  repeated uint64                               claimed_area_ids         = 16; // 已经领取过大礼盒的区域id列表
  repeated uint64                               claimed_block_ids        = 17; // 已经领取过小礼盒的地块id列表
  map<uint64, cd>                               unlock_box_area2share_cd = 18; // 解锁区域宝箱分享CD area_id -> cd
  repeated uint64                               recvd_dock_log_ids       = 19; // 已经领取过的码头日志id列表
  optional gv_preview                           gv_preview               = 20; // 公会战车预览，跨服开启后有值
  repeated guild_summary                        recommend_guilds         = 21; // 推荐公会 top3
  optional uint64                               leave_guild_cnt          = 22; // 离开公会的次数
  optional guild_skin                           guild_skin               = 23; // 公会装扮：有效套装+展示组合，过期项已过滤
  optional uint64                               tech_exp                 = 24; // 科技树经验
}

message reply_guild_manor_area {
  required uint32 area_id        = 1;  // 区域 ID
  required uint64 claimable_ts   = 2;  // 可领奖励的时间戳
  required bool   assisted       = 3;  // 是否已经助力过了
  repeated user_summary assist_summaries = 4;  // 已助力成员简要信息（最多3个）
}

message reply_word_boss_active_info {
  required uint64  start_ts   = 1;
  required uint64  end_ts     = 2;
  required uint32  boss_id    = 3;
}

message reply_curseland_active_info {
  required uint64                    start_ts         = 1;
  required uint64                    end_ts           = 2;
  required uint32                    season_id        = 3;
  optional curseland_auto_challenge  auto_challenge   = 4;
}

message reply_race_dream_active_info {
  required uint64                     start_ts         = 1;
  required uint64                     end_ts           = 2;
  required uint32                     season_id        = 3;
  optional race_dream_auto_challenge  auto_challenge   = 4;
}

message reply_guild_manor_query_glory_statue {
  required            uint32                  id            = 1;
  required            uint64                  acquired_ts   = 2;
  map<uint64, uint64>                         damages       = 3; // <uid, damage>
  repeated            user_summary            users         = 4;
  optional            uint64                  rank          = 5;
  optional            uint64                  season_id     = 6;
  optional            t_glory_statue_source   source_type   = 7;
}

message reply_guild_manor_visit {
  required result                   result       = 1;
  optional guild_info               guild_info   = 2;
  repeated reply_guild_manor_block  blocks       = 3;
  repeated guild_manor_building     buildings    = 4;
  repeated reply_guild_manor_area   areas        = 5; // 被拜访公会已解锁的区域
  optional gv_preview               gv_preview   = 6; // 公会战车预览
  repeated guild_summary            recommend_guilds   = 7; // 推荐公会 top3
  optional guild_skin               guild_skin   = 8; // 被拜访公会的装扮：有效套装+展示组合，过期项已过滤
}


// 公会红包
message reply_guild_treasure {
  optional reply_guild_treasure_open_panel     open_panel      = 1; // 打开公会红包界面
  optional reply_guild_treasure_recv_reward    recv_reward     = 2; // 领取公会红包,发红包index
  optional reply_guild_treasure_query_records  query_records   = 3; // 查看公会红包领取记录,发红包index
  optional reply_guild_treasure_query_tops     query_tops      = 4; // 具体玩法中，排名最好的成员，用于展示公会红包
}

message reply_guild_treasure_open_panel {
