}

message reply_m_map_change {
  required uint64         seq                = 1;
  repeated reply_m_block  blocks             = 2;
  repeated uint32         connected_groups   = 3; // 自己拥有的连通区域group, 为空时表示不变
  repeated uint32         changed_groups     = 4; // 有改变的连通区域group
  optional user_summary   new_player         = 5; // 新加入玩家
  optional reply_m_marks  team_marks         = 6; // 团队标记通知, 此时blocks 可能为空
  repeated slg_ladder     ladders            = 7;
  optional m_map_param    param              = 8; // 参数列表 slg9 稻草人 author: York
}

