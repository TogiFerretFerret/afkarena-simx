message reply_pumpkin_brawl_buy_boss_challenge_cd {
  required uint64 boss_tid      = 1;
  optional cd     challenge_cd  = 2; // 挑战cd
  optional cost   cost          = 3;
}

message reply_pumpkin_brawl_open_boss_dmg_rank {
  required uint64                         boss_tid   = 1;
  optional uint64                         self_point = 2;
  optional uint64                         self_rank  = 3;
  repeated rank_board_entry               entries    = 4;
