enum t_platform {
  lilith               = 1; // ios和google全球版
  wechat               = 2; // 微信登录
  lilith_official      = 3; // 国内官方ios/安卓(非google,官网下载)
  lilith_gray          = 4; // google的灰度包
  lilith_taiwan        = 5; // 台湾ios, google, mycard
  lilith_korea         = 6; // 韩国包
  huawei1              = 7; // 新华为
  oppo                 = 8; // oppo
  vivo                 = 9; // vivo
  yingyongbao          = 10; // 应用宝
