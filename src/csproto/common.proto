  completed   = 2;
  invalid     = 3;
}

message champion_arena_settlement {
  optional uint64                 settlement_phase = 1;
  optional uint64                 settlement_ts    = 2;
  optional uint64                 rank             = 3;
}

message assist_battle_event {
  required uint64                 id          = 1;
  required t_assist_event         event       = 2;
  required t_assist_team          type        = 3;
  required uint64                 uid         = 4; // 申请者ID或者是求助者ID
  optional uint64                 stage_id    = 5;
  optional uint64                 ts          = 6;
  optional uint64                 season_id   = 7;
  optional uint64                 battle_id   = 8;
  optional t_assist_event_status  status      = 9 [ default = normal ];
  repeated ucs                    params      = 10;
}

message assist_battle_apply {
  required t_assist_team  type        = 1;
  required uint64         apply_uid   = 2; // 请求助战的玩家ID
  required uint64         apply_ts    = 3; // 请求助战的时间
  optional uint64         stage_id    = 4;
  optional uint64         season_id   = 5;
}

message assist_battle_record {
  required t_assist_team  type         = 1;
  required uint64         assist_uid   = 2; // 助战的玩家ID
  required uint64         battle_id    = 3; // 战斗ID
  required uint64         battle_ts    = 4; // 战斗时间
