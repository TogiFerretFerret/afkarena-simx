//------------------ 大富翁 ------------------
message big_rich_man_info {
  optional   uint64                       exp              = 1[default = 0];   // 经验，用来计算领地等级
  optional   uint64                       rob_dice_sum     = 2[default = 0];   // 总的入侵步数
  optional   uint64                       rob_dice_cnt     = 3[default = 0];   // 已经走了多少步
  optional   uint64                       uid              = 4;                // 入侵的目标
  repeated   big_rich_man_effect          effects          = 5;                // 效果id - 产生效果的地块id，便于计算距离
  repeated   big_rich_man_effect          rob_effects      = 6;                // 入侵时的效果（由于自己的领地有特殊建筑，增益入侵效果）
  optional   double                       add_rob_resource = 7;                // 入侵时提升的资源获取百分比
  repeated   uint32                       ban_hero_ids     = 8;                // 需要禁用的英雄id
  repeated   big_rich_man_battle_record   records          = 9;                // 掠夺过程
  optional   uint32                       stage_id         = 10;               // 推关数
  repeated   uint32                       tmp_ban_hero_ids = 11;               // 需要临时禁用的英雄id
  repeated   uint32                       used_hero_ids    = 12;               // 使用过的英雄id
  repeated   big_rich_man_rob_dice_record rob_dice_records = 13;               // 掷骰子记录
  optional   uint32                       star_num         = 14[default = 0]; // 星星数
  optional   uint32                       base_morale      = 15[default = 0];  // 基础士气值(需要叠加effects后才是当前的)
  optional   double                       morale_add_reward= 16[default = 0];  // 士气值增加的收益百分比
  optional   uint32                       min_morale       = 17[default = 0];  // 最低士气值
  optional   uint32                       max_morale       = 18;               // 最高士气值(由领地等级决定)
  repeated   uint32                       last_battle_hero_tids = 19;          // 最后一场战斗使用的英雄tid
  optional   uint64                       sub_morale       = 20[default = 0];  // 扣掉的士气
}

message big_rich_man_effect {
  required uint32  effect_id        = 1; // 效果id
  required uint32  source_block_id  = 2; // 效果产生地块的id
}

enum t_big_rich_man_status {
  dice_over = 1; // 掷骰子结束
  deal_over = 2; // 操作结束
  start_rob = 3; // 开始入侵
  robbing   = 4; // 掠夺中
}

// 大富翁建筑类型
enum t_big_rich_man_building {
  mine_hero_exp       = 1;  // 经验矿
  mine_essence        = 2;  // 粉尘矿
  mine_gold           = 3;  // 金币矿
  mine_guild_coin     = 4;  // 公会币矿
  mine_talisman       = 5;  // 秘符碎片矿
  mine_homeland_coin  = 6;  // 坡尔金币矿
  wharf               = 7; // 码头
  stable              = 8; // 马厩
  factory             = 9; // 工厂
  stone_weak          = 10; // 迟缓石碑
  stone_blood         = 11; // 鲜血石碑
  stone_curse         = 12; // 怨毒石碑
  tower_magic         = 13; // 魔法塔
  tower_power         = 14; // 水晶塔
  tower_faith         = 15; // 信仰塔
  flower_red          = 16; // 奇异花
  flower_blue         = 17; // 能量花
  flower_yellow       = 18; // 祈愿花
  fountain            = 19; // 祝福之泉
  fountain_war        = 20; // 战争之泉
  fountain_vigour     = 21; // 活力之泉
}

message big_rich_man_block {
  required uint32                id                = 1;
  repeated big_rich_man_building buildings         = 2; // 大富翁建筑类型
  optional uint64                def_uid           = 3; // 驻防者uid
  optional uint32                squad_id          = 4; // 小队id
  repeated slot_hero             oppo_heroes       = 5; // 阵容
  repeated uint32                oppo_golden_slots = 6; // 设定的sp英雄生效技能
  repeated pet                   oppo_pets         = 7; // 设定的宠物
}

message big_rich_man_building {
  required    uint32                     id               = 1; // 建筑唯一id
  required    t_big_rich_man_building    building         = 2; // 建筑类型
  required    uint32                     lv               = 3[default = 1]; // 建筑等级
  required    uint64                     reward_end_ts = 4[default = 0]; // 当前一个结算间隔结束时间,可能大于活动结束时间
  repeated    asset                      tmp_assets       = 5; // 大富翁临时奖池，存储升级时的奖励，在下次收集时发放
  required    uint32                     robbed_seconds   = 6[default = 0]; // 被掠夺时间
  required    bool                       robbed           = 7[default = false]; // 被掠夺标志（每次rob_dice结束只能掠夺一下建筑，rob_dice后会置false）
  repeated    big_rich_man_effect        building_effects = 8; // 大富翁建筑效果（被其他建筑影响的效果）
  repeated    uint32                     ban_tids         = 9; // 建筑指定禁用tid列表
  repeated    uint32                     curse_tids       = 10; // 建筑诅咒的英雄tid列表
  optional    uint32                     selected_effect  = 11; // 建筑本身可能会有可选择的效果, 这里存实际选择的值
  required    uint64                     today_robbed_seconds = 12; // 该建筑今日被抢了多少秒
  required    uint64                     refresh_ts           = 13; // 用于刷新建筑每日被抢秒数的时间戳
  optional    uint64                     deprecated_reward_end_ts    = 14[deprecated = true]; // 废弃
  optional    uint64                     deprecated_suspend_ts       = 15[deprecated = true]; // 废弃
  optional    big_rich_man_prosperity    prosperity       = 16; // 繁荣状态
}

message big_rich_man_prosperity {
  required uint64 level =  1[default = 0]; // 繁荣等级
  required uint64 exp   =  2[default = 0]; // 繁荣升级需要的exp
}

message big_rich_man_squad {
  required    uint32          id           = 1;
  required    lineup          lineup       = 2;
}

message big_rich_man_assist_record {
  required   uint64                     init_ts         = 1; // 事件发生的时间戳
  required   uint64                     oppo_uid        = 2; // 对方的uid
  required   t_assist_record_type       type            = 3; // 协防类型
  optional   t_big_rich_man_building    building        = 4; // 协助的建筑类型
  optional   uint32                     lv              = 5; // 协助的建筑等级
}

message big_rich_man_rob_record {
  required   uint64                       init_ts            = 1;                  // 时间戳
  required   uint64                       robber_uid         = 2;                  // 劫匪的uid
  required   uint64                       be_robbed_uid      = 3;                  // 被劫的uid
  repeated   big_rich_man_battle_record   battle_records     = 4;                  // 掠夺过程
  repeated   asset                        assets             = 5;                  // 抢到的奖励
  required   uint64                       add_exp            = 6[default = 0];     // 防守成功增加的领地经验
  required   bool                         revenged           = 7[default = false]; // 已经复仇过为true，未复仇过为false
  optional   bool                         recvd              = 8[default = false]; // 已经领取过为true，未领取过为false
  required   uint32                       add_star           = 9[default = 0];     // 增加的小星星
  repeated   asset                        success_def_assets = 10;                 // 防御成功奖励资源
  repeated   big_rich_man_rob_dice_record rob_dice_records   = 11;                 // 掷骰子记录
  repeated   raid_block                   blocks             = 12;                 // 地图
  optional   t_battle_result              result             = 13;                 // 掠夺结果
  optional   double                       morale_add_reward  = 14;                 // 士气值增加的收益百分比
  required   uint64                       map_id             = 15;                 // 录像地图id
}

message big_rich_man_rob_dice_record {
  optional uint32                            ts                    = 1; // 时间戳
  optional uint32                            cur_block             = 2; // 新的位置
  optional uint32                            step                  = 3; // 掷骰子点数
  optional uint32                            sub_step              = 4; // 减掉的点数
  optional big_rich_man_info                 big_rich_man_info     = 5; // 入侵时信息
  repeated big_rich_man_effect               add_effects           = 6; // 新增的效果 - 地块id列表
}

enum t_bit_rich_man_result {
  victory   = 1;
  defeat    = 2;
  theft     = 3; // 盗窃
}

message big_rich_man_battle_record {
  optional  uint64                   deprecated_id       = 1[deprecated=true]; // 建筑id
  optional  t_big_rich_man_building  deprecated_building = 2[deprecated=true]; // 建筑类型
  optional  uint64                   deprecated_lv       = 3[deprecated=true]; // 建筑等级
  required  t_bit_rich_man_result    result              = 4; // 战斗结果
  optional  uint64                   def_uid             = 5; // 协防人
  optional  uint64                   ts                  = 6; // 时间戳
  optional  uint64                   effective_morale    = 7; // 结算(有效)士气值
  optional  big_rich_man_building    the_building        = 8; // 被抢的建筑
