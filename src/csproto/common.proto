  optional user_summary        user_summary  = 4;
  optional war_voke            voke          = 5; // 当前职业
  optional bool                is_bet        = 6; // 是否下注了
  optional uint64              gs            = 7; // war内所有队伍战力总和（含宠物）
  map<int64, uint64>           ally_kicked   = 8; // key: ally_tid, value: ts
  optional t_war_ally_title    title         = 9; // 官职
  optional uint64              member_rank   = 10; // 玩家级别
  repeated ph_honor            ph_honors     = 11; //被授予的勋章
}

message rank_board_entry {  // 根据排行榜类型不同，可能返回user_summary或guild_summary
  required uint64         rank            = 1;
  optional user_summary   user_summary    = 2;
  required uint64         point           = 3;
  required uint64         time            = 4 [ default = 0 ];
  optional guild_summary  guild_summary   = 5;
  optional int64          param           = 6; // 额外参数。乱时之境排行榜的param表示名次变化差值; 单队梦境表示层数
}

//服务器信息
message server_status {
  required uint64        svr_id       = 1;
  required uint64        zone_id      = 2; // 合服后的真实SvrID(没有合服则ZoneID等于SvrID）
  required t_svr_status  svr_status   = 3;
}

//支持负数的kv
message int64kv {
  required int64  key     = 1;
  required int64  value   = 2;
}

message uint64kv {
  optional uint64  key     = 1;
  optional uint64  value   = 2;
}

message asset {
  required t_asset     type     = 1;
  required t_asset_id  id       = 2; // t_asset_id currency或者daily_variable类型或者是道具类ID, 道具ID必须小于1kw
  required uint64      amount   = 3;
}

message assets {
  repeated asset  assets   = 1;
}

message name_card {
  required string  name               = 1 [ default = "New Player" ];
  required uint64  last_modify_time   = 2 [ default = 0 ];
  optional bool    is_conflicted      = 3 [ default = false ]; // 合区后是否名字发生冲突
}

//新增包含 default 值的字段一定要注意 md5 计算
message item {
  required uint32  id       = 1;
  required uint64  amount   = 2;
}


//新增包含 default 值的字段一定要注意 md5 计算
message equip {
  required            uint32  id                = 1;
  required            uint32  tid               = 2; // table_id, 配置表ID
  required            uint64  amount            = 3;
  map<string, uint32>         attrs             = 4; // <"hero_tag", 种族tag_id> <"hero_tid", hero_tid> 绑定种族、英雄
  required            uint32  enhance_lv        = 5 [ default = 0 ]; // 强化等级
  required            uint64  enhance_exp       = 6 [ default = 0 ]; // 强化经验
  optional            uint32  refine_tag        = 7;
  repeated            uint32  his_refine_tags   = 8; // 历史重铸过的tag
  optional            uint32  resonate_tid      = 9; // 共鸣后的装备tid,undefined标识未开启共鸣
  optional            uint32  source_tid        = 10; // 拉平后源装备的tid,用于计算装备种族tag和英雄tag战力
}

message sig {
  required uint32  lv   = 1;
}

//新增包含 default 值的字段一定要注意 md5 计算
// 特别注意！新增字段时要注意处理unit:reset_hero/1
// 特别注意！新增字段时要注意修改unit:create_hero_with_tid/4 函数！
// 特别注意！新增字段时要注意maze、raid中与构造英雄有关的函数，如raid_util:assist_heroes/2！`
message hero {
  required            uint64         id                = 1; // 英雄唯一id
  required            uint32         tid               = 2; // table_id, 配置表ID
  required            uint32         quality           = 3; // 英雄星星
  required            uint32         rank              = 4 [ default = 1 ]; // 品阶
  required            uint32         level             = 5 [ default = 1 ]; // 等级
  required            uint64         gs                = 6 [ default = 0 ]; // 英雄战力
  map<uint32, equip>                 equips            = 7; // 装备, 固定六个, 默认为空的
  required            uint32         artifact_lv       = 8 [ default = 0 ]; // 0级表示没有神器，1级才有初始属性
  optional            bool           locked            = 9 [ default = false ]; // 英雄锁
  optional            artifact       artifact          = 10; // 神器 前面的 artifact_lv字段暂时先不删
  optional            uint32         pentagram_lv      = 11 [ default = 0 ]; // 法阵加持的等级
  optional            sig            sig               = 12; // 英雄专属装备,undefined表示没有激活
  optional            uint32         skin              = 14; // 英雄穿戴的时装
  repeated            furniture      furnitures        = 15; // 家具
  optional            t_hero_source  source_type       = 16 [ default = normal ];
  map<string, uint64>                assist_hero_id    = 18; // 女仆助力的英雄id。<t_lineup, hero_id> 不同阵容，该英雄id不同
  optional            uint32         infinite_amulet   = 19; // 乱时之境玩法中的英雄信物
  optional            uint64         source_uid        = 20; // 英雄的来源
  optional            uint64         trans_quality     = 21; // 战斗校验侧使用, 完全由quality产生，就像level和rank一样的关系,修改quality时需要同步修改。
}

message blank_hero{
  required uint64  id        = 1; // 英雄唯一id
  required uint32  tid       = 2; // table_id, 配置表ID
  required uint32  quality   = 3; // 英雄星星
}

message setting {
  required t_setting  key     = 1;
  required string     value   = 2;
}

message ukv {
  required t_ukv   key     = 1;
  required string  value   = 2;
}

message sell_good {
  required uint32    index          = 1;
  required asset     good           = 2;
  required currency  cost           = 3;
  required bool      is_hot         = 4 [ default = false ];
  required bool      is_sold        = 5 [ default = false ]; // 为true,表示已经卖出，购买时会报错
  required uint32    discount_pct   = 6 [ default = 100 ]; // cost 为原价，需要乘以折扣/100
  optional uint32    source         = 7 [ default = 0 ]; // 商品来源为活动ID, 其余为0
  optional bool      is_replaced    = 8 [ default = false ]; // 格子商品是否被替换过
  optional cd        purchase_cd    = 9; // 购买cd
  optional uint64    group_tid      = 10; // csv_shop_group.csv的key
}

//  typeId : 0:表示一般邮件 1:表示公告 , 2:紧急邮件 不可一键领取 3:之前被旧版竞技场占了,先空着 4:版本邮件 5:退款邮件 8:订阅 10:公会长老和会长发 公会邮件
message mail {
  required uint32           id                 = 1 [ default = 0 ];
  required uint64           create_ts          = 2;
  required uint64           expire_ts          = 3;
  optional mail_content     content            = 4;
  required s_mail           status             = 5 [ default = unread ];
  required uint32           type_id            = 6 [ default = 0 ];
  repeated asset            assets             = 7;
  required bool             is_assets_rcvd     = 8 [ default = false ];
  optional uint32           global_mail_id     = 9;
  repeated l10n             l10ns              = 10;
  repeated os_mail_content  os_mail_contents   = 11;
  optional uint32           gmt_mail_id        = 12; // gmt个人邮件标识，同一批gmt个人邮件的该字段值相同。68版本暂未获得gmt支持，该字段值默认为时间戳
  optional uint64           from_uid           = 13;
}

message l10n{
  required t_lang  lang    = 1;
  required string  from    = 2;
  required string  title   = 3;
  required string  body    = 4;
}

message os_mail_content {
  required t_os    os      = 1;
  required string  from    = 2;
  required string  title   = 3;
  required string  body    = 4;
}

message mail_content {
  optional mail_text_content    text_content     = 1; // 邮件内容自己定义
  optional mail_format_content  format_content   = 2; // 邮件内容在Mail.csv表格里面定义
}

message mail_text_content {
  required string  from    = 1;
  required string  title   = 2;
  required string  body    = 3;
  repeated ucs     params  = 4; // 额外参数,比如war里面的发件人职位
}

message mail_format_content {
  required uint32  cfg_id   = 1;
  repeated ucs     params   = 2;
}

message misc_reward {
  required t_misc_reward  t_misc_reward   = 1;
  required reward         reward          = 2;
}

message tavern_npc {
  repeated npc     npcs     = 1; // 玩家拥有的npc
  optional uint32  cur_id   = 2; // 玩家当前使用的npc
}

message npc {
  required uint32  npc_id     = 1; // NPC的id
  optional bool    is_trial   = 2 [ default = false ]; // 是否是试用NPC
}

message pet {
  optional uint64      id        = 1; // pet唯一id
  required uint32      tid       = 2; // table_id, 配置表ID
  required uint32      level     = 3 [ default = 1 ]; // 宠物等级（等于英雄共鸣等级）
  required uint32      quality   = 4 [ default = 0 ]; // 品质
  required uint64      gs        = 5 [ default = 0 ]; // 战力
  repeated pet_talent  talents   = 6; // 特质词条
}

// 宠物词条
message pet_talent {
  required uint64  tid       = 1; // 词条ID
  required uint64  quality   = 2; // 词条品质
}

//宠物合成结果
message pet_mix_info {
  repeated uint64  pet_ids   = 1; // 宠物列表
  required pet     new_pet   = 2; // 合成的新宠物信息
}

message pet_capture_region {
  required          uint64    region_id     = 1; // 区域ID
  repeated          pet_unit  pets          = 2; // 当前随机的宠物池
  map<uint64, bool>           unlock_pets   = 3; // 当前解锁的宠物<PetID, IsRecvd>
  optional          bool      is_recvd      = 4 [ default = false ]; // 是否领取过解锁奖励
}

message pet_unit {
  required uint64  tid       = 1;
  required uint64  quality   = 2;
}

// 扩展reward时需要更新hgame_oss的build_reward_assets_arg/1方法
message reward {
  repeated asset      assets                 = 1;
  repeated equip      equips                 = 2;
  repeated hero       heroes                 = 3;
  repeated artifact   artifacts              = 4;
  repeated furniture  furnitures             = 5;
  repeated hero       balance_trial_heroes   = 6;
  repeated pet        pets                   = 7;
}

enum t_misc_reward {
  t_normal               = 1;
  t_card                 = 2;
  t_starland             = 3;
  t_guild_skin           = 4; // 公会装扮加成（daily_task 领奖场景使用）
  t_guild_turntable_tech = 5;
}

message cost {
  repeated asset   assets          = 1;
  repeated uint32  equip_ids       = 2;
  repeated uint64  hero_ids        = 3;
  repeated uint32  artifact_ids    = 4;
  repeated uint32  furniture_ids   = 5;
  repeated uint32  pet_ids         = 6;
}

message task_info {
  required uint32     daily_point             = 1 [ default = 0 ];
  required uint32     weekly_point            = 2 [ default = 0 ];
  repeated uint32     daily_recved_chests     = 3;
  repeated uint32     weekly_recved_chests    = 4;
  repeated todo_task  daily_todolists         = 5;
  repeated todo_task  weekly_todolists        = 6;
  repeated line_task  line_tasklists          = 7;
  repeated uint32     recent_daily_points     = 8;
  optional bool       is_later_daily_reward   = 9 [ default = false ]; // 满足一定条件后日任务箱子会被替换
}

message todo_task {
  required uint32  id                 = 1;
  required uint64  target_progress    = 2 [ default = 0 ];
  optional uint64  last_reward_time   = 3;
}

// 用于top_honor型的任务，默认所有玩家都有该任务，但是玩家身没有该结构，如果有该结构表示已经领取过
message line_task {
  required uint32  line              = 1;
  required uint32  id                = 2;
  required uint64  target_progress   = 3 [ default = 0 ];
  required bool    triggered         = 4 [ default = false ];
  repeated uint32  recvd_ids         = 5;
}

message guild_info {
  optional         uint64        svr_id                  = 1;
  optional         string        name                    = 2; // 公会名 [editable]
  optional         uint64        icon                    = 3; // 公会头像 [editable]
  optional         t_lang        lang                    = 4; // 语言 [editable]
  optional         int32         time_zone               = 5; // 时区
  optional         uint64        active_point            = 6 [ default = 0 ]; // 活跃值
  optional         string        desc                    = 7 [ default = "" ]; // 公会描述 [editable]
  optional         string        apply_desc              = 8 [ default = "" ]; // 公会申请描述 [editable]
  optional         uint64        chairman_id             = 9; // 会长id
  optional         uint64        create_time             = 10; // 创建时间
  required         uint64        last_edit_time          = 11 [ default = 0 ]; // 上次修改时间
  optional         t_guild_join  join_type               = 12;
  required         uint64        level                   = 13 [ default = 1 ]; // 工会等级
  required         uint64        exp                     = 14 [ default = 0 ]; // 工会经验值
  required         uint64        require_pg_lv           = 15 [ default = 0 ]; // 加入公会要求的玩家共鸣水晶等级
  optional         cd            guild_mail_cd           = 16;
  map <uint32, cd>               open_boss_cds           = 17; // 收到开启boss的cd
  optional         uint64        avg_lv                  = 18; // 推荐系统使用
  optional         uint64        daily_active_point      = 19 [ default = 0 ];
  optional         uint64        daily_update_ts         = 20 [ default = 0 ];
  optional         uint64        weekly_update_ts        = 21 [ default = 0 ];
  optional         uint64        strong_man_set_cnt      = 22 [ default = 0 ]; // 本周设置strong_man的次数
  optional         uint64        avg_stage_id            = 23 [ default = 0 ];
  optional         uint64        avg_pg_lv               = 24 [ default = 0 ];
  optional         uint64        name_prohibited_ts      = 25; // 公会名禁止修改时间
  optional         uint64        desc_prohibited_ts      = 26; // 公会描述禁止修改时间
  repeated         uint64        active_point_his_list   = 27; // 工会历史活跃度保留7日
  repeated         uint64        avatars                 = 28; // 拥有的头像,头像字段是 icon
  optional         uint64        frame                   = 29 [ default = 1 ]; // 头像框 [editable]
  repeated         uint64        frames                  = 30; // 拥有的头像框
  repeated         nameplate     nameplates              = 31; // 铭牌库
  optional         uint64        product_progress        = 32 [ default = 0 ]; // 公会BOSS增益道具的产出进度
  optional         uint64        icon_bg                 = 33 [ default = 1 ]; // 公会头像底图 [editable]
  repeated         uint64        avatar_bgs              = 34; // 拥有的头像,头像背景字段是 icon_bg
}

message guild_skin {
  repeated guild_skin_suit_item suits   = 1; // 资产库：按套装持有，下发时已过滤过期项
  repeated guild_skin_display   display = 2; // 展示组合：部位 -> 皮肤，未下发的部位显示原皮
}

message guild_skin_suit_item {
  required uint64 suit_tid  = 1; // 关联配置 csv_guild_skin_suit
  optional uint64 expire_ts = 2; // 不存在表示永久生效
}

message guild_skin_display {
  required uint32 part    = 1; // 部位，枚举与 GuildSkinMain.csv 的 Part 列一致
  required uint64 skin_id = 2; // 关联配置 csv_guild_skin_main
}

message war_guild_reward_popup {
  required uint64 season_id       = 1;  // 赛季ID
  required uint64 task_tid        = 2;  // 2001=城 2002=树
  optional uint64 skin_suit_tid   = 3  [default = 0]; // 公会皮肤套装ID，0=无皮肤
  optional uint64 statue_tid      = 4;  // 雕像
  optional uint64 honor_tid       = 5;  // 荣誉奖杯：7=耀都荣光  8=圣枝庇佑
  optional uint32 honor_lv        = 6  [default = 0]; // 奖杯品阶 1/2/3
  optional string guild_name        = 7;  // 公会名（结算时快照）
  optional uint64 guild_icon        = 8;  // 公会图标
  optional uint64 guild_icon_bg     = 9;  // 公会图标底板
  optional uint32 guild_lv          = 10 [default = 0]; // 公会等级（结算时快照）
  optional uint32 guild_member_cnt  = 11 [default = 0]; // 公会人数（结算时快照）
}

message guild_mile_stone {
  required            uint64  cur_id        = 1 [ default = 1 ]; // 公会当前进行的里程碑ID
  map<uint64, uint64>         finish_time   = 2; // 里程碑完成时间
}
message guild_task {
  required uint64  task_tid           = 1;
  required uint64  progress           = 2 [ default = 0 ]; // 进度
  required uint64  last_update_time   = 3 [ default = 0 ]; // 上一次更新进度的时间
  repeated uint64  already_uids       = 4; // 已经加过进度的uid
}

message guild_mile_stone_info {
  required uint64  tid                = 1; // 里程碑ID
  required uint64  last_reward_time   = 2 [ default = 0 ]; // 里程碑限时奖励-领取的时间
}

// 公会荣誉
message guild_honor {
  repeated guild_honor_info  info    = 1; // 奖杯信息
  repeated uint64            equip   = 2; // 公会装备的奖杯，0表示没有装备任何奖杯
}

message guild_honor_info {
  required uint64  tid       = 1; // key
  required uint64  lv        = 2 [ default = 0 ]; // 荣誉奖杯等级
  repeated uint64  recv_ts   = 3; // 每一等级荣誉奖杯获得的时间
}

message guild_summary {
  optional uint32             id                      = 1;
  optional uint32             svr_id                  = 2;
  optional string             name                    = 3; // 公会名     [editable]
  optional uint32             icon                    = 4; // 公会图标    [editable]
  optional t_lang             lang                    = 5; // 语言       [editable]
  optional string             apply_desc              = 6; // 公会申请描述 [editable]
  optional t_guild_join       join_type               = 7;
  required uint32             level                   = 8 [ default = 1 ]; // 工会等级
  required uint32             require_pg_lv           = 9 [ default = 0 ]; // 加入公会要求的玩家共鸣等级
  optional uint32             member_count            = 10; // 公会人数
  optional uint32             active_point            = 11; // 活跃值
  repeated uint32             active_point_his_list   = 12; // 工会历史活跃度保留7日
  optional uint32             frame                   = 13 [ default = 1 ]; // 头像框
  repeated nameplate          nameplates              = 14; // 铭牌库
  repeated guild_honor_equip  honor_equip             = 15; // 装备的荣誉奖杯
  optional uint64             icon_bg                 = 16 [ default = 1 ]; // 公会图标-底图
  optional uint64             exp                     = 17; // 公会经验
  optional uint32             chairman_id             = 18; // 会长id
  optional uint64             daily_active_point      = 19; // 每日获得活跃值
  optional uint64             guild_tech_exp          = 20; // 科技树经验
}

message guild_honor_equip {
  required uint64  pos       = 1;
  optional uint64  tid       = 2;
  optional uint64  lv        = 3;
  optional uint64  recv_ts   = 4;
}

message guild_history_entry {
  optional uint32  timestamp    = 1;
  optional uint32  content_id   = 2;
  repeated ucs     params       = 3;
}

enum t_guild_rank_type {
  point_rank        = 1; // 公会活跃度
  guild_boss_rank   = 2; // 公会boss伤害排行
  arena_rank        = 3; // 竞技场排名
  stage_rank        = 4; // 推关排名
  join_camp_rank    = 5; // 猎宝单次参与人数排名
  guild_vehicle_rank = 6; // 公会战车伤害排行
}

message tower {
  required tower_info  tower_info         = 1;
  repeated tower_info  race_tower_infos   = 2;
}

message tower_info {
  required uint32    floor_id      = 1 [ default = 0 ];
  optional cd        cd            = 2;
  required t_tower   type          = 3;
  optional uint32    failure_num   = 4;
  optional tower_cd  tower_cd      = 5; // 712关之前使用cd结构,之后使用tower_cd(开启跨天累计计数)
}

message tower_cd {
  required uint32  num                 = 1; // 当前剩余体力
  required uint64  last_restore_time   = 2; // 上次刷新时间
}

// 废弃,被tower_floor替代
message tower_record {
  required            uint32  floor_id   = 1;
  map<uint64, uint64>         records    = 2; // <gs, battle_id>
}

message tower_floor {
  required            t_tower  type       = 1;
  required            uint32   floor_id   = 2;
  map<uint64, uint64>          records    = 3; // <gs, battle_id>
}

message cd {
  required uint32  id                  = 1;
  required uint32  cur_point           = 2 [ default = 0 ];
  required uint64  last_use_time       = 3 [ default = 0 ];
  required uint64  last_restore_time   = 4 [ default = 0 ];
  optional uint32  extra_point         = 5 [ default = 0 ]; // 额外点数，是其他方式附加的点数，作用于stone类型
}

message slot_hid {
  required uint32  slot           = 1;
  required uint64  hero_id        = 2;
  optional uint32  artifact_tid   = 3; // 70版本公会英雄阵容用到该字段
}

message slot_hero {
  required uint32  slot   = 1;
  required hero    hero   = 2;
}

message lineup {
  required t_lineup  type                    = 1;
  repeated slot_hid  hids                    = 2;
  repeated uint32    selected_golden_slots   = 3; // 选择生效的golden英雄技能，默认为[] 不选择
  repeated uint64    pet_ids                 = 4; // 上阵的宠物
}

message lineup_team {
  required t_lineup  type    = 1;
  optional uint64    id      = 2;
  repeated team      teams   = 3;
}

message team {
  optional uint32    team_id                 = 1;
  repeated slot_hid  hids                    = 2;
  repeated uint32    selected_golden_slots   = 3; // 选择生效的golden英雄技能，默认为[] 不选择
  repeated uint64    pet_ids                 = 4; // 上阵的宠物
}

message team_with_hero {
  optional uint32     team_id                 = 1;
  repeated slot_hero  slot_heroes             = 2;
  repeated uint32     selected_golden_slots   = 3; // 选择生效的golden英雄技能，默认为[] 不选择
  repeated pet        pets                    = 4; // 上阵的宠物信息
}


//新增包含 default 值的字段一定要注意 md5 计算
message currency {
  required t_asset_id  type   = 1;
  required uint64      cnt    = 2;
}

message acc_summary {
  optional acc_user_summary            user                   = 1; //玩家关卡进度最高的角色
  optional uint64                      svr_id                 = 2; //最后一次登录的服务器ID
  optional uint64                      last_login_ts          = 3; //最后一次登录时间
  optional string                      region                 = 4; //大区需要用字符串 组队服/经典服的 t_region定义不相同
}

// 因为跨服务器查询玩家信息 两边的user_summary保存的各类配置表ID无法对上 因此专门新增一个跨服查询玩家信息
message acc_user_summary {
  required uint64                      uid                    = 1;
  optional uint32                      svr_id                 = 2;
  optional string                      name                   = 3;
  optional uint32                      level                  = 4;
  optional string                      avatar                 = 6;
  optional string                      stage                  = 7; //这里是读取配置表关卡对应的显示文本
}

message user_summary {
  required uint64                      uid                    = 1;
  optional uint32                      svr_id                 = 2;
  optional string                      name                   = 3;
  optional uint32                      level                  = 4;
  optional t_gender                    gender                 = 5;
  optional string                      avatar                 = 6;
  optional uint32                      frame                  = 7;
  optional string                      country_or_region      = 8;
  optional t_lang                      lang                   = 9;
  optional uint32                      guild_id               = 10;
  optional string                      guild_name             = 11;
  optional t_guild_title               guild_title            = 12;
  optional uint64                      full_gs                = 13;
  optional uint64                      top_gs                 = 14;
  optional uint32                      last_offline           = 15;
  optional bool                        is_online              = 16;
  optional bool                        is_unknown             = 17; // 出现异常时候, 将这个字段设为true
  optional uint32                      cur_stage              = 18;
  optional uint64                      cur_deep_stage         = 19;
  optional uint32                      cur_tower              = 20;
  repeated hero_summary                mercenaries            = 21;
  optional string                      city                   = 22;
  repeated uint32                      troop_ids              = 23; // 玩家的羁绊,各个模块计算战斗数据需要用到
  repeated tower_info                  race_towers            = 24;
  optional bool                        guild_strong_man       = 25; // 公会精英
  optional bool                        is_deleted             = 26;
  optional uint64                      best_15_gs             = 27;
  repeated uint64                      champion_def_gs_list   = 28; // 每一个队伍的战力分开存储
  optional astrolabe                   astrolabe              = 29;
  optional uint32                      pg_lv                  = 30;
  optional user_summary_homeland_gift  homeland_gift          = 31;
  optional uint32                      homeland_gs_radio      = 32 [ default = 0 ]; // 家园提供的战力加成总和
  repeated user_gmt_cmd                gmt_cmds               = 33; // gmt 对 玩家的状态干预
  repeated exhibited_emblem            exhibited_emblems      = 34; // 徽章展示数据
  optional uint64                      create_ts              = 35 [ default = 0 ]; // 创角时间，62版本添加
  optional uint32                      guild_icon             = 36; // 公会icon
  optional nameplate                   nameplate              = 37; // 铭牌
  optional t_display_opt               display_opt            = 38 [ default = lv ]; // 显示设置
  repeated nameplate                   nameplates             = 39; // 铭牌库
  optional string                      ip_location            = 40; // 玩家ip地址所在地，精确到省
  optional uint32                      guild_frame            = 41; // 工会头像框
  repeated nameplate                   guild_nameplates       = 42; // 工会铭牌
  optional uint32                      hero_cnt               = 43 [ default = 0 ]; // 英雄数量
  optional uint64                      pvp_arena_def_gs       = 44; // pvp竞技场防守战力
  optional uint64                      guild_icon_bg          = 45; // 公会icon_bg
  optional bool                        guild_hunting_star     = 46; // 公会狩猎之星
  optional uint64                      champion_arena_def_gs  = 47; //锦标赛竞技场的战力
  repeated bag_hero_entry              bag_hero_entries       = 48; // 背包英雄列表（各TID当前最高品阶）
  optional uint64                      gs_guild_tech_exp      = 49; // 公会科技经验 (最近一次刷新公会属性时的值)
}

enum t_display_opt {
  lv          = 1; // 默认显示
  nameplate   = 2; // 显示铭牌
}

enum t_nameplate_type {
  curseland_govern   = 1; // 诅咒梦境主榜
  curseland_minor    = 2; // 诅咒梦境分榜
  race_dream         = 3; // 竞速梦境
  guild_level        = 4; // 工会铭牌 - 等级
  team_arena_local   = 5; // 组队竞技场
  team_arena_group   = 6; // 组队竞技场（跨服）
  act_fish           = 7; // 2026 钓鱼
  act_guild_contra   = 8; // 公会魂斗罗活动
}

message nameplate {
  optional uint32            rank        = 1; // 名次
  optional uint64            expire_ts   = 2; // 过期时间
  optional uint32            total       = 3; // 排行榜总人数
  optional uint32            percent     = 4; // 百分之几 * 10 (比如85代表百分之八点五， 110代表百分之11， 490代表百分之49)
  optional t_nameplate_type  type        = 5 [ default = curseland_govern ]; // 铭牌类型
  optional uint32            param       = 6; // 其余信息，例如对于 curseland_minor 类型来说，这里存的是 lgd_id（巅峰竞技场大区）
  optional uint64            tid         = 7; // 铭牌id csv_avatar_nameplate表格tid
}

message user_gmt_cmd{
  required string  key         = 1;
  optional uint64  expire_ts   = 2;
}

message user_summary_homeland_gift {
  optional uint32  best_homeland_gift   = 1; // undefined 未生成；0 礼物不可见；> 1 最佳礼物id
  optional uint64  last_update_ts       = 2 [ default = 0 ];
}

message battle {
  required t_battle       type     = 1; // 客户端传，服务器校验
  required battle_common  common   = 2; // 战斗校验参数模块 包含类型 随机种子等
  optional battle_input   input    = 3; // 战斗校验输入模块
  optional battle_output  output   = 4; // 战斗校验输出模块，用来跑录像和做简要信息
  optional bytes          d_test   = 5; // 战斗屏蔽表格的数据
}

// 背包英雄 (key: 英雄TID, value: 当前最高品阶)
message bag_hero_entry {
  optional uint64 hero_tid     = 1; // 英雄 TID
  optional uint64 best_quality = 2; // 当前最高品阶
}

message battle_common {
  optional            uint32                  rand_seed                = 1; // 随机种子
  optional            uint32                  param                    = 2; // stage为关卡stage_id, tower为floor_id
  repeated            battle_buff             self_buffs               = 3; // 己方buff, buff在各个功能模块可能读不通buff表
  repeated            battle_buff             oppo_buffs               = 4; // 敌方buff, buff在各个功能模块可能读不通buff表
  repeated            uint32                  self_troop_ids           = 5; // 己方troop_ids
  repeated            uint32                  oppo_troop_ids           = 6; // 地方troop_ids
  repeated            uint64                  param_list               = 7; // 存放一些param字段 activity_boss :[最强战力]
  optional            astrolabe               self_astrolabe           = 8;
  optional            astrolabe               oppo_astrolabe           = 9;
  repeated            relic_pic               self_relic_pics          = 10;
  repeated            relic_pic               oppo_relic_pics          = 11;
  optional            int32                   infl_weight              = 12 [ default = 0 ];
  optional            uint32                  lv_offset                = 13; // 关卡等级调整值，62版本新增。用于推关战斗
  repeated            int32                   infl_weight_list         = 14; // list for 12 多队战斗的一些兼容
  repeated            uint64                  self_params              = 15; // 一些额外的参数, rt_pvp 传入这个玩家所有拥有的卡的tid
  repeated            uint64                  oppo_params              = 16; // 同上
  optional            relic_core              self_relic_core          = 17;
  repeated            hero_stance             rt_self_heroes_list      = 18; // 己方待上阵英雄的tids, 暂时只有rt_pvp 用到, 需要纯拉平设计
  repeated            hero_stance             rt_oppo_heroes_list      = 19; // 同上
  map<uint32, uint32>                         self_infinite_inst_lvs   = 20; // 命运清单 <id, lv>
  repeated            team_buffs              team_buffs               = 21;
  map<uint64, uint64>                         hid_shield               = 22; // 溢出治疗量形成的护盾<hid, 溢出的万分比>
  repeated            infinite_amulet         self_infinite_amulets    = 23; // rog信物
  optional            t_ai_type               normal_ai                = 25; // 是否为ai战斗
  optional            uint64                  self_pet_book_lv         = 26; // 己方宠物百科全书等级
  optional            uint64                  oppo_pet_book_lv         = 27; // 敌方宠物百科全书等级
  optional            uint64                  season_id                = 28;
  repeated            uint64                  self_effect_ids          = 29; // 己方effect
  repeated            uint64                  oppo_effect_ids          = 30; // 敌方effect
  repeated            hero_extra              hero_extras              = 31; //英雄特别参数(内部参数与英雄对应)
  optional            uint64                  version_id               = 32; //war的versionID
  repeated            bag_hero_entry          self_bag_hero_list       = 33; // 己方背包英雄列表（各TID当前最高品阶）
  repeated            bag_hero_entry          oppo_bag_hero_list       = 34; // 敌方背包英雄列表
  optional            uint64                  self_gs_guild_tech_exp   = 35; // 己方影响战力的公会科技经验
  optional            uint64                  oppo_gs_guild_tech_exp   = 36; // 敌方影响战力的公会科技经验
}

// 英雄特别参数
message hero_extra {
  required uint64 hero_id        = 1; //英雄id
  repeated uint32 monster_equips = 2; //怪物装备(2025周年庆)
}


enum t_ai_type {
  ai   = 1;
}

// todo: rog6期新增结构
message infinite_amulet {
  required            uint64  amulet_id   = 1;
  required            uint64  lv          = 2;
  map<uint64, uint64>         term_map    = 3; // key: index value:词条id
}

message team_buffs {
  required uint64  team_id   = 1;
  repeated uint64  buffs     = 2;
}

message hero_stance {
  required uint32  tid      = 1;
  required uint32  slotId   = 2;
}

message rt_battle_heroes {
  required t_rt_hero_appear  appear_type    = 1;
  repeated hero_stance       hero_stances   = 2;
}

message battle_buff {
  required uint32         buff_id   = 1; // 对应skill表的skill_id,表中caster_id是战斗策划通过战斗类型对应出来的,所以服务器只需要发skill_id即可
  repeated uint32         params    = 2;
  optional t_battle_buff  type      = 3 [ default = buff ];
}

message battle_input {
  repeated battle_team   self_teams   = 1; // 己方多队多人阵容，1v1模块为单队多人阵容
  repeated battle_team   oppo_teams   = 2; // 敌方多队多人阵容，1v1模块为单队多人阵容，PVE一般为空列表
  repeated round_op      round_ops    = 3; // 每一局的操作序列
  optional uint64        start_ts     = 4; // 开始时间
  optional uint64        end_ts       = 5; // 结束时间
  repeated battle_stats  stats_list   = 6; // 额外请求战斗校验返回的参数
}

message round_op {
  map<uint32, battle_ops>   operations   = 1; // <tick, battle_ops>, 英雄每一局的操作序列
}

message battle_output {
  repeated battle_round   rounds        = 1; // 一场比赛多局信息
  optional uint64         battle_time   = 2; // 战斗时长
  repeated battle_stats   stats_list    = 3; // 额外请求战斗校验返回的参数
  repeated war_voke_log   self_logs     = 4; // slg职业战报
  repeated war_voke_log   oppo_logs     = 5; // slg职业战报
}

// 异域夺金
message war_voke_log {
  optional uint64 voke        = 1; // 触发者职业
  optional bool   is_trigger  = 2; // 是不是触发者
  repeated uint64 params      = 3; // 日志参数
}

message battle_team {
  repeated              slot_hero     slot_heroes             = 1; // 按格子位置放置的英雄
  map<uint64, hero_dyn>               dyns                    = 2; // 开场时候英雄血，蓝等信息
  map<uint64, uint64>                 hid2uids                = 3; // 借兵系统hid:uid
  repeated              user_summary  friend_summaries        = 4; // 佣兵相关好友信息
  repeated              uint32        selected_golden_slots   = 5; // 生效golden英雄特殊技能的位置 暂时每一队只有一个位置生效，即只可能为[]或者[uint32]
  repeated              pet           pets                    = 6; // 宠物
  optional              uint64        morale                  = 7; // 士气
  optional              uint64        team_id                 = 8; // 队伍id
  repeated              uint64        effect_ids              = 9; // 队伍的effectIDs
  optional              uint64        army                    = 10; // 兵力
}

message battle_ops{
  repeated uint64  ops   = 1; // 英雄操作序列
}

enum t_battle_defeat {
  normal    = 1;
  timeout   = 2;
}

message battle_round {
  required    uint64                      round            = 1 [ default = 1 ]; // 第N局ID
  required    t_battle_result             result           = 2; // 第N局结果
  optional    battle_team                 self_team        = 3; // 己方队伍
  optional    battle_team                 oppo_team        = 4; // 敌方队伍
  optional    round_op                    round_op         = 5; // 一局比赛的操作序列
  map<uint64, hero_stat>                  self_stats       = 6; // 离场时己方血，蓝数据
  map<uint64, hero_stat>                  oppo_stats       = 7; // 离场时敌方血，蓝数据
  map<uint64, pet_stat>                   self_pet_stats   = 8; // 离场时己方宠物造成伤害和治疗
  map<uint64, pet_stat>                   oppo_pet_stats   = 9; // 离场时地方宠物造成伤害和治疗
  optional    uint64                      oppo_team_id     = 10; // 敌方队伍id,用于获取额外的战斗配置
  optional    uint64                      self_team_id     = 11; // 己方队伍id,用于记录车轮战对应关系
  optional    t_battle_defeat             defeat_reason    = 12; // 战斗失败的原因 比如超时
  optional    uint64                      self_morale      = 13[default = 0]; // 己方士气
  optional    uint64                      oppo_morale      = 14[default = 0]; // 敌方士气
  repeated    battle_task                 self_battle_task = 15;
  repeated    battle_task                 oppo_battle_task = 16;
  optional    uint64                      self_army        = 17[default = 0]; // 己方兵力
  optional    uint64                      oppo_army        = 18[default = 0]; // 敌方兵力
}

message battle_task {
  required uint64  task_id       = 1;
  optional uint64  progress      = 2;
  optional bool    is_finished   = 3[default = false];
}

message battle_stats {
  required uint64  id       = 1;
  optional uint64  value    = 2;
  optional uint64  round    = 3;
  optional bool    result   = 4;
}

// 战斗开始动态信息
message hero_dyn {
  required uint64  hp_pct   = 1;
  required uint64  mp_pct   = 2;
  optional uint64  param    = 3;
  repeated uint64  params   = 4; // require by jiaruo 由于boss支线上面的param不够用了，加了一个params数组
}
// 战斗结束剩余统计信息
message hero_stat{
  required uint64  hp_pct   = 1;
  required uint64  mp_pct   = 2;
  required uint32  param    = 3; // 比如骷髅王复活状态
  required uint64  damage   = 4;
  required uint64  kill     = 5;
  required uint64  heal     = 6; // 治疗
  required uint64  defend   = 7; // 防御
}

message pet_stat {
  required uint64  damage   = 1;
  required uint64  heal     = 2; // 治疗
}

message battle_record {
  required uint64               battle_id       = 1; // 战斗唯一ID
  required battle               battle          = 2; // 战斗结构体
  required t_battle_result      battle_result   = 3; // 战斗结果
  optional string               cli_ver         = 4; // 战斗校验版本号, 竞技场等该字段可能为空
  optional string               bt_svr_ver      = 5; // 战斗校验版本号
  optional user_summary         self_summary    = 6; // 己方user_summary
  optional user_summary         oppo_summary    = 7; // 对方user_summary
  optional battle_record_param  param           = 8; // 战斗录像需要的额外参数，比如公会boss伤害奖励
  optional uint64               create_ts       = 9 [ default = 0 ]; // 战报生成时间
  optional bool                 is_retained     = 10 [ default = false ]; // 跨版本是否保留
  optional string               hbase_family    = 11 [ default = "t" ]; // "t" 保存30天 "k"一年 "m3"一百天
}

message battle_record_param {
  optional activity_boss_reward  activity_boss_reward   = 1;
  repeated uint64                params                 = 2; // 战斗录像需要展示的额外数据 竞速梦境：单队伤害
  optional t_battle_record_from  record_from            = 3; // 战斗录像来源
}

enum t_battle_record_from {
  ai_copy   = 1; // ai抄作业，告诉客户端需要对战斗录像进行扰动
}

message quest {
  required                  uint32  id             = 1;
  required                  uint64  expire_ts      = 2; // 任务被刷掉的时间
  optional                  uint64  start_ts       = 3;
  repeated                  hero    self_heroes    = 4;
  repeated                  asset   assets         = 5; // 任务的奖励
  map<uint32, hero_summary>         assit_heroes   = 6;
  optional                  bool    is_sub         = 7 [ default = false ]; // 是否是订阅刷新的
  optional                  bool    is_double      = 8 [ default = false ]; // 是否被翻倍过
}

message sub {
  required t_os            t_os             = 1 [ default = ios ];
  required uint32          good_id          = 2 [ default = 0 ];
  required uint64          expire_ts        = 3 [ default = 0 ];
  required bool            is_opened        = 4 [ default = false ]; // 功能首次开启需要红点通知
  optional t_sub_reminder  t_sub_reminder   = 5;
}

enum t_idle_type {
  stage        = 1; // 推关挂机
  deep_stage   = 2; // 困难推关挂机
}

message idle {
  required t_idle_type     type            = 1; // 挂机类型
  required uint64          calc_ts         = 2; // 上次计算的时间
  repeated uint32          left_secs       = 3; // 上次计算各个奖励结余的时间 现在 currency 和chest 使用统一逻辑
  required uint64          end_ts          = 4; // 结束时间
  repeated asset           assets          = 5; // 金币;经验;英雄经验;宝箱(实际上道具+装备)
  required uint64          start_ts        = 6; // 开始的时间
  repeated asset           card_assets     = 7; // 月卡加成，客户端需要单独显示
  required starland_idle   starland_idle   = 8; // 群星之幕加成
  optional guild_skin_idle guild_skin_idle = 9; // 公会装扮加成，不存在表示旧存档未生成过
  optional guild_tech_idle guild_tech_idle = 10; // 公会科技树加成
}

message starland_idle {
  repeated asset       assets        = 1;
  repeated left_asset  left_assets   = 2;
}

message guild_skin_idle {
  repeated asset       assets        = 1;
  repeated left_asset  left_assets   = 2;
}

message guild_tech_idle {
    repeated asset       assets        = 1;
    repeated left_asset  left_assets   = 2;
}

//universal configured structure
message ucs {
  optional uint64     int_val       = 1;
  optional string     string_val    = 2;
  repeated slot_hero  slot_heroes   = 3;
  optional reward     reward        = 4;
}

//英雄格子
message grid {
  required uint32  grid_buy   = 1 [ default = 0 ]; // 购买的格子 英雄真是的格子包含基础格子+vip格子+购买的格子
}

message shop {
  required            uint32     id                  = 1;
  required            uint32     level               = 2; // 商店等级
  repeated            sell_good  sell_goods          = 3;
  required            cd         cd                  = 4; // 商店主动刷新cd
  required            uint32     refresh_times       = 5;
  map<uint32, uint32>            purchase_his        = 6; // 限购项的已购买次数，每月重置,用于限购项到达限制后替换货物
  optional            cd         purchase_limit_cd   = 7; // 限购cd
  optional            uint64     end_ts              = 8; // 关闭时间，水晶商店有关闭倒计时
}

enum t_cell {
  normal              = 1;
  elite               = 2;
  hot_spring          = 3;
  boss                = 4;
  empty               = 5;
  start               = 6;
  mystic              = 7;
  peddler             = 8;
  thief               = 9;
  carriage            = 10;
  goblin              = 11;
  bloody_carriage     = 12;
  deep_normal         = 13;
  deep_elite          = 14;
  deep_guard_low      = 15;
  deep_guard_medium   = 16;
  deep_boss           = 17;
  deep_spring         = 18;
  deep_witch          = 19;
  deep_elite_double   = 20;
  deep_goblin         = 21;
}

enum s_cell {
  not_yet   = 1;
  passed    = 2;
}

message heirloom_param {
  required uint32  heirloom   = 1;
  repeated uint32  params     = 2;
}

message maze {
  required              uint64            uid                               = 1;
  required              uint32            id                                = 2 [ default = 1 ];
  required              uint32            floor_id                          = 3 [ default = 1 ];
  required              uint32            cell_id                           = 4 [ default = 1 ];
  required              uint64            gs                                = 5 [ default = 0 ]; // 迷宫开启时历史最高战力
  repeated              cell              cells                             = 6;
  map<uint64, hero_dyn>                   dyns                              = 7; // <HeroID, HeroDyn>
  repeated              uint32            heirlooms                         = 8; // 本次不可使用的遗物 + 已经选择过的遗物
  repeated              uint32            path                              = 9; // 走过的cell_id, 不包含当前cell_id
  required              uint64            end_time                          = 10 [ default = 0 ]; // 迷宫结束时间
  repeated              hero              assist_heroes                     = 11; // 拥有的助战英雄
  optional              uint32            counter                           = 12 [ default = 0 ]; // 迷宫计数器，第几次迷宫
  repeated              heirloom_param    heirloom_params                   = 13; // 遗物
  required              uint32            map_id                            = 14 [ default = 1 ]; // map_id
  optional              uint32            tear_times                        = 15 [ default = 0 ];
  optional              t_maze_type       type                              = 16 [ default = normal ]; // 迷宫模式
  optional              double            reward_ratio                      = 17 [ default = 1.0 ]; // 奖励倍率
  optional              uint32            missed_times                      = 18 [ default = 0 ]; // 错过次数
  optional              bool              is_deep_open                      = 19 [ default = false ]; // 本次迷宫,是否满足深渊开启条件
  optional              uint32            roll_times                        = 20 [ default = 0 ]; // 深渊重roll敌方阵容的次数(废弃)
  optional              uint32            triggered_id                      = 21 [ default = 0 ]; // 最后一次触发过冲动礼包的maze_big_season
  repeated              uint32            offset_ids                        = 22; // 深渊减buff券抵消掉的 debuff_id
  optional              uint32            ticket_times                      = 23 [ default = 0 ]; // 深渊减buff券使用次数
  optional              uint32            battle_victory_times              = 24 [ default = 0 ]; // 战斗胜利次数
  optional              uint32            multi_team_battle_victory_times   = 25 [ default = 0 ]; // 多队战斗胜利次数
  optional              uint64            team_id                           = 26; // 深渊迷宫队伍id
  map<uint64, uint64>                     recvd_invites                     = 27; // 收到的组队邀请<team_id, uid>,有上限
  repeated              uint64            apply_team_ids                    = 28; // 申请过的队伍ID,有上限
  repeated              maze_path_record  maze_path_records                 = 29; // 有小队情况下记录每一层通关所经过的cell
  repeated              uint64            recent_pass_ts                    = 30; // 记录近期通关的时间点(eg:近30天通关多少次)
  optional              uint64            expire_ts                         = 31; // 以活动形式开启组队，记录本次活动结束时间，用于清理队伍信息
  optional              maze_qk_chlg      qk_chlg                           = 32; // v99快速挑战，默认undefined，快速挑战时初始化数据
}

message maze_qk_chlg {
  optional shop                   shop             = 1; // 旅行商人
  optional bool                   buy              = 2 [ default = false ]; // 旅行商人是否已买完
  repeated maze_qk_chlg_heirloom  heirlooms        = 3; // 遗物
  required uint32                 heirloom_index   = 4 [ default = 0 ]; // 当前选到第几个遗物
}

message maze_qk_chlg_heirloom {
  required uint32  index             = 1; // 索引,从0开始
  repeated uint32  heirlooms         = 2; // 每次三选1
  optional uint32  select_heirloom   = 3; // 选中的遗物
}

message team_hero_summary {
  required uint64        owner_uid   = 1;
  required hero_summary  hero        = 2;
}

message team_hero {
  required uint64  owner_uid   = 1;
  required hero    hero        = 2;
}

message maze_path_record {
  required            uint32  floor_id     = 1; // 层数
  map<string, uint32>         pass_cells   = 2; // 通关的格子<cell_type,num> 因map不支持枚举为key,所以type需转换为string
}

message cell {
  required uint32      id                 = 1;
  required t_cell      type               = 2;
  required s_cell      status             = 3 [ default = not_yet ];
  repeated asset       assets             = 4;
  optional shop        shop               = 5; // 旅行商人
  repeated uint32      heirloom_pool      = 6; // 可选 heirloom,选择遗物后将被清空
  repeated uint32      picked_heirlooms   = 7; // 已选择的遗物
  repeated hero        assist_heroes      = 8; // 可选择的助战英雄
  optional bool        special_reward     = 9 [ default = false ]; // 战斗special_reward待领取
  repeated uint64      tired_heroes       = 10; // 已经使用过的英雄
  repeated maze_enemy  enemies            = 11; // 多队敌人
}

message maze_enemy {
  optional              uint32     enemy_id      = 1;
  repeated              slot_hero  oppo_heroes   = 2;
  map<uint64, hero_dyn>            oppo_dyns     = 3; // <HeroID, HeroDyn>
  optional              bool       defeated      = 4 [ default = false ];
}

message monthly_card {
  required uint32  goods_id           = 1;
  required uint32  left_count         = 2;
  required uint64  last_reward_time   = 3 [ default = 0 ];
}

message charge_fund{
  required uint32  goods_id     = 1;
  required bool    is_buy       = 2 [ default = false ];
  optional uint64  expire_ts    = 3;
  repeated uint32  recved_his   = 4;
}

enum t_charge_gift {
