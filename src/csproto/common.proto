  optional uint64               id             = 2; // id
  optional uint64               total_cnt      = 3 [ default = 0 ]; // 排行榜总人数
  optional uint64               num_max        = 4 [ default = 0 ]; // num最大值
  optional uint64               self_rank      = 5 [ default = 0 ]; // 玩家当前排名
  optional uint64               self_score     = 6 [ default = 0 ]; // 玩家当前分数
  repeated single_rank_section  sections       = 7; // 各挡位的排名和分数
  optional single_rank_section  next_section   = 8; // 下一个目标(玩家是第一名的话，这个字段没有; 玩家在最高档的话返回排行榜前一名; 其他情况返回上一档)
