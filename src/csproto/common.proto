  repeated asset          assets       = 6; // 助战的结算奖励
  optional uint64         stage_id     = 7;
  optional uint64         season_id    = 8;
  optional uint64         old_damage   = 9;
  optional uint64         new_damage   = 10;
}

enum t_assist_team {
