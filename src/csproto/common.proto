  optional uint64               self_score             = 2 [ default = 0 ]; // 玩家当前分数
  optional uint64               next_section_rank      = 3; // 玩家是第一名的话，这个字段没有
  optional uint64               next_section_score     = 4; // 玩家是第一名的话，这个字段没有
}

// 通用排行榜下一档伤害。用于单一排行榜，不支持xx段位
