enum t_war_city {
  born      = 1; // 出生州
  resource  = 2; // 资源州
  core      = 3; // 核心州
}
// 大地图阶段
enum t_war_map_phase {
  signup        = 1; // 报名
  matching      = 2; // 分配阵营中
  match         = 3; // 分配阵营完成
  newbie_war    = 4; // 新手战斗
  born_war      = 5; // 出身州战斗
  resource_war  = 6; // 资源州战斗
  core_war      = 7; // 核心州战斗
  settling      = 8; // 赛季结算中
  settle        = 9; // 结算完成
  show          = 10; // 展示期
  over          = 11; // 赛季结束
}

// 每日拆分为多个阶段
enum t_war_day_phase {
  assemble        = 1; // 集结
  proclaim        = 2; // 宣战
  battle          = 3; // 攻城
  settle_prepare  = 4; // 结算中
  settle          = 5; // 结算完成
  vanguard        = 6; // 先锋战
}
// 城池状态
enum t_war_city_status {
  normal  = 1;  // 正常阶段
  besiege = 2;  // 围攻阶段
}
// 任务类型
enum t_war_task_type {
  normal                     = 1;
  tech                       = 2;
  final_settle_reward        = 3;
  newbie_settle_reward       = 4;
  born_war_settle_reward     = 5;
  resource_war_settle_reward = 6;
}

// 异域夺金 同盟
message war_ally_summary {
  required uint64              id              = 1;
  optional string              name            = 2;
  optional uint64              avatar          = 3;  // 联盟头像图案
  optional uint64              avatar_bg       = 4;  // 联盟头像背景
  optional t_war_ally_join     join_type       = 6;
  optional uint64              required_pg_lv  = 7;  // 要求等级
  optional uint64              level           = 8;  // 等级
  optional uint64              ally_gs         = 9;  // 同盟战力
  optional uint64              members_cnt     = 10; // 同盟人数
  optional uint64              capital         = 11; // 首都
  optional uint64              born_city_tid   = 12; // 出生城
  optional uint64              color_id        = 13; // 赤橙黄绿青蓝紫
  optional uint64              point           = 14; // 积分
  optional uint64              point_rank      = 15; // 积分排名
  optional guild_summary       guild_summary   = 16; // 掌旗公会信息
}
// 异域夺金
message war_ally_arms_build {
  required uint64               invest_count      = 1; // 军备筹备数量(下注的数量)
  optional uint64               be_pillage_count  = 2[default = 0]; // 被劫掠的军备数量
  optional uint64               create_ts         = 3; //生产开始时间
  optional bool                 is_settle         = 4[default = false]; // 是否已经结算
}

// 异域夺金 昨日的军备历史信息
message war_ally_arms_log {
  required uint64               arms_count       = 1; // 昨日的军备筹备数量
  required uint64               pillage_count    = 2; // 昨日的劫掠数量
  repeated war_ally_pillage_log be_pillage_logs  = 3; // 昨日的被劫掠的战斗记录
}

// 异域夺金
message war_ally_pillage_log {
  required uint64           uid         = 1; // 劫掠者ID
  required uint64           ts          = 2; // 劫掠时间
  required uint64           count       = 3; // 劫掠损失数量
  required uint64           battle_id   = 4; // 战斗ID
  optional t_battle_result  result      = 5;
  optional uint64           ally_id     = 6; // 劫掠者同盟ID
  optional uint64           pillage_cnt = 7; // 对方实际劫掠获得数量
}

// 异域夺金
message war_besiege_medal {
  required uint64                     tid                     = 1; //勋章TID
  required uint64                     troop_id                = 2; //完成的部队ID
  optional uint64                     value                   = 3; //保存的进度值
  optional bool                       finished                = 4[default = false];
  repeated uint64                     bt_ids                  = 5; // 战斗录像id
  optional uint64                     city_tid                = 6; // 城池tid
}

// 异域夺金 围攻场景的天气效果
message war_besiege_weather_effect {
  optional t_war_weather_effect       weather_effect          = 1; //天气效果
  repeated uint64                     attacker_line_ids       = 2; //进攻方受影响的战线IDs
  repeated uint64                     defender_line_ids       = 3; //防守方受影响的战线IDs
}

// 异域夺金 前线信息
message war_besiege_battle_front {
  required uint64                     line_id                 = 1; // 战线的ID
  optional war_besiege_block          attacker_block          = 2; // 进攻方格子信息
  optional war_besiege_block          defender_block          = 3; // 防守方格子信息
}

// 异域夺金
message war_besiege_block {
  required uint64  block_id         = 1;
  optional uint64  hp               = 2[default = 0];
}

enum t_besiege_troop_action {
  move    = 1;
  match   = 2;
  battle  = 3;
  retreat = 4;
}

// 异域夺金 围攻的行军单位（发射出去的单位）
message war_besiege_troop_march {
  required uint64                     id              = 1; // 部队ID
  required t_besiege_camp             camp            = 2; // 是攻击方还是防守方
  optional t_besiege_troop_action     action          = 3; // 部队行动指令
  optional uint64                     oppo            = 4; // 对手的部队ID 战斗阶段对手（每值表示打地块）
  optional uint64                     target_block_id = 5; // 行动的目标点
  optional uint64                     start_ts        = 6; // 行动开始时间
  optional uint64                     end_ts          = 7; // 行动结束时间
  repeated uint64                     triggered_eids  = 8; // 已经触发的且不可重复触发的effect_id列表
  optional uint64                     create_ts       = 9; // 发射时间：从营地出来的时间
}

// 异域夺金
message war_besiege_event {
  required uint64                     cfg_id            = 1; //事件的配置表ID
  optional uint64                     uid               = 2; //玩家ID（可选）
  optional uint64                     ts                = 3; //时间
  repeated ucs                        params            = 4; //参数
  optional t_besiege_camp             camp              = 5; //阵营（空值表示不限制阵营显示）
}
// 异域夺金
message war_besiege_params {
  required uint64                 season_id       = 1; // 赛季ID
  optional uint64                 weather_tid     = 2; // 天气
  repeated t_war_weather_effect   weather_effects = 3; // 天气效果
  required uint64                 svr_id          = 4; // war_map 上的 svr_id
  optional t_war_map_phase        phase           = 5; // 阶段
  optional uint64                 map_id          = 6; // 地图ID
  optional bool                   is_army_active  = 7 [default = false]; // 兵力系统是否开启
}

enum t_besiege_camp {
  attacker = 1;  // 进攻方
  defender = 2;  // 守城方
}

// 异域夺金 玩法内的部队信息
message war_besiege_troop {
  required uint64                       id                      = 1; //部队ID（唯一ID）
  optional uint64                       uid                     = 2; //玩家UID（空值表示NPC）
  optional uint64                       troop_id                = 3; //玩家TroopID(类似TeamID）
  required t_besiege_camp               camp                    = 4; //是攻击方还是防守方
  repeated slot_hero                    heroes                  = 5; //英雄的快照信息
  repeated pet                          pets                    = 6; //上阵的宠物信息
  map<uint64, hero_dyn>                 hero_dyns               = 7; //剩余血量
  optional uint64                       morale                  = 8[ default = 0]; //士气
  repeated uint64                       selected_golden_slots   = 9; // 选择生效的golden英雄技能，默认为[] 不选择
  optional uint64                       cur_wins                = 10 [default = 0]; //当前胜利数
  repeated uint64                       cur_battle_ids          = 11; //当前行军发生的战斗ID列表
  optional uint64                       max_consec_wins         = 12 [default = 0]; //最大连续胜利数量
  optional uint64                       total_wins              = 13 [default = 0]; //总胜利数
  optional uint64                       total_battle_cnt        = 14 [default = 0]; //总战斗次数
  optional uint64                       active_ts               = 15; //部队可用的时间(调兵）
  optional uint64                       battle_ts               = 16; //最近的战斗时间
  optional uint64                       effect_id               = 17; //效果ID
  optional uint64                       effect_ts               = 18; //效果结束时间
  repeated uint64                       tech_effect_ids         = 19; //科技效果ID
  optional bool                         is_enable               = 20 [default = true]; //是否启用(调兵后数据不删除）
  optional uint64                       recover_count           = 21 [default = 0]; //已经复活的次数
  optional uint64                       recover_limit           = 22; //复活的限制次数（空表示不限制 0表示无法复活了）
  optional uint64                       voke                    = 23; // 职业
  optional uint64                       contribution            = 24 [default = 0]; // 贡献度
  optional uint64                       kill_army               = 25 [default = 0]; // 杀了多少兵力
  optional uint64                       army                    = 26 [default = 0]; // 当前兵力
  optional uint64                       army_bar                = 27 [default = 0]; // 兵力包：由兵力槽初始化，用完后自动从背包补充。战斗结束后放回兵力槽
  optional bool                         is_auto_army            = 28 [default = false]; // 是否自动补兵
  optional uint64                       init_army               = 29 [default = 0]; // 历史总投入兵力(含自动补兵数量)
}

// 异域夺金 等待出征的部队信息(预备役)
message war_besiege_troop_reservist {
  required uint64                     id                     = 1; //部队ID
  required t_besiege_camp             camp                   = 2; //是攻击方还是防守方
  optional uint64                     ready_ts               = 3[default = 0]; //可以出战的时间戳
  optional uint64                     retreat_line_id        = 4; //从哪个战线撤回来的
  optional uint64                     init_ts                = 5; //进入营地的时间戳
}

// 异域夺金 当前视野中心点
message war_country_viewport {
  required uint64 position_x    = 1; // 视野中心点x坐标
  required uint64 position_y    = 2; // 视野中心点y坐标
  required uint32 level         = 3; // 缩放等级
}

// 部队行为
enum t_war_troop_action {
  normal           = 1; // 正常：驻守在某个城
  succor           = 2; // 援助到城池防守
  attack           = 3; // 攻城
  succor_attack    = 4; // 援助攻城
  retreat          = 5; // 撤退
  defeated         = 6; // 败归：防守失败、进攻失败
  triumph          = 7; // 凯旋
  cancel_assemble  = 8; // 取消集结
  succor_same_city = 9; // 同城调兵防守
}

// 异域夺金 玩家部队
message war_troop {
  required uint64   id      		= 1; // 部队id
  optional uint64   avatar  		= 2; // 队伍头像，一般是第一个英雄
  required lineup   lineup  		= 3; // 阵容
  repeated uint64   effect_id_list  = 4; // 队伍效果列表
  optional uint64   team_race_tid 	= 5; // 队伍种族配置id(购买队伍的专属字段)
  optional uint64   army            = 6 [default = 0]; // 当前队伍兵力
  optional bool     is_auto_army    = 7 [default = false]; // 是否自动补兵
  optional uint64   auto_fill_army  = 8 [default = 0]; // 当天已自动补兵数量
}

// 异域夺金
message war_troop_extra {
  required uint32         troop_id    = 1;
  optional uint32         race_tid    = 2; // 已购买的种族
  repeated war_troop_cost troop_costs = 3; // 兵粮费用
}

// 异域夺金
message war_troop_cost {
  required uint64 proclaim_day_id = 1; // 轮次id
  optional cost   cost            = 2; // 兵粮费用
}

// 地图事件类型
enum t_war_event_type {
  proclaim         = 1;  // 宣战：展示攻城车
  succor_car       = 2;  // 战中调度小车
  user_move        = 3;  // t_war_troop_action.normal
  assemble         = 4;  // t_war_troop_action.attack
  succor           = 5;  // t_war_troop_action.succor
  succor_attack    = 6;  // t_war_troop_action.succor_attack
  retreat          = 7;  // t_war_troop_action.retreat
  defeated         = 8;  // t_war_troop_action.defeated
  triumph          = 9;  // t_war_troop_action.triumph
  farmland         = 10; // 打田地
  cancel_assemble  = 11; // 取消集结
  succor_same_city = 12; // t_war_troop_action.succor_same_city
  duel             = 13; // 宣战：决斗战
}
// 异域夺金 地图事件
message war_map_event {
  required uint64                 id              = 1; // 事件id
  required t_war_event_type       type            = 2; // 事件类型
  optional uint64                 uid             = 3; // 发起人。攻城车的话没有uid
  optional uint64                 ally_id         = 4; // 发起人同盟
  required uint64                 start_ts        = 5; // 事件开始时间
  required uint64                 end_ts          = 6; // 事件结束时间
  required uint64                 start_city_tid  = 7; // 出发城池
  required uint64                 target_city_tid = 8; // 目标城池
  repeated uint64                 path            = 9; // 路径(含出发、目的地)
  optional war_map_event_params   params          = 10; // 参数：调动部队有部队id，打资源地块有地块相关信息
  optional war_map_event_farmland farmland        = 11; // 打田地专有参数
}

// 异域夺金
message war_map_event_params {
  optional uint64       troop_id        = 1; // 调动的部队、集结
  optional uint64       troop_avatar    = 2; // 队伍头像（第一个英雄的TID）
  optional uint64       proclaim_gs     = 3; // 攻城车总战力
  optional uint64       troop_amount    = 4; // 攻城车队伍总数
  optional uint64       troop_gs        = 5; // 队伍战力
  repeated uint32       effect_id_list  = 6; // 队伍特殊效果
  optional war_duel     duel            = 7; // 决斗战5辆战车（变动时大地图同步）
  optional uint64       army            = 8; // 兵力
}
// 异域夺金 打田事件专有参数
message war_map_event_farmland {
  repeated uint64kv troops        = 1; // 队伍列表: troop_id -> troop_avatar
  optional uint64   target        = 2; // 目标田地
  optional uint64   lose          = 3; // 田地满的话需要替换的田地
  optional t_battle_result result = 4; // 战斗结果
}
// 异域夺金 城市留言
message war_city_message {
  required uint64 city_tid  = 1; // 城池
  required uint64 ts        = 2; // 时间
  required string content   = 3;
}

// 异域夺金
message war_task {
  required uint64  tid                = 1; // 任务id
  required uint64  progress           = 2 [ default = 0 ]; // 任务进度
  optional uint64  last_reward_ts     = 3; // 领取任务奖励的时间
}

// 异域夺金
message war_ally_task {
  required uint64 tid       = 1; // 任务id
  required uint64 progress  = 2 [ default = 0 ]; // 进度
  optional uint64 finish_ts = 3; // 完成该任务的时间戳
  optional uint64 sent_ts   = 4; // 发奖给联盟成员的时间戳
}

// 异域夺金
message war_todo_chest {
  required t_war_task_type  type    = 1; // 类型
  required uint64           point   = 2 [default = 0]; // 当前点数
  repeated uint64           recved  = 3; // 已领取的id
}

// 异域夺金
message war_map_farmland {
  required uint64 tid             = 1; // csv_war_map_farmland id
  required uint64 own_ts          = 2; // 占有时间
  required uint64 last_settle_ts  = 3; // 上一次结算时间
}

// 异域夺金 小队战绩
message war_troop_record {
  required uint64 troop_id          = 1;
  required uint64 bt_cnt            = 2[default = 0];
  required uint64 win_cnt           = 3[default = 0];
  repeated uint64 city_tids         = 4; // 在哪些城市战斗过
  optional uint64 max_consec_wins   = 5[default = 0]; // 最大连胜数
  optional uint64 init_ts           = 6[default = 0]; // 初始化时间
  repeated uint64 besiege_ids       = 7; // 在哪些围攻战出现过
  map<uint64, uint64> medal_tid2cnt = 8; // 勋章数据，WarBesiegeMedal.csv 的主键 -> 数量
  optional uint64 contribution      = 9[default = 0]; // 贡献度
  repeated war_besiege_medal medals = 10; // 勋章数据
  optional uint64 kill_army         = 11[default = 0]; // 杀兵力数量
}

// 异域夺金 小队高光时刻
message war_troop_hgl {
  required uint64 tid         = 1; // 徽章数据，WarBesiegeMedal.csv 的主键
  required uint64 troop_id    = 2; // 小队
  required uint64 trigger_ts  = 3; // 触发时间
  repeated uint64 bt_ids      = 4; // 战斗录像id
  repeated uint64 params      = 5; // 额外参数
}

// 异域夺金
message war_utech {
  required uint64 tid      = 1;
  required bool   recvd    = 2[default = false]; // 奖励领取状态
  required bool   unlocked = 3[default = false]; // 已解锁
}

//======================================================================
// war 天气相关
//======================================================================
enum t_war_weather_effect {
  muddy   = 1; // 泥泞
  flood   = 2; // 洪水
  mist    = 3; // 薄雾,可以偷菜
  rainbow = 4; // 彩虹,可以领奖
}
enum t_war_steal_level {
  small = 1; // 简单
  mid   = 2; // 普通
  big   = 3; // 困难
}

// 异域夺金
message war_weather {
  required uint64             tid       = 1; // 天气id WarWeather.csv
  required uint64             start_ts  = 2;
  repeated war_weather_effect effects   = 3; // 效果列表
}

// 异域夺金
message war_weather_effect {
  required t_war_weather_effect effect    = 1; // 效果
  repeated uint64               city_ids  = 2; // 生效的城市
}

// 异域夺金
message war_map_weather {
  optional war_weather cur  = 1; // 当前天气
  optional war_weather next = 2; // 下一个天气(提前算好)
  repeated war_weather hiss = 3; // 历史天气
}

// 异域夺金
message uwar_weather {
  optional uwar_weather_rainbow rainbow = 1; // 彩虹
  optional uwar_weather_mist    mist    = 2; // 薄雾
}

// 异域夺金
message uwar_weather_rainbow {
  optional uint64 appear_ts   = 1; // 天气出现时间
  optional uint64 recvd_ts    = 2; // 上次领取彩虹奖励时间
}
// 异域夺金
message uwar_weather_mist {
  optional uint64           appear_ts       = 1; // 天气出现时间
  map<uint64, uint64>       steal_lv_events = 2; // 不同等级地块刷出来的事件tid
  repeated mist_steal_log   steal_logs      = 3; // 薄雾偷菜日志,已偷菜次数赛选下同一天的偷菜记录
}

// 薄雾偷菜日志
message mist_steal_log {
  required uint64             uid               = 1; // 玩家id
  required uint64             farmland_tid      = 2; // 田地id
  optional uint64             ally_id           = 3; // 偷菜玩家：田地归属的同盟id；城池日志：偷菜人所在的同盟id
  required uint64             steal_ts          = 4; // 偷菜时间
  required uint64             event_tid         = 5; // 事件ID
  required t_war_steal_level  level             = 6; // 事件难度
  required result             result            = 7; // 结果
  required uint64             reduce_durability = 8 [default = 0]; // 耐久度损失
}

// 异域夺金
message war_ally_proclaim {
  required uint64 cnt             = 1;
  required uint64 last_restore_ts = 2;
}

// 异域夺金 军情速报
message war_map_report {
  required uint64             day_id            = 1; // 自增
  repeated uint64kv           old_occupy_cities = 2; // 城池占领快照 city_tid -> ally_id
  repeated uint64kv           old_ally_capital  = 3; // 各同盟首都 ally_id -> capital
  repeated uint64kv           occupy_cities     = 4; // 城池占领快照 city_tid -> ally_id
  repeated uint64kv           ally_capital      = 5; // 各同盟首都 ally_id -> capital
  repeated war_besiege_report besiege_reports   = 6; // 各个战场的速报
}
// 异域夺金
message war_besiege_report {
  required uint64               city_tid      = 1;
  optional uint64               old_ally_id   = 2; // 开战前归属同盟，空或者0表示npc城
  optional uint64               new_ally_id   = 3; // 战斗后归属同盟，空或者0表示npc城
  required uint64               settle_ts     = 4; // 结算时间
  repeated war_ally_report      ally_reports  = 5; // 【普通围攻下发】参战各盟 mvp 数据
  repeated war_duel_battle_duel duels         = 6; // 【决斗战下发】结算信息列表
  repeated war_duel_ally_battle ally_battles  = 7; // 【决斗战下发】每一轮的参战同盟
}
// 异域夺金
message war_ally_report {
  required uint64                   ally_id       = 1;
  optional uint64                   troop_amount  = 2; // 队伍数量
  optional uint64kv                 consec_win    = 3; // 连胜mvp: uid -> amount
  optional uint64kv                 kill          = 4; // 击杀mvp: uid -> amount
  repeated war_besiege_commander    commanders    = 5; // 指挥时长最长的指挥官
  optional uint64                   bt_cnt        = 6; // 战斗场次
  optional uint64                   kill_army     = 7; // 联盟总消耗对手兵力
}

// 异域夺金
message war_besiege_commander {
  required uint64         uid                 = 1;
  optional uint64         card_use_times      = 2; // 使用卡牌次数
  optional uint64         trajectory_times    = 3; // 使用炮台卡次数
}

// 异域夺金 职业相关
message war_voke {
  optional uint64     tid       = 1; // 职业id WarVocation.csv
  optional uint64     begin_ts  = 2; // 开始时间,24小时后过期
}
// 异域夺金
message uwar_voke {
  optional war_voke   voke          = 1; // 当前职业
  repeated uint64     voke_tids     = 2; // 已刷出的职业列表
  optional uint64     refresh_ts    = 3; // 上次刷新时间
  optional uint64     refresh_times = 4; // 刷新次数
}

// 异域夺金 粮草
message uwar_food {
  required uint64 add_up    = 1[default = 0]; // 累积获得的数量
  optional uint64 settle_ts = 2; // 上一次结算时间
}
// 异域夺金 war挂机类产出：粮草、兵力
message uwar_idle {
  required uint64 id                = 1; // 活动道具ID
  required uint64 his_total         = 2[default = 0]; // 累积获得的数量
  optional uint64 recent_settle_ts  = 3; // 上一次结算时间
}

// 异域夺金
message war_signup {
  required uint64               season        = 1;
  optional uint64               signup_ts     = 2;
  optional bool                 is_guild      = 3[default=false];
  required bool                 is_bet        = 4[default=false]; // 是否押注
  optional uint64               recv_bet_uid  = 5; // 别人赠送的押注，记录对方UID
}

// 异域夺金 war 候选人
message war_candidates_info {
  required uint64       uid           = 1;
  required user_summary summary       = 2;
  repeated uint64       follower_uids = 3; // 追随者id列表
  optional string       declaration   = 4; // 宣言
  optional uint64       member_gs     = 5; // 成员战力
}

// 异域夺金
message war_permission {
  required t_war_permission_title title     = 1;
  required uint64                 perm_val  = 2[default = 0];  // 权限，编号对应策划配的表，1表示授权，0表示没授权
}

// 异域夺金 围攻控制权
message war_besiege_ally_control {
  required uint64               ally_id       = 1; //
  required uint64               control_uid   = 2; // 占用控制权的玩家uid
  required uint64               start_ts      = 3; // 控制权开始时间
  required uint64               last_alive_ts = 4; // 上次活动时间
  optional uint64               last_card_ts  = 5; // 上次使用卡牌时间
  repeated war_besiege_ask_help ask_helps     = 6; // 收到的求助信息
}
// 异域夺金
message war_besiege_ally_card {
  required uint64                       card_id       = 1 [default = 1]; // 当前卡id
  required uint64                       seed          = 2; // 随机种子
  repeated war_besiege_card             cards         = 3; // 当前所有卡，一次性的卡用完后会删除
  optional uint64                       next_card_ts  = 4; // 下张牌发放时间,牌满后置空
  optional uint64                       last_use_ts   = 5; // 上一次出牌时间
  optional uint64                       ask_help_ts   = 6; // 上一次求助时间
  repeated war_besiege_card             effect_cards  = 7; // 正生效的卡牌,用于判断当前有什么效果
  repeated war_besiege_ally_card_his    his           = 8; // 打出卡牌的记录
}
// 异域夺金
message war_besiege_ally_card_his {
  required uint64 card_tid  = 1;
  required uint64 uid       = 2;
}
// 异域夺金 围攻卡牌
message war_besiege_card {
  required uint64 id          = 1;
  required uint64 tid         = 2;
  optional uint64 last_use_ts = 3;
  repeated uint64 use_params  = 4;
}
// 异域夺金 围攻求助
message war_besiege_ask_help {
  required uint64 uid         = 1; // 求助者
  required uint64 ts          = 2; // 求助时间
  repeated uint64 params      = 3; // 参数: [besiege_id, scene_id]
}

message recvd_red_pocket {
  required war_red_pocket_key key = 1; // 红包key
  required uint64             ts  = 2; // 领取时间
}

// 异域夺金
message war_red_pocket_key {
  required uint64 uid     = 1;
  required uint64 tid     = 2; // 红包id
  required uint64 send_ts = 3; // 发红包的时间戳
  required uint64 ally_id = 4; // 发红包的时候所处联盟id
  required uint64 seq     = 5; // 红包序列号，处理策划配置 ASR WarRedPocket;TID;2的情况 - 同时发多个红包
  optional uint64 msg_id  = 6; // 消息id 如果im聊天调用接口失败，则是undefined
}

enum t_war_fun_type {
  add = 1;
  set = 2;
}

message ph_contrib_settle {
  required t_war_map_phase phase      = 1;
  required uint64          rank       = 2;
  required uint64          ph_contrib = 3;
}

enum t_war_battle_sequence {
  war_arms_attacker = 1; // 个人玩法进攻的顺序
  war_arms_defender = 2; // 个人玩法防守的顺序
}

// 异域夺金 控制车轮战的顺序
message war_battle_sequence {
  required t_war_battle_sequence  type              = 1; // 顺序的类型
  repeated uint64                 troop_ids         = 2; // 队伍的顺序
}

//============================================================
// War 地下城
//============================================================
// 异域夺金
message war_dungeon_troop {
  required uint64   troop_id            = 1; // 队伍id
  required uint64   act_point           = 2 [ default = 0 ]; // 体力
  required uint64   last_restore_time   = 3 [ default = 0 ]; // 上次恢复体力时间
  optional uint64   last_battle_ts      = 4 [ default = 0 ]; // 上一次成功击败Boss的时间,用于是否在探索
}
// 异域夺金
message war_dungeon_floor {
  required uint64                 tid       = 1; // war_dungeon_stage.csv floorID
  repeated war_dungeon_floor_boss bosses    = 2;
  optional uint64                 passed_ts = 3; // 通关时间
  optional uint64                 recvd_ts  = 4; // 领奖时间
}
// 异域夺金
message war_dungeon_floor_boss {
  required uint64     slot              = 1; // boss所在的slot
  optional uint64     passed_battle_id  = 2; // 通关时的战斗录像
  optional uint64     passed_ts         = 3; // 通关时间
  optional uint64     recvd_ts          = 4; // 领奖时间
  optional uint64     troop_id          = 5; // 击杀boss的队伍id. 结合 pass_ts 可以判断是否探索完毕
  map<uint64, uint64> passed_uids       = 6; // 大boss需要记录有那些人通关 uid -> passed_ts
}

//============================================================
// 决斗战
//============================================================
// 异域夺金
message war_duel {
  required uint64         ally_id         = 1;
  repeated war_duel_car   cars            = 2; // 攻下城的车
  repeated uint64         invite_fronts   = 3; // 车头邀请
  repeated uint64         apply_members   = 4; // 成员申请
  optional uint64         occupy_ts       = 5; // 首次占领城池时间,用于计算奖励
  required uint64         love_cnt        = 6 [default = 0]; // 点赞数
}
enum t_war_duel_front {
  allocate  = 1; // 默认分配
  invite    = 2; // 盟主邀请
}
// 异域夺金
message war_duel_car {
  required uint64           id          = 1; // 决斗车id(1~5)
  optional uint64           front       = 2; // 车头玩家uid
  optional t_war_duel_front front_type  = 3 [default = allocate]; // 车头玩家来源
  repeated uint64           deprecated_members     = 4; // 车尾成员 // 废弃
  optional uint64           army        = 5 [default = 0]; // 缴纳的门票：兵力
  map<uint64, uint64>       members     = 6;// 车尾成员 uid -> army 287NEW
}

// 异域夺金
message war_duel_reward {
  optional uint64 recv_duel_ts  = 1; // 上次领取决斗奖励时间戳
  optional uint64 recv_love_ts  = 2; // 上次领取点赞奖励时间戳
  repeated uint64 love_cities   = 3; // 当日点赞的城池列表
}

// 异域夺金 决斗战结果
message war_duel_battle {
  required uint64               city_id         = 1;
  optional uint64               defense_ally_id = 2; // 防守方同盟id
  optional uint64               win_ally_id     = 3; // 胜利方同盟id
  repeated uint64               attack_ally_ids = 4; // 进攻方同盟id列表
  optional uint64               end_ts          = 5; // 战斗结束时间
  repeated war_duel_battle_duel war_duels       = 6; // 各方阵容信息
  repeated war_battle_member    fronts          = 7; // 车头玩家列表
  repeated war_duel_ally_battle ally_battles    = 8; // 车轮战结果
}
// 异域夺金
message war_duel_battle_duel {
  required uint64               ally_id = 1;
  repeated war_duel_battle_car  cars    = 2;
}
// 异域夺金
message war_duel_battle_car {
  required uint64           id          = 1; // 决斗车id(1~5)
  optional uint64           front       = 2; // 车头玩家
  repeated uint64           members     = 3; // 车尾成员
  required uint64           front_gs    = 4 [default = 0]; // 车头战力
  optional uint64           army        = 5 [default = 0]; // 车头携带的兵力
}
// 异域夺金
message war_duel_ally_battle {
  required uint64 round           = 1;
  optional uint64 defense_ally_id = 2; // 防守方同盟id
  optional uint64 def_win_cnt     = 3; // 防守方胜利次数
  optional uint64 attack_ally_id  = 4; // 进攻方同盟id
  optional uint64 atk_win_cnt     = 5; // 进攻方胜利次数
  optional uint64 win_ally_id     = 6; // 胜利方同盟id
  repeated uint64 battle_ids      = 7; // 战斗录像id列表(按顺序存储)
}

//============================================================
// war 通用战斗结果：决斗战；
// 先锋战 有空可以改用下面的结果 war_ally_vanguard_member\war_besiege_user -> war_battle_member
//============================================================
// 异域夺金
message war_battle_member {
  optional uint64             uid             = 1; // UID
  optional uint64             gs              = 2; // 队伍总战力
  repeated war_battle_troop   troops          = 3; // 部队信息
  repeated uint32             troop_ids       = 4; // 羁绊
  optional astrolabe          astrolabe       = 5; // 生命之树
  optional uint64             dragon_stela_lv = 6; // 龙族石碑等级
  optional uint64             pet_book_lv     = 7; // 宠物百科等级
}

// 异域夺金
message war_battle_troop {
  required uint64         id            = 1; // TroopID
  optional team_with_hero team          = 2; // 部队单元信息
  map<uint64, hero_dyn>   hero_dyns     = 3; // 剩余血量
  optional uint64         morale        = 4[default = 0]; // 士气
  repeated uint64         effect_ids    = 5; // 效果: 科技、职业、购买、队伍自带
  optional uint64         voke_tid      = 6; // 职业
  optional uint64         contribution  = 7[default = 0]; // 贡献度
  optional uint64         army          = 8[default = 0]; // 兵力
  optional uint64         gs            = 9[default = 0]; // 战力
}

//============================================================
// 魂斗罗支线
//============================================================
message contra_side_story {
  optional uint64                         cur_stage             = 1[default = 1]; //当前魂斗罗支线关卡ID
  repeated contra_side_story_stage        passed_stages         = 2; //已经通关的魂斗罗支线关卡
  map<uint64, uint64>                     recvd_stars           = 3; //已经领取过的星级宝箱奖励<RewardID, RewardType>
  repeated uint64                         cur_adv_stage_ids     = 4; //当前刷新的冒险事件ID列表
  repeated contra_side_story_stage        passed_adv_stages     = 5; //已经通关的冒险关卡
  optional uint64                         not_get_reward_cnt    = 6[default = 0]; //已经通过冒险关卡但是没获取到奖励的次数，用于触发冲动礼包
  optional uint64                         adv_refresh_cnt       = 7; //冒险事件刷新次数
}

message contra_side_story_stage {
  required uint64                         stage_id              = 1; //魂斗罗支线关卡ID
  optional uint64                         star                  = 2; //星级
  optional bool                           is_recvd_reward       = 3; //是否领取过首通奖励
}

//魂斗罗 第四期支线
message contra_branch_line {
  optional uint64                            active_ts           = 1; // 支线激活时间
  repeated contra_branch_progress_info       progress_infos      = 2; // 当前进度列表
  optional contra_branch_gift_challenge_data gift_challenge_data = 3; // 礼包任务数据
}

//魂斗罗 第四期支线 进度数据
message contra_branch_progress_info {
  required uint64 progress_tid = 1; // 进度配置id
  required uint64 submit_ts    = 2; // 提交时间
}

// 魂斗罗 第四期支线 任务数据
message contra_branch_gift_challenge_data {
  optional uint64                            start_ts   = 1; // 开始时间
  optional uint64                            expire_ts  = 2; // 过期时间
  repeated contra_branch_gift_challenge_info challenges = 3; // 任务列表
}

// 魂斗罗 第四期支线 任务信息
message contra_branch_gift_challenge_info {
  required uint64 task_tid  = 1;              // 任务id
  required uint64 progress  = 2[default = 0]; // 进度
  optional uint64 recv_ts   = 3;              // 领取时间（未领取则该值为0）
  required bool   is_active = 4;              // 任务激活状态
}

// 二合一活动
message act_combin {
  required uint64              act_id                = 1; // 活动id
  repeated combin_stage        unlocked_stages       = 2; // 已解锁的关卡
  repeated combin_item_atlas   item_atlases          = 3; // 遇到的物品图鉴
  optional uint64              final_reward_ts       = 4; // 最终奖励领取时间
  repeated combin_group_reward group_rewards         = 5; // 小组奖励领取情况
}

message combin_group_reward {
  required uint64      group_id  = 1; // 小组id
  repeated uint64      recvd_ids = 2; // 领过奖的奖励id列表
}

message combin_item_atlas {
  required uint64      tid      = 1; // 物品tid
  optional uint64      recvd_ts = 2; // 领奖时间
}

message combin_stage {
  required uint64            stage_id         = 1; // 关卡id
  optional uint64            best_dmg         = 2; // 最佳伤害
  optional uint64            stamina          = 3; // 体力值
  optional uint64            cur_dmg          = 4; // 已经造成的伤害
  repeated combin_order      orders           = 5; // 订单
  repeated uint64            used_order_tids  = 6; // 已被挑选过的订单tids 策划要求每一关的前X个订单，顺序是固定的；csv_combination_order 的主键
  repeated uint64            dmg_reward_spots = 7; // 用cur_dmg计算奖励，未结算就要发，已领取就存下来，对应 csv_combination_spot_reward 的主键
  repeated uint64            dmg_relic_spots  = 8; // 用best_dmg计算的解锁遗物，结算才发，已解锁就存下来，对应 csv_combination_relic_reward 的主键
  optional combin_chessboard chessboard       = 9; // 棋盘
  optional uint64            reply_self_rank  = 10; // 玩家在该关卡的排名, 只有query_combin_stage & settle_combin_stage 才有
  optional uint64            best_dmg_ts      = 11; // 最高伤害的时间戳
  optional uint64            done_order_cnt   = 12[default = 0]; // 完成的订单数量
}

message combin_order {
  required uint64 tid       = 1; // 订单tid
  required uint64 init_ts   = 2; // 订单生成时间戳
  optional uint64 used_step = 3; // 限步数订单，客户端用来记录使用了多少步
  optional uint64 multi_ratio = 4 [default = 1]; // 倍数订单，客户端用来展示当前倍数
}

message combin_chessboard {
  repeated combin_chessboard_cell cells = 1; // 棋盘格子
}

enum t_chessboard_cell_status {
  normal      = 1;
  half_locked = 2; // 半锁定
  locked      = 3; // 锁定
}

message combin_chessboard_cell {
  required uint64                   id                   = 1; // 格子id
  required t_chessboard_cell_status status               = 2; // 格子状态
  optional uint64                   item_tid             = 3; // 格子上放置的物品
  optional uint64                   item_use_cnt         = 4; // 格子上物品的使用次数
}

message give_honor2cnt {
  required t_ally_honor type = 1;
  required uint64       cnt  = 2;
}

// 每个阶段可获取一次授勋
message ph_honor {
  optional t_war_map_phase        phase       = 1; // 赛季阶段
  optional t_ally_honor           honor       = 2; // 荣誉称号
  optional uint64                 ally_id     = 3; // 授予联盟ID
}

// 2025 万圣节战斗(南瓜趣味挑战 + boss挑战)
message act_pumpkin_brawl {
  required uint64                act_id                = 1;
  repeated pumpkin_brawl_stage   stages                = 2; // 挑战过的关卡列表
  repeated pumpkin_brawl_boss    bosses                = 3; // 挑战过的boss列表
}

// 2025 万圣节关卡结构
message pumpkin_brawl_stage {
  required uint64 tid                 = 1; // 关卡id
  repeated uint64 finish_task_tids    = 2; // 完成任务id列表
  required bool   is_pass             = 3 [default = false]; // 是否通关
}

// 2025 万圣节boss结构
message pumpkin_brawl_boss {
  required uint64                           tid                   = 1; // boss_id
  required uint64                           max_dmg               = 2 [default = 0]; // 本次活动最大伤害
  required uint64                           daily_max_dmg         = 3 [default = 0]; // 本日最大伤害
  required uint64                           daily_reward_progress = 4 [default = 0]; // 本日奖励进度(奖励进度id)
  optional cd                               challenge_cd          = 5; // 挑战cd
  repeated pumpkin_brawl_boss_battle_record battle_records        = 6; // 战斗记录id列表
  optional uint64                           max_dmg_battle_id     = 7; // 伤害最高那场战斗的战斗记录id
}

message pumpkin_brawl_boss_battle_record {
  required uint64 battle_id = 1;
  required uint64 damage    = 2;
}

enum t_mini_game {
  normal      = 1; // 普通用户,直接进入主线推关
  contra      = 2; // 魂斗罗玩家,直接进入魂斗罗
  need_ask    = 3; // 需要玩家选择是魂斗罗玩家还是普通玩家
}

enum t_func_name {
  season_hero = 1; // war赛季英雄
  war_army    = 2; // 兵力系统
}

message func_ctrl {
  required t_func_name    func_name = 1;
  required bool           is_active = 2;
}

enum t_cof_faction {
    god          = 1; // 神
    devil        = 2; // 魔
}

enum t_cof_event {
    normal      = 1; // 普通
    adventure   = 2; // 冒险
    battle      = 3; // 战斗
    gamble      = 4; // 猜输赢
    book_shard  = 5; // 信息碎片
    monster     = 6; // 魔物
}

enum t_cof_lane {
    left   = 1;
    middle = 2;
    right  = 3;
}

message cof_explore_event {
    required t_cof_event type       = 1; // 触发的事件类型
    repeated uint64      params     = 2; // 对于battle 和 gamble 来说是battle id
    optional uint64      group_id   = 3; // 触发事件对应group_id
    repeated uint64      event_ids  = 4; // 触发事件对应group event进度
}

message cof_book {
    required uint64 id                = 1; // 书本id
    required uint64 shard_progress_id = 2; // 获取的碎片id进度
}

message cof_monster_battle_record {
    required uint64 timestamp = 1;  // 时间
    required uint64 damage    = 2;  // 伤害
    required uint64 battle_id = 3;  // 录像id
}

message cof_battle_oppo {
    optional uint64         id               = 1;
    optional uint64         bank_id          = 2; // 评级
    optional user_summary   oppo_summary     = 3;
    repeated team_with_hero team_with_heroes = 4;
    optional uint64         tier             = 5; // 段位
    optional uint64         pet_book_lv      = 6[default = 0]; // 对手宠物百科等级，刷新对手时从其所在节点取
}

message cof_battle_record {
    optional uint64          battle_id     = 1; // 录像id
    optional t_battle_result result        = 2;
    optional uint64          oppo_bank_id  = 3; // 对手评级
    optional user_summary    oppo_summary  = 4;
    optional t_cof_lane      lane          = 5;
    repeated t_battle_result round_results = 6; // 每一场的胜负
}

message cof_boss_record {
    required uint64 timestamp = 1;  // 时间
    required uint64 damage    = 2;  // 伤害
    required uint64 battle_id = 3;  // 录像id
}

// 魂斗罗
enum t_contra_battle {
    prologue   = 1; // 序章魂斗罗战斗
    side_story = 2; // 开始推关后的banner魂斗罗
    challenge  = 3; // 魂斗罗大礼包活动
    branch_line  = 4; // 魂斗罗第四期 新支线
}

//============================================================
// 军备竞赛
//============================================================
message act_guild_arm {
    required uint64              today          = 1[default = 1];   // day index 第几天（1开始）
    repeated act_guild_arm_his   task_his       = 2;
    repeated act_guild_arm_like  like_his       = 3;
    map<uint64, uint64>          gid_2_dp       = 4;
}

message act_guild_arm_his {
    required uint64             day             = 1[default = 1];   // day index 第几天
    map<uint64, uint64>         task_2_point    = 2;                // <任务id, 在这个任务上获取的积分>
    optional uint64             self_rank       = 3;                // 对应天数在个人日榜排名
    optional uint64             guild_id        = 4;                // 对应天数所在公会(以结算时为准)
}

message act_guild_arm_like {
    required uint64             day             = 1[default = 0];   // day index 第几天
    repeated uint64             is_like         = 2;                // 今天已经点赞的人
    repeated uint64             be_like         = 3;                // 今天被谁点过赞
}

message act_guild_arm_daily {
    required uint64             act_tid         = 1;                // 活动id
    required uint64             today           = 2[default = 1];   // day index 第几天
    required act_task           task            = 3;                // 任务和积分和已领取箱子,
}

//============================================================
// 钓鱼活动
//============================================================
message act_fish {
  required uint64              act_id              = 1;      // 活动id
  optional fish                rand_fish           = 2;      // 要钓上来的鱼
  repeated fish_album          fish_albums         = 3;      // 鱼的图鉴列表
  required uint64              last_reset_ts                  = 4;  // 上次刷新的时间,可以无数次钓鱼 但 每天只能钓上来6条鱼 warning 2026 anniv 弃用
  required uint64              fish_sum            = 5[default = 0]; // 总共钓了几条鱼(消耗了多少鱼饵)
  repeated item                act_items           = 6;      // 活动中的鱼，鱼饵信息
  required common_assist       common_assist       = 7;      // 互助系统公用的结构
  required uint64              today_recv_cnt      = 8;      // 今日已经收了几条鱼
  repeated uint64              today_helped_uids   = 9;      // 今天已经帮助了哪些人
//2026 anniv bgein by York
  optional cd                  bait_shop_cd                   = 10;  // 购买鱼饵cd
  required uint64              total_score                    = 11[default = 0];  // 钓鱼累计积分
  repeated uint64              recvd_score_reward_ids         = 12;  // 已领取的进度奖励id列表
  optional uint64              golden_angler_lv               = 13;  // 黄金鱼竿等级 (未解锁为 UNDEFINED)
  repeated uint64              unlocked_spot_group_ids        = 14;  // 已经解锁的渔场组id
  repeated act_fish_buff       fish_buffs                     = 15;  // 钓鱼buff(是否必上特殊道具之类的buff)
  optional act_fish_easter_egg next_easter_egg                = 16;  // 下一个奇遇进度id
  optional act_fish_toy_info   toy_info                       = 17;  // 小玩具信息
  optional act_fish_weather    weather_info                   = 18;  // 天气信息 (空为未解锁)
//2026 anniv end
}

// 天气信息
message act_fish_weather {
  required uint64         tid           = 1;              // 天气配置id
  required uint64         times         = 2[default = 0]; // 天气剩余次数
  required uint64         rota_cnt      = 3[default = 0]; // 轮换总计数(消耗了多少鱼饵, 非默认天气时 不计数)
  optional random_lottery rota_lottery  = 4;              // 天气轮换lottery
  optional uint64         rota_tid      = 5;              // 轮换配置id
}

message fish {
  optional uint64         tid                      = 1; // 鱼的配置id ()
  optional uint64         size                     = 2; // 鱼的尺寸
  optional uint64         angle_ts                 = 3; // 开始钓鱼的时间戳
//2026 anniv bgein by York
  optional uint64         spot_id                  = 4; // 渔场id 在哪个渔场钓的
  optional uint64         score                    = 5; // 最终分数
  repeated fish_rate_attr attrs                    = 6; // 鱼倍率属性
  optional uint64         easter_egg_tid           = 7; // 奇遇进度id
  optional uint64         fish_buff_id             = 8; // 本次fish_buff_id
  optional uint64         toy_tid                  = 9; // 玩具tid
//2026 anniv end
}

// 鱼积分倍率属性（用于记录影响分数的选项）
message fish_rate_attr {
  required t_fish_rate_attr type       = 1; // 类型
  optional uint64           attr_param = 2; // 不同类型的不同参数 例如：黄金鱼竿对应的是等级
}

// 鱼属性类型
enum t_fish_rate_attr {
  fish_weather_id  = 1; // 天气id
  golden_angler_lv = 2; // 黄金鱼竿等级
}

// 钓鱼 彩弹
message act_fish_easter_egg {
  required uint64         easter_egg_tid = 1; // 彩弹配置id
  optional random_lottery lottery        = 2; // 保底
}

// 钓鱼buff
message act_fish_buff {
  required uint64         buff_tid = 1; // buff配置id
  optional random_lottery lottery  = 2; // 保底
  optional uint64         got_ts   = 3; // 获得时间
}

// 钓鱼 小玩具信息
message act_fish_toy_info {
  repeated uint64          recvd_toy_ids  = 1;  // 已领取 小玩具id 列表
  optional random_lottery  lottery        = 2;  // 保底
}

// 钓鱼 跑马灯信息
message act_fish_broad_cast_info {
  optional uint64 id   = 1;
  optional uint64 uid  = 2;
  optional fish   fish = 3;
}

message fish_album {
  required uint64 tid       = 1; // 鱼的配置id
  optional uint64 max_size  = 2; // 钓上来的鱼的最大尺寸
  optional uint64 reward_ts = 3; // 领取鱼的图鉴奖励的时间戳
  optional uint64 max_score = 4; // 最大分数
}

// 2026周年庆 养龙宠 + 遗物boss
message act_care_pet {
  required uint64               pet_grow_progress  = 1[default = 0]; // 宠物成长进度
  repeated uint64               log_tids           = 2; // 养成日志
  required uint64               intimacy           = 3[default = 0]; // 亲密度
  repeated uint64               mural_recvd        = 4; // 壁画已经领取了的奖励
  optional uint64               cur_area_id        = 5; // 当前区域id
  optional uint64               uid                = 6;
  repeated uint64               touched_days       = 7; // 哪些天抚摸过
  optional heirloom_boss_info   heirloom_boss_info = 8; // 遗物boss 与raid解绑版
  repeated heirloom_boss        heirloom_bosses    = 9; // 遗物boss 与raid绑定版
  repeated uint32               heirlooms          = 10; // 当前拥有的遗物
}

message heirloom_boss_info {
  repeated         team_heirlooms             team_heirlooms   = 1; // 上次所选遗物
  map<uint64,      heirloom_boss_dmg_rewards> boss_reward_map  = 2; // 伤害奖励信息
  repeated         uint64                     unlock_boss_list = 3; // 当前解锁的boss列表
}

message team_heirlooms {
  required uint64  id               = 1; // 队伍id
  required uint64  boss_id          = 2; // bossid
  repeated uint64  active_heirlooms = 3; // 选择的遗物
}

message heirloom_boss_dmg_rewards {
  optional uint64  max_reward_id = 1[default = 0]; // 当前可领取的最大奖励id
  repeated uint64  recvd_list    = 2; // 已领取列表
}

message heirloom_boss {
  repeated heirloom_boss_record     records              = 1;  // 历史记录
  map<uint32, heirloom_boss_record> best_record_map      = 2;  // boss每日最佳伤害 <第几天, record>
  optional cd                       battle_cd            = 3;  // 战斗cd
  optional cd                       refresh_cd           = 4;  // 重置cd的cd
  repeated uint32                   recvd_ids            = 5[deprecated = true]; // 已领取奖励ids
  repeated heirloom_boss_recvd      recvd_list           = 6;  // 已领取boss奖励
  map<uint32, uint64>               battle_cnt           = 7;  // <boss_id, cnt> 挑战次数
  map<uint32, heirloom_boss_record> boss_best_record_map = 8;  // 每个boss最佳伤害 <boss_id, record>
  optional t_reward_daily           reward_daily         = 9[default=can_not_recv]; // 每日奖励状态
  optional uint64                   boss_id              = 10; // boss区分标识
}

message heirloom_boss_recvd {
  required uint32  boss_id    = 1;
  repeated uint32  recvd_ids  = 2;
}

message heirloom_boss_record {
  required uint64  replay_id = 1;
  required uint64  damage    = 2;
  required uint64  create_ts = 3;
}

message gv_user_task {
  required uint32 tid      = 1;              // 任务 ID，对应 csv 配置
  required uint64 progress = 2 [default=0]; // 当前进度
  required bool   recvd    = 3 [default=false]; // 是否已领奖
  required uint32 reset_ts = 4 [default=0]; // 上次日重置时间戳，跨天时重置 progress/recvd
}

enum guild_vehicle_rank_type {
  guild_dmg   = 1; // 组内公会伤害排名
  member_dmg  = 2; // 公会成员伤害排名
  member_donate = 3; // 公会成员捐献排名
}

message gv_battle_record {
  required uint64  battle_id  = 1; // 录像ID
  required uint64  ts         = 2; // 战斗时间戳
  required uint64  damage     = 3; // 本次伤害
}

enum t_donate_type {
  donate = 1; // 捐献
  quit   = 2; // 退盟扣除
}

message gv_donate_log {
  required t_donate_type  donate_type  = 1; // 1=捐献 2=退盟扣除
  required uint64         uid          = 2;
  required string         name         = 3;
  required int64          amount       = 4; // 正数=增加 负数=扣除
  required uint64         ts           = 5;
}

//================================================ 公会魂斗罗 活动 begin ==================================================
message act_user_guild_contra {
  optional uint64                             last_gid              = 1; // 活动内最后加入的公会id
  optional uint64                             season_id             = 2; // season_id
  optional act_user_guild_contra_stage_info   stage_info            = 3; // 活动内主流程详情
  optional act_user_guild_contra_boss_info    boss_info             = 4; // 活动内boss详情
  repeated uint64                             recvd_guild_score_ids = 5; // 已经领取的公会积分奖励列表
  optional uint64                             extra_score           = 6[default = 0]; // 额外分数
}

// 公会魂斗罗 活动 关卡信息
message act_user_guild_contra_stage_info {
  repeated act_user_guild_contra_stage stages         = 1;
  repeated uint64                      recvd_star_ids = 2; // 已经领取的星级奖励列表
}

// 公会魂斗罗 活动 关卡 （主线 奖励关 都在该结构中，用tid配合配置判断类型）
message act_user_guild_contra_stage {
  required uint64 stage_tid  = 1;
  optional uint64 star       = 2[default = 0]; // 目前星级
  optional uint64 score      = 3[default = 0]; // 当前分
  optional uint64 pass_state = 4[default = 0]; // 通关状态(0为未通关，> 0 为已通关）
}

// 公会魂斗罗 活动 boss信息
message act_user_guild_contra_boss_info {
  repeated act_user_guild_contra_boss  bosses = 1;
}

// 公会魂斗罗 活动 boss
message act_user_guild_contra_boss {
  required uint64                              boss_tid         = 1;
  optional uint64                              damage           = 2[default = 0]; // 目前伤害
  repeated act_user_guild_contra_battle_record records          = 3;
  repeated uint64                              recvd_damage_ids = 4; // 已经领取的伤害奖励列表
}

message act_user_guild_contra_battle_record {
  required uint64  replay_id    = 1;
  required uint64  damage       = 2;
  required uint64  create_ts    = 3;
  optional uint64  boss_tid     = 4;
}

