  active_shard_ids              = 16;
  trigger_condition             = 17;
  player_through                = 18;
  raid_task_completed           = 19;
  raid_after_conditions         = 20;
  up_building                   = 21;
  up_heat                       = 22;
  choice_session                = 23;
  trans_area                    = 24;
  after_pass_combin             = 25;
  auto_condition                = 26;
  after_charge                  = 27;
  contra_pass_stage             = 28;
}

// 这里包一层结构， 不然客户端无法判断列表为空的时候是 nil值还是空列表
