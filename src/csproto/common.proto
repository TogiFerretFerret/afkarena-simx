  time_monster     = 5;
  damage_monster   = 6;
  hero_monster     = 7;
  npc              = 8;
  pandora          = 9;
  hot_spring       = 10;
  hades            = 11;
  servant          = 12;
  initial          = 13;
  nomal_end        = 14;
}

enum t_infinite_behavior {
  battle              = 1; // 战斗
  choose_amulet       = 2; // 选择信物奖励
  choose_next_room    = 3; // 选择下一层房间
  choose_npc          = 4; // 选择npc
  choose_servant      = 5; // 选择助力英雄
  use_hot_spring      = 6; // 使用温泉
  revive              = 7; // 复活
  choose_pandora      = 8; // 选择恶魔房间
}

enum t_infinite_privilege {
  inst_reset_free     = 1;
}

message infinite_inst_map {
  required t_infinite             type                    = 1;
  map<uint32, uint32>             inst_lvs                = 2;
  required cd                     reset_cd                = 3;
  repeated uint64                 last_batch_up_ids       = 4; // 上一次批量升级选中的词条id列表
}

message infinite_idle {
  required uint64      calc_ts          = 1; // 上次计算奖励时间
  repeated left_asset  left_assets      = 2; // 上次领取奖励时的剩余资源，不足1
  optional uint64      last_reward_ts   = 3; // 上次领奖时间(客户端显示用, 避免calc_ts改变时挂机时间减少)
}

message infinite_top_reward_review {
  required uint64                season      = 1;
  required uint64                reward_id   = 2;
  repeated infinite_top_element  top_info    = 3; // 前三名玩家信息
}

message infinite_top_element {
  required uint64        rank             = 1;
  optional user_summary  summary          = 2;
  required uint64        uid              = 3;
  required uint64        score            = 4; // 根据不同的排行榜类型, score的含义不同
  required bool          lineup_visible   = 5; // 是否可见阵容
}

// 乱时之境-pve
// 加新字段时需考虑修改infinite_pve:trim_reply_pve/1
message infinite_pve {
  required infinite_pve_expd_team       expd_team                 = 1; // 远征队伍
  required cd                           cd                        = 2; // 挑战次数cd
  required uint64                       his_max_floor             = 3 [default = 0]; // 赛季历史最大层数，end_game时更新
  required uint64                       his_max_floor_gs          = 4 [default = 0]; // 历史达到最大层数的远征队伍战斗力，end_game时更新
  required uint64                       pass_max_floor_ts         = 5 [default = 0]; // 到达最大层数时间
  required uint64                       max_recvd_reward_floor    = 6 [default = 0]; // 最大已领取楼层奖励（首次通过奖励）
  repeated infinite_pve_lineup          recent_pve_lineups        = 7; // 最近pve阵容。后改为最近快速挑战的阵容
  repeated uint64                       recent_end_game_floors    = 8; // 最近结束游戏的层数统计
    //  重开新的一局pve时，以上字段保留，以下字段全部重置      。修改保留字段时需修改infinite_pve:end_game方法
  optional uint64                       new_game_start_ts         = 9 [default = 0]; // 新游戏开始时间
  required uint64                       cur_floor                 = 10[default = 0]; // 当前关卡层数
  required uint64                       cur_floor_gs              = 11[default = 0]; // 进入当前层时的战力
  optional infinite_pve_room            cur_room                  = 12; // 当前房间信息
  repeated t_infinite_behavior          behaviors                 = 13; // 房间行为列表
  repeated uint64                       next_room_opts            = 14; // 后续房间选择的范围
  map<uint64, uint64>                   room_pass_cnts            = 15; // 通过的各类房间数量 <room_id, cnt>
  repeated infinite_effect              effects                   = 16; // effects
  map<uint64, uint64>                   chaos_times               = 17; // 混乱效果剩余次数 <chaos_id, times>
  repeated infinite_pve_log             logs                      = 18; // 日志记录
  repeated infinite_battle_record       battle_records            = 19; // 战斗记录
  required infinite_amulet_reset        amulet_reset              = 20; // 信物重置信息
  repeated uint64                       change_behavior_inst_ids  = 21; // 改变了房间行为的命运清单id，当前只存在增加choose_amulet的命运清单效果
  repeated asset                        recvd_reward              = 22; // 本局游戏内已领取的奖励
  repeated infinite_room_id_enemy       next_room_enemies_list    = 23; // 后续房间敌人信息
  optional uint64                       no_increase_reopen_times  = 24 [default = 0]; // 没有达到历史最高楼层的挑战次数, 每日重置
  optional bool                         notify_client_flag        = 25 [default = false]; // 是否触发过客户端引导,每日重置
  optional uint64                       selected_room_idx         = 26; // 选门时选中的idx
  optional uint64                       miss_amulet_box_count     = 27 [default = 0]; // 剩余禁用信物奖励的层数
  optional uint64                       cur_revert_times          = 28[default = 0]; // 当前时光回溯次数(房间回溯和单次战斗回溯共用 每日重置 新开一局时不重置)
  repeated uint64                       gm_room_id_list           = 29; // GM测试用 按顺序生成接下来的房间id
  optional cd                           revert_floor_cd           = 30;
  // todo: rog六期 新增字段
  optional uint64                       stamina_point             = 31 [default = 0]; //
  repeated infinite_amulet              team_amulets              = 32; //
  map<uint64, uint64>                   amulet_lineup             = 33; // 信物使用阵容 key: 敌人队伍总数 * 10 + 队伍序号拼成的id value: 对应队伍使用的信物id
  optional uint64                       script_id                 = 34 [default = 0]; // 剧本id 在生成20*N+1层房间时, 需要先重新随机剧本
  optional uint64                       immune_stamina_times      = 35 [default = 0]; //
  map<uint64, uint64>                   npc_skill_times           = 36; // npc房间buff效果剩余次数
  optional infinite_pve_his_save_points his_save_points           = 37;
  optional uint64                       end_game_times            = 38 [default = 0]; // 当前赛季结束赛季次数
}

message infinite_pve_his_save_points {
  required uint64                   id                  = 1 [default = 1];
  repeated infinite_pve_save_point  recent_save_points  = 2;
  repeated infinite_pve_save_point  collect_save_points = 3;
}

message infinite_pve_save_point {
  required uint64                           id                  = 1;
  repeated infinite_pve_floor_save_point    floor_save_points   = 2;
  required uint64                           create_ts           = 3;
}

message infinite_pve_floor_save_point {
  required uint64           floor           = 1;
  required uint64           stamina         = 2;
  required uint64           script_id       = 3;  // 服务器用来生成下一层房间的剧本id
  repeated infinite_amulet  team_amulets    = 4;
  repeated uint64           hero_ids        = 5;
  required uint64           stamina_inst_lv = 6 [default = 0];
}

message infinite_team_with_amulet {
  required uint64                 enemy_index             = 1;
  required team                   team                    = 2;
  optional uint64                 amulet_id               = 3;
}

// 单独开一张表保存玩家的rog通关阵容数据
message uinfinite_battles {
  required uint64                   uid                     = 1;
  required uint64                   season                  = 2; // 记录时的赛季(跨赛季时需清空records并更新season)
  repeated infinite_battle_lineup_record records            = 3; // 当前赛季记录的每一层推关阵容
}

message infinite_battle_lineup_record {
  required uint64                   uniq_id                 = 1; // 根据floorId, RoomType, 选左右门, 生成的唯一id 调用uinfinite_battles:gen_uniq_id/3生成
  required uint64                   room_gs                 = 2; // 房间内总战力
  repeated infinite_battle_pve_team teams                   = 3; // 房间内所有战斗集合

}

message infinite_stage_record {
  required uint64                   uid                     = 1;
  required uint64                   room_gs                 = 2;
  required infinite_battle_lineup_record record             = 3;
}

// 用于记录整个赛季pve爬层的公共推荐数据
//    infinite_pve_global_records
//    infinite_pve_floor_record
message infinite_pve_global_records {
  required uint64                   uniq_id                 = 1; // 调用uinfinite_battles:gen_uniq_id/3生成
  required uint64                   season                  = 2;
  repeated infinite_stage_record    records                 = 3; // 当前楼层记录的10个战斗记录
}

message infinite_battle_pve_team {
  required uint64                   team_id                 = 1; // 第几队
  required uint64                   battle_id               = 2; // 战斗录像id
}

message ban_hero_info {
  required uint64                 chaos_id                = 1;
  required uint64                 times                   = 2;
}

message infinite_boss {
  repeated infinite_boss_info     boss_info_list          = 1; // 不同boss的cd数据
  repeated infinite_boss_single_team  recent_lineups      = 2; // 最近挑战boss的阵容
  repeated infinite_boss_single_team  saved_lineups       = 3; // 玩家收藏的阵容
  optional infinite_boss_lineup   cur_lineup              = 4; // 玩家当前阵容
  required uint64                 season_id               = 5; // 赛季id
  repeated uint64                 new_boss_red_dot_status = 6; // 刷新新boss是否推过红点
  repeated uint64                 almost_finish_boss_ids  = 7; // boss临近结束红点已推送boss列表
}

// 记录最佳伤害
message infinite_boss_record {
  required battle_record  record        = 1; //  英雄, 清单, 信物 从这里读出
  required uint64         damage        = 2;
  required uint64         create_ts     = 3;
  required lineup_team    lineup_team   = 4;
  repeated uint64         damages       = 5;
}



// 历史战斗记录
message infinite_boss_his_record {
  required uint64                 replay_id               = 1;
  repeated uint64                 damages                 = 2;
  required uint64                 create_ts               = 3;
}

message infinite_boss_info {
  required uint64                 challenge_count         = 1 [default = 0]; // 挑战次数
  required uint64                 buy_count               = 2 [default = 0]; // 付费购买次数
  required uint64                 last_reset_day          = 3 [default = 0]; // 记录上次重置挑战次数和付费次数时是在活动的第几天
  required uint64                 max_dmg                 = 4 [default = 0]; // 最大伤害
  repeated uint64                 recvd_list              = 5; // 已领取的奖励id
  required uint64                 boss_id                 = 6;
  optional infinite_boss_record   boss_record             = 7; // 记录最佳表现的阵容和战斗录像, 活动结束时统一归档, 用于后续名人堂使用
  required uint64                 season                  = 8; // 当前赛季 补发奖励时用于确认具体配置
  optional uint64                 expire_ts               = 9; // 什么时候进行结算 undefined表示已经结算过 不用处理
  repeated infinite_boss_his_record his_records           = 10; // 历史战斗记录
}

message infinite_boss_lineup {
  optional uint64                 id                      = 1;
  map<uint64, uint64>             hero_amulets            = 2; // <hero_id, amulet_id>
  optional uint64                 ts                      = 3;
  optional string                 name                    = 4; // 收藏阵容的名字
  required lineup_team            lineup_team             = 5;
}

message infinite_boss_single_team {
  optional uint64                 id                      = 1;
  map<uint64, uint64>             hero_amulets            = 2; // <hero_id, amulet_id>
  optional uint64                 ts                      = 3;
  optional string                 name                    = 4; // 收藏阵容的名字
  required team                   team                    = 5;
  optional uint64                 boss_id                 = 6;
}

message infinite_room_id_enemy {
  required uint64                 room_id                 = 1;
  repeated infinite_pve_enemy     enemies                 = 2; // 房间内敌人阵容
}

//  乱时之境-pve远征队
message infinite_pve_expd_team {
  repeated uint64                 hero_ids                = 1;
  repeated hero                   assist_heroes           = 2; // 助战英雄
}

message infinite_effect {
  required uint64                 id                      = 1;
  optional uint64                 condition_id            = 2;
  repeated uint64                 trigger_args            = 3;
  repeated uint64                 effect_args             = 4;
  optional uint64                 max_times               = 5;
  required uint64                 cur_times               = 6[default = 0];
  optional uint64                 inst_id                 = 7;
}

message infinite_effect_result {
  repeated uint64                 insts                   = 1; // 起作用的命运清单ids  生成信物的时候给客户端展示用的 告诉客户端这次生成触发了哪些效果 现在不需要了 先留着吧 后面没地方用了再删
  optional int64                  add_hp                  = 2;
  optional int64                  add_mp                  = 3;
  optional uint64                 add_revive_hero_cnt     = 4;
  optional t_infinite_room        reset_room_type         = 5; // 重置房间类型
  repeated uint64                 add_chaos_list          = 6;
  optional uint64                 reduce_chaos_times      = 7; // 减少混乱效果触发次数
  optional int64                  cut_boss_hp             = 8;
  optional int64                  cut_sp_boss_hp          = 9; // 扣除特定boss血量
  optional bool                   clear_amulet_debuff     = 10;// 清除黑暗信物的debuff
  optional uint64                 set_amulet_lv           = 11;
  optional uint64                 add_amulet_reset_times  = 12;// 增加的信物重置次数
  optional uint64                 set_last_round_amulet_box   = 13;// 继承上局信物的数量
    //  以下是临时寄存的effect生效数据，在执行effect生效逻辑前会将以下的字段数据合并入以上的字段值中
  optional uint64                 cost_hp                 = 14;
  optional uint64                 cost_mp                 = 15;
  //  以下fake_字段专为展示用
  optional uint64                 fake_add_revive_hero_cnt= 16;
  optional int64                  fake_add_hp             = 17;
  optional int64                  fake_add_mp             = 18;
  optional int64                  fake_cost_hp            = 19;
  optional int64                  fake_cost_mp            = 20;
  optional int64                  fake_cost_boss_hp       = 21;
  optional int64                  fake_cost_sp_boss_hp    = 22;

  optional int64                  select_room_idx         = 23; // 下一层二选一选择的房间(1或2)
  map<uint64, uint64>             up_hero_amlt_type       = 24; // 英雄id以及变化后的信物id <hid, new_amulet_id>
  map<uint64, uint64>             up_hero_amlt_lv         = 25; // 英雄id以及升级后的信物id <hid, new_ amulet_id>
  repeated infinite_amulet_opt    infinite_amulet_opts    = 26; // 随机出的新信物
  repeated chaos_args             chaos_args              = 27; // 当前房间内获得的 诅咒效果禁用英雄以及剩余禁用层数
  optional uint64                 auto_revive_cnt         = 28; // 当前剩余自动随机复活次数
  repeated uint64                 auto_revive_hids        = 29; // 当前触发的自动随机复活hids
  optional bool                   spring_shield           = 30; // 春语房间是否产生护盾

  optional uint64                 npc_room_lgd_amlt_ratio = 31; // todo: 废弃 双子房间内选择信物生成传说信物的概率 优先级高于默认概率
  repeated uint64                 npc_room_revive_hids    = 32;
  map<uint64, uint64>             adjust_term_weight      = 33; // key: 词条品质id value: 权重倍率
  optional uint64                 spring_incr_add_stamina = 34; // 温泉房间回耐力时额外多回复的点数
  optional uint64                 fake_add_stamina        = 35; // 客户端显示用
  optional uint64                 battle_decr_hp_stamina_loss = 36; // 战斗结束，减少掉血造成的耐久度消耗
  optional uint64                 battle_decr_time_stamina_loss = 37; // 战斗结束，减少耗时造成的耐久度消耗
  optional uint64                 battle_decr_death_stamina_loss = 38; // 战斗结束，减少死亡造成的耐久度消耗
  optional uint64                 improve_stamina_limit   = 39; // 增加耐久度上限值
  optional uint64                 pan_decr_cut_stamina    = 40; // 减少恶魔房间选词条的耐久消耗
  optional uint64                 npc_incr_buff_floors = 41; // npc房间增加许愿强化buff的层数
  map<uint64, uint64>             npc_buff_id_floors      = 42; // 双子房间获得buff:<id,作用层数>
}

message chaos_args {
  required uint64                 chaos_id                = 1;
  optional uint64                 ban_hero_id             = 2;
  optional uint64                 times                   = 3;
}

//  乱时之境-pve日志
message infinite_pve_log {
  required uint64                 cfg_id                  = 1;
  repeated uint64                 params                  = 2;
  required uint64                 ts                      = 3;
}

//  乱时之境-pve战斗记录
message infinite_battle_record {
  required uint64                 replay_id                 = 1;
  required uint64                 floor                     = 2;
  required t_battle_result        battle_result             = 3;
  required uint64                 ts                        = 4;
}

//  乱时之境-pve阵容
message infinite_pve_lineup {
  required uint64                 id                      = 1;
  repeated uint64                 hero_ids                = 2;
  repeated uint64                 amulet_ids              = 3;
  optional string                 name                    = 4;
  optional uint64                 ts                      = 5;
  optional uint64                 floor                   = 6;
}

//  乱时之境-信物重置信息
message infinite_amulet_reset {
  required uint64                   use_times               = 1[default = 0];
  required uint64                   max_times               = 2[default = 0];
}

//  乱时之境-pve房间
message infinite_pve_room {
  required uint64                 id                      = 1; // 配表中随机使用的主键id
  required t_infinite_room        type                    = 2; // 类型
  repeated hero                   hero_opts               = 3; // 可选英雄，某些类型会用到
  repeated infinite_amulet_opt    amulet_opts             = 4; // 战斗后生成的信物词条选项
  repeated uint64                 npc_opts                = 5; // 可选的npc
  optional uint64                 enemy_gs_id             = 6; // 根据房间类型和楼层生成的敌人战力配置id
  repeated infinite_pve_enemy     enemies                 = 7; // 对面的阵容
  required uint64                 create_ts               = 8; // 房间创建的时间
  optional bool                   challenge_success       = 9[default = false]; // 挑战房是否挑战成功

  // 3期需求
  optional uint64                 gm_chaos_id             = 10; // GM用 设置魅惑房间生成的诅咒id
  repeated infinite_gs_battle_id  battle_records          = 11; // 队伍id到战斗录像id的映射
  optional bool                   defeated_in_history     = 12 [default = false]; // 房间内战斗曾经战败过 (回溯后重置)
  repeated uint64                 defeated_enemy_ids      = 13; // 被击败的队伍id集合

  // 6期需求
  optional infinite_team_enemy_lock team_enemy_lock       = 14; //
  optional infinite_revert_floor  revert_floor            = 15; // 记录回溯整层需要的信息
  optional infinite_revert_floor  before_battle_revert_floor = 16; // 记录回溯单场战斗需要的信息
  optional infinite_pan_opts      infinite_pan_opts       = 17;
  optional uint64                 spring_restore_stamina  = 18 [default = 0];
  repeated infinite_revert_floor  revert_team_floors      = 19;
}

message infinite_pan_opts {
  required uint64 room_cond_id = 1;
  optional uint64 cut_stamina  = 2;
  optional uint64 add_stamina  = 3;
  optional uint64 blind_cnts   = 4;
}

message infinite_npc_opts {
  repeated uint64 cond_ids = 1;
}

message infinite_team_enemy_lock{
  map<uint64, uint64>             pet_2_enemy_id          = 1;
  map<uint64, uint64>             hero_2_enemy_id         = 2;
  map<uint64, uint64>             amulet_2_enemy_id       = 3;
}

message infinite_gs_battle_id{
  required uint64                 team_id                 = 1;
  required uint64                 team_gs                 = 2;  // 提前算好队伍战力 只有当前战力比旧数据低的时候才根据battleId去查询战斗录像数据
  required uint64                 battle_id               = 3;  // 房间内只记录录像id节省空间
}

message infinite_amulet_opt {
  required uint64                 amulet_id               = 1; // 要修改的信物id
  required uint64                 add_term                = 2; // 新获得的词条id
}

//  乱时之境-pve敌人信息
message infinite_pve_enemy {
  required uint64                 id                      = 1; // enemy_id
  required bool                   is_boss                 = 2; // 是否是boss
  required uint64                 enemy_gs_id             = 3; // 根据房间类型和楼层生成的敌人战力配置id
  repeated slot_hero              slot_heroes             = 4; // 敌方阵容
  map<uint64, hero_dyn>           hero_dyns               = 5; // 剩余血量
  optional bool                   is_defeated             = 6[default = false]; // 已经打败
  required uint64                 battle_times            = 7[default = 0]; // 战斗次数
}

// 乱时之境-时光回溯信息
message infinite_revert_floor {
  required uint64                   deprecated_use_times    = 1[deprecated = true]; // 弃用 使用pve.cur_revert_times替代
  required uint64                   deprecated_max_times    = 2[deprecated = true]; // 弃用 最大层数读表
  required bool                     forbid_revert           = 3; // 是否禁用回溯 选择信物时设置为true, 战斗后设置为false(因为同一个房间选择信物一定在战斗之后)
  repeated infinite_amulet_opt      amulet_opts_backup      = 4; // 可选信物清单的备份
  repeated infinite_revert_floor_enemy_dys enemies_hero_dyns = 5; // 敌人的血蓝信息(进入下一层或者开战前更新, 取决于回溯类型)
  repeated t_infinite_behavior      behaviors               = 6; // 回溯前的行为信息
  optional uint64                   cur_enemy_id            = 7; //当前挑战的队伍id (单次战斗回溯用)
    // rog6期
  optional infinite_team_enemy_lock team_enemy_lock         = 8; //
  optional uint64                   stamina_point           = 9; // 开始前的耐力值
  optional uint64                   challenge_cnt           = 10;
  optional uint64                   total_reduce_stamina    = 11;
}

message infinite_revert_floor_enemy_dys {
  map<uint64, hero_dyn>             hero_dyns               = 1;
}

message infinite_top_set_lineup_visible {
  required uint64                       season                = 1;  // 修改赛季
  required t_infinite                   type                  = 2;  // 排行榜类型
  required bool                         visible               = 3;  // 阵容是否可见
}


//============================================================
// auto_bt
//============================================================
// 当前战斗阶段
enum t_auto_bt_phase {
  auto_bt_phase_init          = 1; // 初始化：处理报名
  auto_bt_phase_init_over     = 2; // 初始化结束
  auto_bt_phase_match         = 3; // 正在匹配
  auto_bt_phase_match_over    = 4; // 匹配结束，开始开始战斗
  auto_bt_phase_battle        = 5; // 战斗阶段
  auto_bt_phase_battle_over   = 6; // 本轮战斗结束。可进行下一轮匹配或者结束今日匹配和战斗
  auto_bt_phase_over          = 7; // 当日所有轮次已打完
  auto_bt_phase_half_over     = 8; // 半场结束
  auto_bt_phase_half_init     = 9; // 半场初始化结束
}

//============================================================
// 工会猎宝
//============================================================
// 玩家类型
enum t_camp_title {
  soldier   = 1; // 普通玩家
  general   = 2; // 大将军
}
// 普通玩家行动类型
enum t_guild_camp_act_type {
  general   = 1; // 大将军
  farm      = 2; // 悬赏
  scout     = 3; // 侦察
  fight     = 4; // 争夺
}

// 查看排行榜：榜单类型
enum t_guild_camp_rb_type {
  general   = 1; // 当前赛区大将军排名
  guild     = 2; // 当前服公会排名
}

// 积分面板信息中各大将军排名、积分、额外积分信息
message camp_score_entry {
  required uint64  uid           = 1;
  required uint64  rank          = 2;
  required uint64  score         = 3;
  required uint64  time          = 4;
  required uint64  extra_score   = 5; // 排名额外积分
}

// 各buff数据: 投票 | 已获得积分 | 行动报名人数
message camp_buff_score {
  required t_guild_camp_act_type  act_type   = 1;
  optional uint64                 id         = 2; // buff_type=scout时，表示针对哪个阵营的buff
  optional uint64                 score      = 3 [ default = 0 ]; // 已获得的积分 | 人数 | 票数
}
message guild_camp_buff_scores {
  repeated guild_camp_buff_score  scores   = 1;
}
message guild_camp_buff_score {
  required uint64  tid     = 1; // GuildCampActBuff
  required uint64  score   = 2 [ default = 0 ]; // 已获得的积分 | 人数 | 票数
}

message guild_camp_log {
  required uint32  tid      = 1; // 日志表格id
  required uint32  ts       = 2; // 创建时间
  optional uint64  uid      = 3; // 日志产生者
  repeated uint64  params   = 4; // int list参数,
}

message guild_camp_id_lineup {
  required uint64             id       = 1; // fight: buff_id; farm: day
  required guild_camp_lineup  lineup   = 2;
}

message guild_camp_lineup {
  repeated guild_camp_ban_lineup  lineups   = 1; // 阵容
}

message guild_camp_ban_lineup {
  required lineup  lineup         = 1; // 阵容
  optional uint64  ban_hero_tid   = 2; // 大将军可以设置不匹配的英雄（目前只能设置一个）
}

message guild_camp_battle_record {
  required uint64           team_id             = 1; // 队伍id
  required bool             is_self             = 2;
  optional uint64           oppo_uid            = 3; // 敌方uid
  repeated uint64           oppo_hero_ids       = 4; // 敌方阵容
  repeated uint64           self_hero_ids       = 5; // 自己的阵容
  optional battle_output    output              = 6; // 临时存下战斗结果，只存血量信息
  optional t_battle_result  battle_result       = 7; // 临时存下战斗结果
  required uint64           rand_seed           = 8;
  optional int64            self_score_add      = 9; // 自己的分数变化
  optional int64            oppo_score_add      = 10; // 敌方的分数变化
  optional int64            oppo_before_score   = 11; // 敌方初始分数
  optional uint64           oppo_team_id        = 12; // 敌方队伍id
  optional uint64           oppo_gid            = 13; // 敌方所属公会
  optional uint64           battle_id           = 14; // output 所在的battleID
}

message guild_camp_battle_his {
  required uint64  id         = 1; // days * 10000 + camp_id * 1000 + actionID * 100 + team_id. camp_id:敌方阵营，用于计算不同阵营胜率
  repeated uint64  hero_ids   = 2; // 上阵的英雄id
  required uint64  bt_cnt     = 3 [ default = 0 ]; // 战斗场数
  required uint64  win_cnt    = 4 [ default = 0 ]; // 胜利场数
}

// 行动报名
message guild_camp_act_signup {
  required t_guild_camp_act_type  act_type    = 1; // 报名参与的行动
  required uint64                 id          = 2; // buff_type=scout时，表示针对哪个阵营的buff; buff_type=farm时，表示具体的buff_id
  optional uint64                 signup_ts   = 3; // 报名过期时间
}

// 普通玩家统计信息：整个赛季各个行动战斗次数&胜利次数
message guild_camp_soldier_stat {
  required uint32  action_id   = 1;
  required uint32  times       = 2 [ default = 0 ]; // 出征了多少次
  optional uint64  bt_cnt      = 3 [ default = 0 ];
  optional uint64  win_cnt     = 4 [ default = 0 ];
}

// 玩法类型，部分功能根据时间可能会切换到不同范围: 公会猎宝
enum t_scope_type {
  local   = 1; // 本服玩法
  group   = 2; // 跨服玩法
  global  = 3; // 全服玩法
}

// banner展示信息
message guild_camp_banner {
  optional uint64       camp_id     = 1; // 阵营id
  optional uint64       season_id   = 2; // 赛季id
  optional t_camp_title title       = 3; // 普通玩家 or 大将军
  optional uint64       start_ts    = 4; // 当前赛季或下赛季开启时间
  optional uint64       end_ts      = 5; // 当前赛季或下赛季结束时间
  optional uint64       gid         = 6; // 效力的公会
  optional uint64       open_times  = 7; // 本服开过几次活动
  required t_scope_type scope_type  = 8 [default = local]; // 类型
}


// [tcs]guild_camp 相关
message guild_camp_general_apply {
  required            uint64  uid       = 1; // give_up_general
  map<uint64, uint64>         applies   = 2; // [{uid,ts},...]
}

// 阵营积分面板
message guild_camp_score_panel {
  required uint64            id              = 1; // 公会id 如果需要campID的话，可以用 camp2gid转一下
  required uint64            total_score     = 2; // 阵营总积分
  repeated rank_board_entry  entries         = 3; // top50 | top3
  repeated camp_score_entry  score_entries   = 4; // 各大将军的积分贡献
  optional guild_summary     summary         = 5;
}

message soldier_buff_score {
  required uint64           uid           = 1;
  repeated camp_buff_score  buff_scores   = 2;
}

message auto_bt_season {
  required uint64  season      = 1; // 当前第几赛季
  required uint64  day         = 2; // 当前赛季第几天
  required uint64  war_index   = 3; // 当前赛季第几次出征
}

message assist_battle_cd {
  required t_assist_team  type   = 1;
  required cd             cd     = 2;
}

enum t_assist_event {
  send_apply         = 1; // 发送申请
  recv_apply         = 2; // 收到的申请
  assist_result      = 3; // 代理战斗结果
  send_hamper        = 4; // 送礼盒
  like_send_hamper   = 5; // 给送礼盒行为点赞
}

enum t_assist_event_status {
