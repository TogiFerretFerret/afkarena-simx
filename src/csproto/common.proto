  repeated uint32  recvd_slot_ids   = 2;
}

enum t_raid {
  story          = 1;
  activity       = 2;
  mystic_tower   = 3;
  heroes_lore    = 4;
  dilemma        = 5;
  act_raid_mira  = 6; // 2024隆冬节
  act_raid_monster = 7; //2025周年庆
  act_raid_octopus = 8; // 2025夏活
  contra_newbie      = 9;  // 魂斗罗玩家迷宫
  contra_phoenix     = 10; // 魂斗罗 第四期新支线
  big_rich_man       = 11; // 大富翁
}

message raid {
  optional                     uint32              id                   = 1; // table_id
  required                     uint32              cur_map              = 2 [ default = 0 ];
  required                     uint32              cur_block            = 3 [ default = 0 ];
  repeated                     raid_block          blocks               = 4;
  map<uint64, hero_dyn>                            dyns                 = 5;
  repeated                     uint32              heirlooms            = 6; // 当前拥有的遗物
  repeated                     hero                assist_heroes        = 7;
  map<uint32, uint64>                              effect2cnt           = 8; // Effect生效次数
  repeated                     uint32              battle_hero_tids     = 9; // 最近一次战斗的英雄Table ID
  repeated                     string              histories            = 10; // 策划所配置的history
  repeated                     raid_log            logs                 = 11; // 探索日志
  repeated                     heirloom_param      heirloom_params      = 12; // 遗物参数
  repeated                     raid_sprite         sprites              = 13; // sprite 动画
  map<uint32, raid_diy_reward>                     diy_rewards          = 14; // <reward_id, rewards>
  // 试玩迷宫key形式: raid_type:raid_tid:csv_heroes_lore_id:hero_tid
  // 其他迷宫key形式: raid_type:raid_tid
  required                     string              key                  = 15; // raid key 唯一主键
  optional                     uint64              heirloom_coin        = 16 [ default = 0 ];
  optional                     raid_heirloom_shop  heirloom_shop        = 17; // 遗物商店
  repeated                     int64kv             items                = 18; // 迷宫背包物品
  repeated                     m_hero_act          hero_acts            = 19; // 英雄体力
  optional                     raid_act            raid_act             = 20; // 迷宫体力,解锁迷雾消耗
  optional                     uint64              skin_id              = 21; // 马车皮肤id
  optional                     raid_heirloom_boss  heirloom_boss_info   = 22; // 遗物boss相关
  repeated                     uint64              unlock_area_ids      = 23; // 已解锁的地图区域
  repeated                     raid_task           tasks                = 24; // 迷宫内任务信息
  repeated                     uint64              must_hero_tids       = 25; // effect触发后的必须上阵的英雄
  optional                     big_rich_man_info   big_rich_man_info    = 26; // 大富翁相关
}

message raid_task {
  required uint64  task_id    = 1; // 任务ID
  required uint64  group_id   = 2; // 任务组ID
  required uint64  progress   = 3; // 任务内容进度
}

message raid_heirloom_boss {
  repeated                                         raid_team_heirlooms  team_heirlooms     = 1; // raid遗物boss上次所选遗物
  map<uint64,      raid_heirloom_boss_dmg_rewards>                      boss_reward_map    = 2; // 伤害奖励信息
  repeated                                         uint64               unlock_boss_list   = 3; // 当前解锁的boss列表
}

message raid_team_heirlooms {
  required uint64  id                 = 1; // 队伍id
  required uint64  boss_id            = 2; // bossid
  repeated uint64  active_heirlooms   = 3; // 选择的遗物
}

message raid_heirloom_boss_dmg_rewards {
  optional uint64  max_reward_id   = 1 [ default = 0 ]; // 当前可领取的最大奖励id
  repeated uint64  recvd_list      = 2; // 已领取列表
}

message raid_act {
  required uint64  point            = 1 [ default = 0 ];
  required uint64  last_update_ts   = 2 [ default = 0 ];
}

message raid_diy_reward{
  map<uint32, asset>   diy_assets   = 1; // <idx, rewards>
}

enum s_raid_sprite {
  normal     = 1;
  hidden     = 2;
  inactive   = 3;
}

message raid_sprite {
  required uint32         id                = 1;
  required s_raid_sprite  status            = 2;
  required uint32         block_id          = 3;
  optional uint32         target_block_id   = 4;
}

enum s_raid_block {
  normal         = 1;
  hidden         = 2;
  can_not_view   = 3; // 不能解锁周围周围迷雾类型
}

message cell_mercenary {
  optional uint64  uid    = 1;
  optional string  sign   = 2;
}

message raid_block {
  required              uint32          id                  = 1;
  required              uint32          cell_id             = 2;
  required              s_raid_block    status              = 3 [ default = hidden ];
  map<uint64, hero_dyn>                 oppo_dyns           = 4; // <HeroID, HeroDyn>
  repeated              uint32          heirloom_pool       = 5; // 可选heirloom
  repeated              hero            assist_heroes       = 6; // 可选择的助战英雄
  required              uint64          battle_win_cnt      = 7 [ default = 0 ];
  required              uint64          battle_lost_cnt     = 8 [ default = 0 ];
  repeated              slot_hero       oppo_heroes         = 9;
  optional              reward          reward              = 10; // 公会抢矿总奖励，do_distribute_blocks 中赋值
  optional              cell_mercenary  cell_mercenary      = 11; // 公会抢矿助阵英雄来源
  optional              uint32          height              = 12 [ default = 0 ];
  optional              uint64          unlock_ts           = 13; // 解锁ts 如果有 那么需要检查,时间过才可以交互
  repeated              slot_hero       self_heroes         = 14; // 这里是己方这边的阵容,竞猜相关,使用的机器人阵容
  repeated              uint32          params              = 15; // 这里存一些param数据 gamble地块存了 self oppo gamble的battle_id, 凤凰迷宫的难度等级
  optional              raid_idle       raid_idle           = 16; // 夏日活动英雄挂机,消耗英雄体力,产出活动内道具
  optional              uint32          his_consume_act     = 17; // 夏日活动特殊地块历史总消耗的英雄体力,用来判定随机事件的产生
  map<uint32, bool>                     random_events       = 18; // 夏日活动随机事件 <id,is_recvd>
  optional              uint32          set_oppo_lv         = 19; // 设置敌方等级，guild_trial公会试炼用到该字段
  repeated              uint32          oppo_golden_slots   = 20; // 选择的sp英雄技能
  optional              uint64          expire_ts           = 21; // 超时ts 如果有值 那么需要检查
  optional              uint32          initial_cell_id     = 22; // 初始化时候的cellID（限时会变化的格子保存cellID）
  repeated              big_rich_man_building buildings     = 23; // 大富翁建筑
  repeated              pet             oppo_pets           = 24; // 宠物
}

message raid_idle {
  optional uint64  hero_id      = 1; // 地块产出和派遣的英雄相关,所以需要hero_id
  optional uint64  update_ts    = 2; // 上一次更新挂机进度的时间
  optional uint32  idle_yield   = 3; // 挂机进度
}

message raid_log {
  required uint32  log_id      = 1; // RaidDisplay表的key
  required uint32  timestamp   = 2;
  optional uint64  hero_id     = 3; // 夏日活动产生日志时的英雄id
  repeated item    items       = 4; // 夏日活动收获具体内容
  optional uint64  select_id   = 5; // 周年庆活动-选择的凶手id
}

enum t_raid_condition {
  raid_refresh                  = 1;
