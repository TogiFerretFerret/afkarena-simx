  average       = 1; //平均分
  contribution  = 2; //贡献度
}

// 万圣节活动
message act_pumpkin {
  repeated pumpkin_order           orders                    = 1; // 委托完成情况
  optional uint64                  draw_cnt                  = 2[default=0]; // 抽取南瓜组件的次数
  repeated uint64                  item_ids                  = 3;  // 已获取的南瓜组件id列表(不可重复获得)
  repeated uint64                  day_praise_uids           = 4;  // 每日已点赞的uid列表
  repeated pumpkin_my_diy          diy_his                   = 5;  // diy历史作品
  optional pumpkin_my_diy          medal                     = 6;  // 选作贴纸的diy作品
  optional pumpkin_hero            main_hero                 = 7;  // 活动主英雄的养成信息
  optional pumpkin_map             cur_map                   = 8;  // 当前战斗地图信息
  optional uint64                  pass_stage_count          = 9[default = 0];  // 所有通关关卡累计数量
  repeated uint64                  stage_count_recvd_rewards = 10; // 已经领取的累计通关关卡奖励列表
  repeated uint64                  memory_chip_rewards       = 11; // 已经领取的记忆碎片奖励列表
  repeated uint64                  area_memory               = 12; // 记录进入新区域领取的奖励
}

message pumpkin_order {
  required uint32            id           = 1; //委托id
  repeated uint32            submit_ids   = 2; //玩家提交的南瓜组件id
  optional uint32            star         = 3;
}

// 万圣节活动拼南瓜
message act_pumpkin_craft {
  repeated pumpkin_order           orders                    = 1; // 委托完成情况
  optional uint64                  draw_cnt                  = 2[default=0]; // 抽取南瓜组件的次数
  repeated uint64                  item_ids                  = 3;  // 已获取的南瓜组件id列表(不可重复获得)
  repeated uint64                  day_praise_uids           = 4;  // 每日已点赞的uid列表
  repeated pumpkin_my_diy          diy_his                   = 5;  // diy历史作品
  optional pumpkin_my_diy          medal                     = 6;  // 选作贴纸的diy作品
  repeated uint64                  memory_chip_rewards       = 7; // 已经领取的记忆碎片奖励列表
}


message pumpkin_my_diy {
  required uint64       id    = 1;
  repeated pumpkin_part parts = 2;
}

// 这个结构会被medal系统存储，所以要保持兼容性
message pumpkin_diy {
  repeated pumpkin_part parts = 1;
}

message pumpkin_part {
  required uint64 id       = 1;
  optional uint64 pos_x    = 2; // x坐标
  optional uint64 pos_y    = 3; // y坐标
  optional uint64 rotation = 4; // 旋转 0 ~ 360
  optional bool   mirror   = 5; // 镜像翻转
  optional uint64 scale    = 6; // 伸缩(按照百分比表示)
}

message pumpkin_hero {
  required uint64 tid       = 1; // 主英雄tid
  required uint64 growth_id = 2; // 养成能力成长id
}

message pumpkin_map {
  required  uint64       id           = 1;
  required  pumpkin_area cur_area     = 2; // 只记录当前进行区域
}

message pumpkin_area {
  required  uint64        id                  = 1;
  repeated  pumpkin_stage stages              = 2;
}

message pumpkin_stage {
  required uint64 id                    = 1;
  repeated uint64 self_hero_tids        = 2; // 己方除主英雄之外的可选英雄列表
  optional uint64 battle_id             = 3; // 敌方 battle id
  optional uint64 reward_ts             = 4; // 战斗关卡可以用来判断是否通关，事件关卡用来判断是否领奖
  optional uint64 normal_challenge_cnt  = 5[default = 0]; // 关卡不触发难度升级时玩家挑战该关卡的次数
  optional uint64 challenge_cnt         = 6[default = 0]; // 关卡挑战次数
}

message hamper_info {
  required t_hamper        type             = 1; // 类型
  repeated hamper          hampers          = 2; // 结构
  optional random_lottery  lottery          = 3;
  optional random_lottery  newbie_lottery   = 4;
}

message hamper {
  required uint64  index     = 1; // 位置
  required uint64  init_ts   = 2; // 生成时间戳
}

message random_lottery {
  required uint64  tid   = 1;
  required uint64  m     = 2;
  required uint64  n     = 3;
}

message skin_reward {
  required t_skin_reward type            = 1;
  repeated uint64        recvd_skin_tids = 2; // Skin.csv
}

enum t_skin_reward {
  medal      = 1;
  dyn_avatar = 2; // 动态头像框
}

message act_mira {
  required uint64           act_id                = 1;                // 活动id
  optional uint64           cur_area_id           = 2;                // 当前区域id
  repeated uint64           tool_tids             = 3;                // 工具tid ActMiraTools.csv的主键
  repeated uint64           material_tids         = 4;                // 解锁的材料id ActMiraMaterial.csv的主键
  repeated uint64           recvd_reward_tids     = 5;                // 装饰系列奖励领取状态 ActMiraCollReward.csv的主键
  repeated act_mira_decor   mira_decors           = 6;                // 打造的家具数据
  map<uint64, uint64>       decor2colls           = 7;                // 家具装饰数据 - 每个位置用的哪种外观
  required uint64           lv                    = 8[default = 1];   // 打造等级
  required uint64           exp                   = 9[default = 0];   // 经验点数
  required uint64           exp_build_cnt         = 10;               // 加经验的打造次数
}

message act_mira_decor {
  required uint64     decor_tid       = 1; // 家具tid ActMiraDecorDim.csv的主键
  repeated uint64     last_dims       = 2; // 上次烹饪该食物分配的属性点
  required bool       hide_task_mark  = 3; // 隐藏任务达成标志
  required uint64     score           = 4; // 计分
  optional uint64     tool_tid        = 5; // 工具tid ActMiraTools.csv的主键
  repeated uint64     abs_nums        = 6; // 上一次打造分配属性点与完美分配相差多少？
}

// 账号重生可继承数据
message acc_reborn_info {
  optional uint64                from_uid            = 1; //从哪个角色重生过来的
  optional bool                  is_reborn_stage     = 2; //是否已经跳过了关卡 （空表示还没选择）
  repeated raid_status           raid_status_list    = 3; //可继承进度的副本进度（story类型）
  repeated uint32                raid_reborn_ids     = 4; //已经继承过的副本ID列表（记录的是RaidID）
  optional t_acc_reborn          reborn_type         = 5[default = normal]; //重生的方式
}

enum t_acc_reborn {
  normal   = 1; // 普通重生
  backflow = 2; // 回流活动重生
