message m_map_param {
  required t_m_param         type      = 1;
  optional slg_map_scarecrow scarecrow = 2;
}

enum t_m_param {
  scarecrow = 1; // slg9
}

// slg 9 稻草人地图参数
message slg_map_scarecrow {
  required uint64          alert_value                  = 1[default = 0]; // 警戒值
  repeated slg_fire_block  fire_blocks                  = 2;              // 火焰格子
  optional uint64          fire_idx                     = 3[default = 1]; // 火种id序号
  optional uint64          max_region_id                = 4[default = 1]; // 最高解锁区域id
  optional uint64          last_handle_region_block_id  = 5;              // 最高区域最后操作block_id
}

// slg 9 火焰格子
message slg_fire_block {
  required uint64       id                 = 1;
  required uint64       lv                 = 2;
  required uint64       block_id           = 3;
  optional uint64       src_uid            = 4; // 触发者uid
  repeated uint64       uids               = 5; // 消防员
  repeated uint64       recvd_uids         = 6; // 已经领取奖励的玩家列表
  repeated uint64       spread_fire_blocks = 7; // 自身蔓延的格子id
}

// slg 地图地块参数
message m_block_param {
  required t_m_block_param       type                = 1;
  optional slg_scarecrow_curse   scarecrow_curse     = 2; // slg9 稻草人诅咒机制
  optional slg_spread_fire       spread_fire         = 3; // slg9 被蔓延数据
  optional bool                  kindness_scarecrow  = 4; // slg9 是否是善良稻草人
  optional bool                  boss_alter          = 5; // slg9 是否是boss祭坛
  optional bool                  wheat_active        = 6; // 麦田是否激活
}

enum t_m_block_param {
  scarecrow_curse = 1; // slg9 稻草人诅咒机制
  spread_fire     = 2; // slg9 被蔓延格子
  scarecrow       = 3; // slg9 稻草人机制
  boss_altar      = 4; // slg9 boss祭坛
  wheat           = 5; // slg9 麦田机制
}

// slg 稻草人诅咒信息
message slg_scarecrow_curse {
  repeated uint64 scarecrow_src_block_ids = 1; // 被哪些稻草人格子影响
}

// slg 被蔓延格子信息
message slg_spread_fire {
  required uint64 parent_block_id = 1; // 父火焰id
  optional uint64 fire_ts         = 2; // 被点燃的时间(在被蔓延时计算完成, 如果未到时间则认为未燃烧)
}

