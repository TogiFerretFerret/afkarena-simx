}

enum t_os {
  ios          = 1;
  android      = 2;
  web          = 3;
  wx_ios       = 4;
  wx_android   = 5;
  lilith_ai    = 6; // ai机器人
}

enum t_charge_os {
  ios       = 1;
  android   = 2;
  both      = 3;
}

message stage {
  required uint32        cur_stage              = 1 [ default = 1 ];
  required idle          idle                   = 2;
  required cd            battle_cd              = 3;
  required cd            quick_idle_cd          = 4; // 快速挂机购买cd
  required bool          chapter_over           = 5 [ default = false ]; // 是否需要跳转到世界地图
  repeated special_loot  special_loots          = 6;
  optional uint32        failure_num            = 7 [ default = 0 ]; // 在当前关连续挑战失败了多少次
  optional uint64        stage_failure_cnt      = 8 [ default = 0 ]; // 在当前章节累计挑战失败次数
  optional cd            card_quick_idle_cd     = 9; // 月卡特权产生的快速挂机免费cd
  repeated uint64        recvd_chapter_ids      = 10; // 章节奖励领取标记
  repeated uint64        recvd_drop_hamper_tids = 11; // 已经领取过的礼盒TID列表 csv_stage_drop_hamper.csv
  optional hamper_info   hamper_info            = 12; // 推关礼盒数据
}

message special_loot {
  required uint32  loot_id    = 1;
  required uint32  left_sec   = 2 [ default = 0 ]; // 上次计算剩余的时间
}

//新红点替换旧红点，完全一致时不替换
message red_dot {
  required t_red_dot  type        = 1;
  optional uint64     id          = 2; // 有id时作为联合主键, 没有时以type为主键
  optional uint64     start_ts    = 3; // 开始时间，未到开始时间不生效
  optional uint64     expire_ts   = 4; // 过期时间
}

message ublack_info {
  required uint64  uid         = 1;
  optional uint64  create_ts   = 2;
}

message friend_entry {
  required uint64  uid             = 1;
  required bool    can_recv_gift   = 2 [ default = false ];
}

// user结构下的friend
message user_friend {
  required cd      apply_cd         = 1; // 申请cd
  required cd      present_cd       = 2; // 赠送cd
  required cd      receive_cd       = 3; // 接收cd
  repeated uint64  presented_uids   = 4; // 赠送过的UID, 跨天清空
  repeated uint64  received_uids    = 5; // 接收过的UID, 跨天清空
}

message hero_summary {
  required uint64     id               = 1;
  required uint32     tid              = 2;
  required uint32     quality          = 3;
  required uint32     rank             = 4;
  required uint32     level            = 5;
  optional uint32     skin             = 6;
  optional uint64     gs               = 7;
  optional sig        sig              = 8;
  repeated furniture  furnitures       = 9; // 家具
  optional uint32     totem_total_lv   = 10;
}

message assist_summaries {
  repeated user_summary  friends         = 1; // 好友
  repeated user_summary  guild_members   = 2; // 同工会成员
  repeated user_summary  strangers       = 3; // 填补的一些陌生人
}

message pentagram {
  required uint32        hero_aid_lv          = 1 [ default = 0 ]; // 法阵英雄援助等级(top5平均等级)
  repeated partner_hero  partner_heroes       = 2; // 法阵参与者的英雄ids(240级之前有数据)
  required uint32        pg_lv                = 3 [ default = 0 ]; // 当前共鸣等级，开启共鸣后变为240,开启之前是240
  required uint32        max_pg_lv            = 4 [ default = 0 ]; // 最大共鸣等级（和神话级英雄数量有关）
  optional uint32        his_max_avg_aid_lv   = 5 [ default = 1 ]; // 历史法阵英雄援助平均等级（240级之前有效）
}

// 水晶祭司
message partner_hero {
  required uint32  slot      = 1;
  optional uint32  hero_id   = 2;
}

message red_packet {
  required                     uint32              id              = 1;
  required                     uint64              create_uid      = 2;
  required                     uint64              create_ts       = 3;
  required                     uint32              total_diamond   = 4;
  map<uint32, red_packet_user>                     receivers       = 5;
  required                     t_red_packet_state  state           = 6 [ default = not_received ];
  required                     uint32              recv_order      = 7 [ default = 0 ];
}

message red_packet_user {
  required string  name        = 1;
  required string  avatar      = 2;
  required uint32  diamond     = 3;
  required uint64  reward_ts   = 4;
}

enum t_red_packet_state {
  not_received        = 1;
  received            = 2;
  expired             = 3; // 红包逾期
  max_receive_times   = 4; // 已达最大领取次数
  finished            = 5; // 领完
}

message artifact {
  required uint32  id          = 1;
  required uint32  tid         = 2; // table_id, 配置表ID
  required uint32  awaken_lv   = 3 [ default = 0 ];
  repeated uint64  hero_ids    = 4;
}

message daily_login {
  required uint32  season_id        = 1;
  repeated uint32  recved_rewards   = 2;
}

message stage_reward{
  required uint32  chapter   = 1;
  required uint32  star      = 2;
}

message album {
  required uint32  tid                = 1;
  required uint32  quality            = 2;
  required uint64  last_reward_time   = 3 [ default = 0 ];
}

message challenge_task {
  required uint32  challenge_id       = 1;
  required uint32  task_id            = 2;
  required uint32  progress           = 3 [ default = 0 ]; // 进度
  optional uint64  last_reward_time   = 4;
}

message challenge {
  required uint32          id                  = 1;
  required uint32          challenge_time_id   = 2;
  required bool            closed              = 3 [ default = false ]; // close之后只能领奖
  repeated challenge_task  tasks               = 4;
  repeated asset           today_rcvd_assets   = 5; // 此challenge获得的总奖励
  optional uint64          init_ts             = 6; // 初始化时间，用于确定是否是往期的challenge
}

enum t_dyn_challenge {
  battle_pass_v2   = 1; // 回流_v2
}

message dyn_challenge {
  required t_dyn_challenge     type      = 1;
  required bool                closed    = 2 [ default = false ]; // close之后只能领奖
  repeated dyn_challenge_task  tasks     = 3;
  optional uint64              init_ts   = 4; // 初始化时间
}

message dyn_challenge_task {
  required uint64  task_id            = 1;
  required uint64  progress           = 2 [ default = 0 ]; // 进度
  required uint64  target             = 3;
  optional uint64  last_reward_time   = 4;
}

message rating {
  required t_rating_status  status            = 1 [ default = not_rating ];
  required uint32           tips_show_count   = 2 [ default = 0 ];
}

message activity_info {
  required            uint32      id         = 1;
  required            t_activity  type       = 2;
  map<string, string>             params     = 3;
  optional            act_data    act_data   = 4; // 活动信息的数据,不通用结构的
}

// 个人活动，开始结束时间和csv_activity配置的不一致
message expand_activity {
  required uint64      id          = 1; // 活动id
  required t_activity  type        = 2; // 活动类型
  optional act_data    act_data    = 3; // 活动信息的数据
  required uint64      show_ts     = 4 [default = 0]; // 展示时间
  required uint64      start_ts    = 5 [default = 0]; // 开始时间
  required uint64      end_ts      = 6 [default = 0]; // 结束时间
  required uint64      delay_ts    = 7 [default = 0]; // 延迟时间
  optional uint64      delete_ts   = 8; // 删除时间, undefined表示永远不删
  optional bool        is_end      = 9 [default = false]; // 是否执行过end_activity逻辑
}

message act_data {
  optional activity_boss         activity_boss         = 1; // 活动boss
  optional act_accel             act_accel             = 2; // 关卡加速
  optional act_inv               act_inv               = 3; // 刮奖召回活动
  optional act_rank_boss         act_rank_boss         = 4; // 活动排行榜boss
  optional act_task              act_task              = 5; // 类似每周每日任务，使用该数据的功能: rt_pvp
  optional sp_sell               sp_sell               = 6; // sp预售活动
  optional act_quiz              act_quiz              = 7; // 答题活动
  optional act_painting          act_painting          = 8; // 绘画活动（大事件）
  optional act_rank_climb        act_rank_climb        = 9; // 开服冲榜
  optional act_welfare           act_welfare           = 10; // 福利汇总
  optional act_labor_wish        act_labor_wish        = 11; // 达成目标领取奖励活动
  optional act_guild_box         act_guild_box         = 12; // 轻度社交活动 - 公会箱子
  repeated item                  items                 = 13; // 活动内道具
  optional act_sign_in_warm      act_sign_in_warm      = 14; // 2023周年庆预热活动
  optional act_pumpkin           act_pumpkin           = 15; // 万圣节活动
  optional act_user_guild_haggle act_user_guild_haggle = 16; // 公会砍价
  optional act_fission           act_fission           = 17; // h5分享裂变活动
  optional expand_handsel_super  expand_handsel_super  = 18; // 累充活动
  optional act_trial             act_trial             = 19; // 演武试炼
  optional act_mira              act_mira              = 20; // 2024年隆冬节养女儿，mira是女儿的名字
  optional act_tavern_cross      act_tavern_cross      = 21; // 虚空抽卡活动次数累计进度奖励数据
  optional act_compose_clue      act_compose_clue      = 22; // 线索合成活动
  optional act_present           act_present           = 23; // 送花活动
  optional act_raid_monster      act_raid_monster      = 24; // 2025周年庆
  optional act_backflow          act_backflow          = 25; // 回流活动
  optional act_endless_draw      act_endless_draw      = 26; // 无尽抽卡活动
  optional act_combin            act_combin            = 27; // 章鱼活动 2025夏活
  optional act_pumpkin_craft     act_pumpkin_craft     = 28; // 万圣节 -- 拼南瓜
  optional act_pumpkin_brawl     act_pumpkin_brawl     = 29; // 2025万圣节
  optional act_turntable         act_turntable         = 30; // 转盘活动
  optional act_guild_arm         act_guild_arm         = 31; // 新服军备竞赛
  optional act_fish              act_fish              = 32; // 钓鱼活动
  optional act_care_pet          act_care_pet          = 33; // 2026周年庆，养龙宠打boss
  optional act_user_guild_contra act_user_guild_contra = 34; // 魂斗罗 公会活动 玩家数据
  optional act_limit_divine_pool act_limit_divine_pool = 35; // 限时神魔池
  optional act_bond              act_bond              = 36; // 虚空赠礼
  optional act_farm              act_farm              = 37; // 2026夏活 农场
  optional act_farm_lottery      act_farm_lottery      = 38; // 2026夏活 赛车
  optional act_cross_story       act_cross_story       = 39; // 联动英雄活动
}

message act_limit_divine_pool {
  required uint32 used_times   = 1 [default = 0];     // 期内累积抽取次数
  optional uint32 hero_tid     = 2;                   // 当前选中英雄ID
  repeated act_limit_divine_pool_recvd_rewards  recvd_rewards = 3;                   // 已领取的返利档位ID和英雄列表
  optional uint32 body_count   = 4 [default = 0];     // 期内全池本（用于白体计数5上限判断）
}

message act_limit_divine_pool_recvd_rewards {
    required uint64 id       = 1; // 领取的返利档位ID
    optional uint64 hero_tid = 2; // 领取的英雄ID或0
}

message act_turntable {
  required uint64         draw_cnt         = 1[default=0]; // 抽奖次数
  repeated uint64         drawn_big_tids   = 2; // 抽到过的大奖的tid
  repeated uint64         recvd_tids       = 3; // 已经领取的进度奖励
  required uint64         discount_num     = 4[default=0]; // 折扣币的数量
  repeated turntable_guar guar_list        = 5; // 保底
}

enum t_turntable_guar {
  first_prize    = 1; // 大奖保底
  double_drop    = 2; // 双倍保底
}

message turntable_guar {
  required t_turntable_guar type         = 1; // 保底类型
  required uint32           target       = 2;
  required uint32           progress     = 3;
}

message act_endless_draw {
  optional uint64              count       = 1;
  optional uint64              reward_id   = 2; // 确认领取的抽卡结果id
  optional endless_draw_result last        = 3;
  optional endless_draw_result save        = 4;
  repeated endless_draw_guar   guars       = 5;
}

message endless_draw_guar {
  required uint64 skin_cnt             = 1;
  required uint64 god_devil_hero_cnt   = 2;
  required uint64 purple_hero_cnt      = 3;
  required uint64 target               = 4;
  required uint64 progress             = 5;
}

message endless_draw_result {
  required uint64 id     = 1;
  repeated asset  assets = 2;
}

message act_backflow {
  optional bool                   is_acc_reborn            = 1[default = false]; // 是否账号重生
  repeated uint64                 recvd_ids                = 2; // 已经领取过的活跃度IDS
  optional uint64                 active_points            = 3[default = 0]; //已经累计的活跃度
}

message act_present {
  required uint64                 send_total               = 1[default = 0]; //总共送出去的花
  required uint64                 recvd_idx                = 2[default = 1]; //收花记录唯一ID自增
  repeated recvd_present_record   recvd_present_records    = 3; //收到的花记录用于回赠
  repeated recv_present           recvd_presents           = 4; //收到玩家X一共多少数量的花
  repeated send_present           send_presents            = 5; //送出去给玩家X一共多少花
  optional bool                   can_join                 = 6; //同uin下限制可参与的角色数量
  optional uint64                 can_join_ts              = 7; //同uin下限制可参与的角色数量
  required bool                   is_bind_acc              = 8[default = false]; //是否绑定了账号
}

message send_present {
  required uint64            recv_uid    = 1; //收到花UID
  required uint64            send_ts     = 2; //我最后一次给这个玩家送花的时间
  required uint64            send_total  = 3; //我总共给这个玩家送了多少花
}

message recv_present {
  required uint64            send_uid    = 1; //送花UID
  required uint64            recvd_ts    = 2; //最后一次收到这个玩家花的时间
  required uint64            recvd_total = 3; //总共收到了这个玩家花的数量
}

message recvd_present_record {
  required uint64             idx         = 1; //记录唯一ID
  required uint64             send_uid    = 2; //送花的UID
  required uint64             recvd_ts    = 3; //收到花的时间
  required uint64             recvd_num   = 4[default = 0]; //收到的花数量
  required bool               is_rebate   = 5; //是否回赠了
}

message act_raid_monster {
  required uint64                act_id                = 1;
  optional uint64                cur_area_id           = 2;
  repeated raid_monster          monsters              = 3; //活动内已经获得的小怪兽
  repeated uint64                equips                = 4; //活动内的装备背包
  optional uint64                coin                  = 5[default = 0]; //活动内的金币
  repeated uint64                gadgets               = 6; //活动内副本获得的小道具
  repeated raid_monster_boss     bosses                = 7; //已经解锁的BOSS列表
  repeated uint64                recvd_task_ids        = 8; //已经领取过奖励的打工任务列表
  repeated uint64                purchase_shop_items   = 9; //已经买过的商店道具列表(E:SlotID)
}

message raid_monster_boss {
  required uint64                tid                   = 1; //BOSS ID
  repeated uint64                passed_stage_ids      = 2; //已经通关的怪物ID
  optional uint64                star                  = 3; //最终BOSS的完成星级
  optional uint64                best_damage           = 4; //无尽模式BOSS最高伤害
}

message raid_monster {
  required uint64                tid                   = 1; //小怪兽ID
  map<uint64, uint64>            equips                = 2; //穿上的装备 <Slot, EquipID>
}

message act_tavern_cross {
  required uint64             progress  = 1[default=0];
  repeated uint64             recvd_ids = 2;
}

message act_trial {
  required cd            cd             = 1;
  optional user_summary  oppo_summary   = 2;
  repeated slot_hero     oppo_heroes    = 3;
}

message expand_handsel_super {
  repeated uint64 recvd_phase_tids = 1;// 已经领取过的阶段奖励 csv_expand_handsel_super_phase
}

message act_fission {
  repeated uint64                 invite_uids     = 1;  // 成功邀请过玩家的UIDs
  repeated act_fission_reward     reward_map      = 2;  // 每个袋子随出来的奖励
  repeated uint64                 recv_uids       = 3;  // 已经领取过的好友任务，这里记录的是好友的UID
  optional uint64                 share_cnt       = 4[default = 0];  // 分享次数（点了分享就计数）
}

message act_fission_reward {
  required uint64         pack_id       = 1; // 领奖袋子ID
  optional uint64         check_reward  = 2; // 袋子随出来的奖励
  optional uint64         set_reward    = 3; // 抽来后确认待领取的奖励
  optional uint64         recv_ts       = 4; // 领奖时间戳
}

message act_user_guild_haggle {
  required bool     haggled      = 1[ default = false ]; // 砍过价标识
  optional uint64   bought_ts    = 2; // 购买标识
  optional uint64   bought_price = 3; // 购买时的价格
  required uint64   record_index = 4[ default = 0 ] ;    // 已经阅读的砍价记录索引
}

// guild_box开箱数据目前最多24条（活动开启天数6天 * 每天可以领取的宝箱4个），数据量不会很大所以可以把历史的give_uis保存在玩家身上
message act_guild_box {
  map<string, act_guild_box_reward_info>  guild_box     = 1; // 公会宝箱奖励 {"10001:1", 0} 表示10001公会轮次tid=1这个箱子已经从公会发奖了，但是玩家还有没领取；{"10001:1", ts} 表示玩家已经领奖了并记录下领奖时间
  map<uint64, uint64>                     reward_ts     = 2; // 个人进度领奖状态 {1, ts}
  optional uint64                         last_cnt      = 3[default = 0]; // 距离上一次进入活动玩家获得的个人道具数量
}

message act_guild_box_reward_info {
  required uint64       reward_ts = 1;
  repeated uint64       give_uids = 2; // 这一轮宝箱贡献钥匙的玩家。开箱历史贡献玩家只能保存在玩家身上，因为策划不接受退公会直接给玩家补宝箱奖励
}

message act_welfare {
  repeated asset   assets     = 1;
  optional uint64  star_cnt   = 2 [ default = 0 ];
  optional uint64  recv_ts    = 3 [ default = 0 ];
}

message act_rank_climb {
  repeated rank_climb_chapter  chapters   = 1; // 玩家各章节的冲榜数据
}

message rank_climb_chapter {
  required uint32  chapter_id   = 1; // 章节ID
  required uint32  reward_id    = 2; // 达成的奖励ID
  required bool    is_recvd     = 3; // 是否已经领取过
  required uint32  rank_pos     = 4; // 排名
  required uint32  timestamp    = 5; // 通关时间
}

// 开服冲榜的章节奖励信息
message rank_climb_chapter_reward {
  optional uint32  chapter_id     = 1; // 章节ID
  optional uint32  reward_id      = 2; // 当前章节奖励的档位
  optional uint32  reward_count   = 3; // 当前章节奖励的剩余数量（0表示无限）
}

message act_rank_boss {
  required uint32                boss_id           = 1;
  required cd                    battle_cd         = 2;
  required cd                    refresh_cd        = 3;
  repeated normal_battle_record  his_battle_info   = 4; // Boss战斗记录
  required uint64                battle_cnt        = 5 [ default = 0 ]; // 战斗次数
  repeated uint64                recvd_ids         = 6; // 已经领取的奖励的ids
}

message act_inv {
  optional string  invite_code         = 1; // 唯一邀请码
  required uint32  can_draw_times      = 2; // 可抽奖次数
  repeated uint32  recvd_ids           = 3; // 已经领取的奖励id
  optional uint64  last_share_ts       = 4; // 上一次分享时间
  required uint64  last_restore_time   = 5; // 上一次登录获取刮奖次数时间
  required uint32  user_type           = 6; // 玩家类型，1活动玩家；2回流玩家
  optional uint64  init_ts             = 7; // 活动数据初始化时间
  repeated string  fill_in_codes       = 8; // 已经填写过的邀请码列表
}

message common_assist {
  required uint64         uid                     = 1;
  optional t_assist_type  type                    = 2; // 求助类型
  repeated assist_apply   applies                 = 3; // 求助其他列表
  repeated assist_apply   recvd_applies           = 4; // 被其他人求助列表
  required uint64         can_help_cnt            = 5 [ default = 0 ]; // 剩余帮助其他人的次数
  repeated assist_log     wait_recv_assist_logs   = 6; // 别人帮助我，待领取的记录，长度有上限
  repeated assist_log     assist_logs             = 7; // 历史记录
}

enum t_assist_type {
  maze_assist   = 1; // 迷宫互助
  shoot_game    = 2; // 暗影入侵小游戏
  act_fish      = 3; // 钓鱼活动互助
}

// 已领取记录
message assist_log {
  required uint64  source_uid   = 1; // 助人的玩家uid
  required uint64  target_uid   = 2; // 受助的玩家uid
  required uint64  apply_ts     = 3; // 求助时间点
  required uint64  accept_ts    = 4; // 帮助时间点
  optional uint64  recvd_ts     = 5; // 领奖时间点
  optional uint64  reject_ts    = 6; // 拒绝领奖时间点
  repeated uint64  params       = 7; // 额外属性
}


message act_accel {
  required cd                    battle_cd         = 1;
  required cd                    refresh_cd        = 2;
  repeated normal_battle_record  his_battle_info   = 3;
  required uint64                max_damage        = 4 [ default = 0 ];
  required uint64                total_damage      = 5 [ default = 0 ];
}

message activity_boss{
  required cd                 cd             = 1;
  required uint64             query_his_ts   = 2 [ default = 0 ];
  repeated activity_boss_his  his            = 3;
  optional uint32             best_param     = 4 [ default = 0 ]; // 最高击杀数或者最高伤害百分比
}

message activity_boss_his{
  repeated asset   assets      = 1;
  required uint32  timestamp   = 2;
  required uint64  battle_id   = 3;
}

message daily_login_act {
  required uint32  act_id                 = 1;
  repeated uint32  recvd_daily_rewards    = 2;
  required uint64  last_final_reward_ts   = 3;
  repeated uint32  recvd_notes            = 4; // 已获取的音符
  optional uint64  last_final_note_ts     = 5 [ default = 0 ]; // 最后获取音符时间
  repeated uint32  login_days             = 6; // 活动期间登录了多少天
  repeated uint32  used_notes             = 7; // 已使用的音符
  optional uint64  end_time               = 8; // 回归100抽活动结束时间
}

enum t_calendar_act_subscribe_type {
  mystic_tower   = 1; // 秘宝峡湾
  infinite       = 2; // 乱时之境
  curseland      = 3; // 诅咒梦境
  race_dream     = 4; // 竞速梦境
