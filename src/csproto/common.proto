// 虚空赠礼
message act_bond {
  repeated act_bond_send_gift_info send_gift_infos = 1; //赠送礼物列表
}

message act_bond_send_gift_info {
  required uint64 hero_tid = 1; // 英雄tid
  optional uint64 point    = 2[default = 0]; // 分数
}
//============================================================
// 2026夏活 农场
//============================================================
message act_farm {
    required uint64               act_id              = 1;
    required uint64               lv                  = 2 [default = 1];
    required uint64               exp                 = 3 [default = 0];
    repeated act_farm_plot        plots               = 4;
    optional act_farm_visitor     visitor             = 5; // 英雄来访
    optional act_farm_album       album               = 6; // 图鉴
    required uint64               harvest_cnt         = 7 [default = 0]; // 收获次数
    required uint64               last_take_ts        = 8 [default = 0]; // 上次领取每日奖励的时间戳
    required uint32               privilege_active    = 9 [default = 0];
    required uint64               privilege_take_ts   = 10 [default = 0]; // 上次领取特权奖励的时间戳
    repeated act_farm_buy_limit   buy_limit_list      = 11;
    optional heirloom_boss_info   heirloom_boss_info  = 12; // 遗物boss 与raid解绑版
    repeated heirloom_boss        heirloom_bosses     = 13; // 遗物boss 与raid绑定版
    repeated uint32               heirlooms           = 14; // 当前拥有的遗物
    repeated uint64               triggered_tids      = 15; // 已触发的 buff 触发器 id 列表
}

message act_farm_buy_limit {
    required uint64 item_id    = 1;
    optional cd     buy_limit  = 2;
}

// 农场地块
message act_farm_plot {
    required uint64              id              = 1;
    required t_farm_plot_state   state           = 2; // 状态
    optional uint64              type_tid        = 3; // 产出类型
    required bool                is_chosen_type  = 4 [default = false]; // 是否已经选择地块产出类型
    optional uint64              plant_ts        = 5 [default = 0]; // 种植时间
    optional uint64              mature_ts       = 6 [default = 0]; // 成熟时间
    repeated act_farm_plot_buff  buffs           = 7;
}

message act_farm_plot_buff {
    required uint64 buff_id    = 1;
    required bool   is_handled = 2 [default = false]; // 是否已经处理了
}

message act_farm_visitor {
    required uint64 buff_id        = 1;
    required uint64 start_ts       = 2;
    required uint64 end_ts         = 3;  // 结束时间
    required uint64 effect_times   = 4;  // 剩余次数
}

// 农场图鉴
message act_farm_album {
    repeated act_farm_album_group  groups         = 1;
    optional uint64                reward_ts      = 2; // 领取最终奖励的时间戳
}

message act_farm_album_group {
    required uint64              group_id       = 1;
    repeated act_farm_album_item items          = 2;
    optional uint64              reward_ts      = 3; // 领取组奖励的时间戳
}

message act_farm_album_item {
    required uint64             item_id         = 1;
    optional uint64             reward_ts       = 2;
}

enum t_farm_plot_state {
    idle        = 0; // 空闲
    growing     = 1; // 成长中
    harvestable = 2; // 可收获
}

enum t_farm_album_reward {
  final            = 1; // 最终奖励
  group            = 2; // 组奖励
  item             = 3; // 单个奖励
}

message act_farm_item {
    required uint32  id       = 1;
    required uint64  amount   = 2;
    required bool    is_new   = 3;
}

//============================================================
// 2026夏活 赛车
//============================================================
message act_farm_lottery {
    required uint64                          total_distance = 1 [default = 0]; // 累积距离
    repeated act_farm_lottery_recvd_progress recvd_progress = 2;               // 各奖励已领取次数
    required uint64                          race_times     = 3 [default = 0]; // 抽奖次数
}
message act_farm_lottery_recvd_progress {
    required uint64 tid    = 1; // 奖励id
    required uint64 cnt    = 2; // 已领取次数
}

//============================================================
// 公会转盘
//============================================================
message guild_turntable_event {
    required uint64        event_id      = 1;  // 事件id
    optional uint64        result_id     = 2;  // 结果id，供客户端展示
    optional user_summary  user_summary  = 3; // 共两种事件，qte事件只需要返回 eventid和resultid；另一个事件仅需返回eventid和usersummary
}

message guild_turntable_log {
    required uint64  block_tid = 1;  // 格子配置id
    optional reward  rewards   = 2;  // 奖励
    required uint64  time      = 3;  // 时间
}

//============================================================
// 公会跑船
//============================================================

// 派遣中的船
message guild_boat_dispatch {
    required uint64              slot_pos          = 1;                   // 槽位
    required uint64              boat_tid          = 2;                   // 船tid
    required t_guild_boat_state  state             = 3;                   // 状态
    required uint64              start_ts          = 4 [default = 0];     // 出发时间
    required uint64              end_ts            = 5 [default = 0];     // 结束时间
    required bool                is_req_assist     = 6 [default = false]; // 是否已请求协助
    repeated guild_boat_assist   assists           = 7;                   // 已协助列表
    optional uint64              sp_assist_uid     = 8;                   // 特别协助uid
}

// 协助信息
message guild_boat_assist {
    required uint64  uid         = 1; // 协助玩家uid
    required uint64  assist_ts   = 2; // 协助时间
    required uint64  reduce_sec  = 3; // 减少秒数
}

// 出船日志
message guild_boat_log {
    required uint64  boat_tid   = 1; // 船tid
    required uint64  start_ts   = 2; // 出发时间
    required uint64  end_ts     = 3; // 结束时间
    optional reward  reward     = 4; // 奖励
    repeated int64   grid_uids  = 5; // 宝箱格子uid列表
}

enum t_guild_boat_be_assist_result {
    full      = 1; // 协助已满
    success   = 2; // 成功
    assisted  = 3; // 已经协助过
    exception = 4; // 异常
}

enum t_guild_boat_state {
    dispatching = 1; // 航行中
    arrived     = 2; // 已到港
}

//================================================ 联动英雄活动 begin ==================================================
// 玩家侧活动数据（act_data 子消息，随通用 activity 协议下发）
message act_cross_story {
  optional uint64 choice_hero           = 1 [ default = 0 ]; // 所选联动英雄TID（0=未选择）
  repeated uint64 passed_stage_ids      = 2; // 已通关的地图关卡ID列表
  repeated uint64 recvd_guild_stage_ids = 3; // 已领取公会讨伐档位奖励的BossID列表（按stage去重）
}
//================================================ 联动英雄活动 end ====================================================